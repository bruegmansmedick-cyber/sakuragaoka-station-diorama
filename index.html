<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="桜ヶ丘駅：可切换晴雨雪与夕阳、蓝调、傍晚的日式樱花车站 3D 微缩景观，支持浏览器和 Electron 桌景。" />
  <meta name="author" content="Google Gemini, DeepSeek and project contributors" />
  <meta name="theme-color" content="#dceeff" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ffc8dd'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23fff0f6'/%3E%3C/svg%3E" />
  <title>桜ヶ丘駅 · 日式樱花车站 3D 微缩景观</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #f6fbff 0%, #dceeff 52%, #c5def6 100%);
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      outline: none;
    }
    canvas:active {
      cursor: grabbing;
    }
    #sakura-atmosphere {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 1000;
      color: #26384b;
      font-family: "Yu Gothic UI", "Microsoft YaHei", sans-serif;
      pointer-events: auto;
    }
    .atmo-trigger,
    .atmo-panel {
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(255, 246, 250, 0.82));
      box-shadow:
        0 12px 34px rgba(45, 75, 102, 0.16),
        inset 0 0 0 1px rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
    }
    .atmo-trigger {
      min-width: 162px;
      height: 38px;
      padding: 0 13px;
      border: 0;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: inherit;
      font: 600 12px/1 "Yu Gothic UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      touch-action: manipulation;
    }
    .atmo-trigger:hover {
      transform: translateY(-1px);
    }
    .atmo-trigger:focus-visible,
    .atmo-option:focus-visible,
    .atmo-close:focus-visible {
      outline: 2px solid #ff7fa7;
      outline-offset: 2px;
    }
    .atmo-trigger-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .atmo-chevron {
      font-size: 10px;
      opacity: 0.54;
      transition: transform 180ms ease;
    }
    #sakura-atmosphere.is-open .atmo-chevron {
      transform: rotate(180deg);
    }
    .atmo-panel {
      position: absolute;
      right: 0;
      bottom: 48px;
      width: 258px;
      padding: 13px;
      border-radius: 18px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px) scale(0.98);
      transform-origin: right bottom;
      transition:
        opacity 170ms ease,
        visibility 170ms ease,
        transform 170ms ease;
      pointer-events: none;
    }
    #sakura-atmosphere.is-open .atmo-panel {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .atmo-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 12px;
    }
    .atmo-panel-head strong {
      font-size: 12px;
      letter-spacing: 0.06em;
    }
    .atmo-close {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #52677b;
      background: rgba(74, 101, 125, 0.08);
      cursor: pointer;
    }
    .atmo-section + .atmo-section {
      margin-top: 11px;
    }
    .atmo-label {
      display: block;
      margin: 0 2px 6px;
      color: #74879a;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .atmo-options {
      display: grid;
      gap: 6px;
    }
    .atmo-time-options {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .atmo-weather-options {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .atmo-option {
      min-width: 0;
      height: 42px;
      padding: 5px 4px;
      border: 1px solid rgba(93, 119, 143, 0.11);
      border-radius: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #4b6276;
      background: rgba(255, 255, 255, 0.55);
      font: 600 10px/1.1 "Yu Gothic UI", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        color 150ms ease,
        background 150ms ease,
        border-color 150ms ease,
        transform 150ms ease;
    }
    .atmo-option:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.82);
    }
    .atmo-option[aria-pressed="true"] {
      color: #9a3156;
      border-color: rgba(255, 127, 167, 0.52);
      background: linear-gradient(145deg, rgba(255, 241, 247, 0.98), rgba(255, 219, 231, 0.9));
      box-shadow: 0 4px 12px rgba(240, 103, 144, 0.14);
    }
    .atmo-option-icon {
      font-size: 16px;
      line-height: 1;
    }
    .atmo-hint {
      margin: 11px 2px 0;
      color: #8193a4;
      font-size: 9px;
      line-height: 1.45;
    }
    @media (max-width: 560px), (max-height: 620px) {
      #sakura-atmosphere {
        right: 10px;
        bottom: 10px;
      }
      .atmo-trigger {
        min-width: 146px;
        height: 35px;
      }
      .atmo-panel {
        width: min(258px, calc(100vw - 20px));
        bottom: 44px;
      }
    }
  </style>
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>
  <script src="./vendor/BufferGeometryUtils.js"></script>
</head>
<body>
<aside id="sakura-atmosphere" aria-label="天气与时段控制">
  <div class="atmo-panel" id="atmo-panel">
    <div class="atmo-panel-head">
      <strong>场景氛围</strong>
      <button class="atmo-close" id="atmo-close" type="button" aria-label="收起氛围控制">×</button>
    </div>
    <section class="atmo-section" aria-labelledby="atmo-time-label">
      <span class="atmo-label" id="atmo-time-label">时段</span>
      <div class="atmo-options atmo-time-options" role="group" aria-labelledby="atmo-time-label">
        <button class="atmo-option" type="button" data-time="day" aria-pressed="true">
          <span class="atmo-option-icon" aria-hidden="true">☀️</span><span>白昼</span>
        </button>
        <button class="atmo-option" type="button" data-time="sunset" aria-pressed="false">
          <span class="atmo-option-icon" aria-hidden="true">🌇</span><span>夕阳</span>
        </button>
        <button class="atmo-option" type="button" data-time="blueHour" aria-pressed="false">
          <span class="atmo-option-icon" aria-hidden="true">🌆</span><span>蓝调时刻</span>
        </button>
        <button class="atmo-option" type="button" data-time="dusk" aria-pressed="false">
          <span class="atmo-option-icon" aria-hidden="true">🌙</span><span>傍晚</span>
        </button>
      </div>
    </section>
    <section class="atmo-section" aria-labelledby="atmo-weather-label">
      <span class="atmo-label" id="atmo-weather-label">天气</span>
      <div class="atmo-options atmo-weather-options" role="group" aria-labelledby="atmo-weather-label">
        <button class="atmo-option" type="button" data-weather="clear" aria-pressed="true">
          <span class="atmo-option-icon" aria-hidden="true">☀️</span><span>晴天</span>
        </button>
        <button class="atmo-option" type="button" data-weather="rain" aria-pressed="false">
          <span class="atmo-option-icon" aria-hidden="true">🌧️</span><span>下雨</span>
        </button>
        <button class="atmo-option" type="button" data-weather="snow" aria-pressed="false">
          <span class="atmo-option-icon" aria-hidden="true">❄️</span><span>下雪</span>
        </button>
      </div>
    </section>
    <p class="atmo-hint">天气与时段可自由组合。拖动场景区域仍可旋转观赏。</p>
  </div>
  <button class="atmo-trigger" id="atmo-trigger" type="button" aria-expanded="false" aria-controls="atmo-panel">
    <span class="atmo-trigger-main">
      <span id="atmo-summary-icon" aria-hidden="true">☀️</span>
      <span id="atmo-summary">晴天 · 白昼</span>
    </span>
    <span class="atmo-chevron" aria-hidden="true">▲</span>
  </button>
</aside>
<script>
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 260);
  camera.position.set(28, 21, 31);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance',
    alpha: false
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.localClippingEnabled = true;
  renderer.domElement.setAttribute('role', 'application');
  renderer.domElement.setAttribute('aria-label', '可交互的日式樱花车站三维微缩景观，可拖动旋转并使用滚轮缩放');
  renderer.domElement.tabIndex = 0;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2.2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.maxPolarAngle = Math.PI / 2 - 0.03;
  controls.minPolarAngle = 0.08;
  controls.minDistance = 8;
  controls.maxDistance = 85;
  controls.update();

  // Shared reset hook used by both the Electron tray menu and title bar.
  window.addEventListener('sakura:diorama-reset', () => {
    camera.position.set(28, 21, 31);
    controls.target.set(0, 2.2, 0);
    controls.update();
  });

  const BASE_SIZE = 38;
  const HALF_BASE = BASE_SIZE / 2;
  const CYCLE_DURATION = 30.0;
  const PLATFORM_NORTH_EDGE = -11.7;
  const PLATFORM_SOUTH_EDGE = -7.65;
  const PLATFORM_TOP_Y = 1.38;
  const ACTOR_DEFAULT_SCALE = 0.88;
  const dummy = new THREE.Object3D();

  // Clipping planes at the East/West diorama boundaries for the train
  const trainClipPlanes = [
    new THREE.Plane(new THREE.Vector3(1, 0, 0), HALF_BASE - 0.05),
    new THREE.Plane(new THREE.Vector3(-1, 0, 0), HALF_BASE - 0.05)
  ];

  // 4-tone cel-shading gradient texture
  const gradData = new Uint8Array([
    105, 105, 118, 255,
    168, 168, 178, 255,
    224, 224, 230, 255,
    255, 255, 255, 255
  ]);
  const toonGradient = new THREE.DataTexture(gradData, 4, 1, THREE.RGBAFormat);
  toonGradient.minFilter = THREE.NearestFilter;
  toonGradient.magFilter = THREE.NearestFilter;
  toonGradient.needsUpdate = true;

  // Soft anime sky dome
  const skyGeo = new THREE.SphereGeometry(135, 32, 24);
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      uHorizon: { value: new THREE.Color(0xf2f7ff) },
      uMidSky: { value: new THREE.Color(0xa9d9fa) },
      uZenith: { value: new THREE.Color(0x52a3ee) },
      uOvercast: { value: 0.0 },
      uOvercastColor: { value: new THREE.Color(0xcbd8e2) },
      uTime: { value: 0.0 }
    },
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: `
      varying vec3 vWorldPosition;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPosition = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 uHorizon;
      uniform vec3 uMidSky;
      uniform vec3 uZenith;
      uniform vec3 uOvercastColor;
      uniform float uOvercast;
      uniform float uTime;
      varying vec3 vWorldPosition;
      void main() {
        float h = clamp((vWorldPosition.y + 15.0) / 115.0, 0.0, 1.0);
        vec3 col = mix(uHorizon, uMidSky, smoothstep(0.0, 0.42, h));
        col = mix(col, uZenith, smoothstep(0.42, 1.0, h));
        float cloudWave =
          sin(vWorldPosition.x * 0.036 + uTime * 0.018) * 0.52 +
          cos(vWorldPosition.z * 0.045 - uTime * 0.011) * 0.34 +
          sin((vWorldPosition.x + vWorldPosition.z) * 0.021) * 0.20;
        float cloudMask = smoothstep(-0.12, 0.56, cloudWave) * smoothstep(0.04, 0.42, h);
        col = mix(col, uOvercastColor, uOvercast * (0.54 + cloudMask * 0.25));
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  const sceneFog = new THREE.Fog(0xe7f2fb, 120, 260);
  scene.fog = sceneFog;

  // Warm afternoon anime daylight setup
  const hemiLight = new THREE.HemisphereLight(0xfffdf8, 0xc7def5, 0.86);
  hemiLight.position.set(0, 45, 0);
  scene.add(hemiLight);

  const sunLight = new THREE.DirectionalLight(0xfff7e8, 1.18);
  sunLight.position.set(22, 34, -24);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 5;
  sunLight.shadow.camera.far = 95;
  const dCam = 25;
  sunLight.shadow.camera.left = -dCam;
  sunLight.shadow.camera.right = dCam;
  sunLight.shadow.camera.top = dCam;
  sunLight.shadow.camera.bottom = -dCam;
  sunLight.shadow.bias = -0.0005;
  scene.add(sunLight);

  const fillLight = new THREE.DirectionalLight(0xdbeeff, 0.34);
  fillLight.position.set(-20, 18, 22);
  scene.add(fillLight);

  const globalUniforms = {
    uTime: { value: 0.0 },
    uTrainOpacity: { value: 1.0 }
  };

  function applyCloudShadowShader(material, shadowStrength = 0.11, saturationBoost = 1.28, isTrainMat = false) {
    material.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = globalUniforms.uTime;
      shader.uniforms.uTrainOpacity = globalUniforms.uTrainOpacity;
      shader.uniforms.uCloudStrength = { value: shadowStrength };
      shader.uniforms.uSatBoost = { value: saturationBoost };
      shader.uniforms.uIsTrain = { value: isTrainMat ? 1.0 : 0.0 };
      shader.vertexShader = `
        varying vec3 vWorldPosCloud;
      ` + shader.vertexShader.replace(
        '#include <worldpos_vertex>',
        `#include <worldpos_vertex>
         vWorldPosCloud = (modelMatrix * vec4(transformed, 1.0)).xyz;`
      );
      shader.fragmentShader = `
        uniform float uTime;
        uniform float uTrainOpacity;
        uniform float uCloudStrength;
        uniform float uSatBoost;
        uniform float uIsTrain;
        varying vec3 vWorldPosCloud;
      ` + shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        `
        vec2 cUv = vWorldPosCloud.xz * 0.075 + vec2(uTime * 0.022, uTime * 0.011);
        float cWave = sin(cUv.x * 1.9 + sin(cUv.y * 1.5)) * cos(cUv.y * 2.1 + cos(cUv.x * 1.3));
        float cloudMask = smoothstep(0.18, 0.62, cWave);
        gl_FragColor.rgb *= (1.0 - cloudMask * uCloudStrength);
        float luma = dot(gl_FragColor.rgb, vec3(0.299, 0.587, 0.114));
        gl_FragColor.rgb = clamp(mix(vec3(luma), gl_FragColor.rgb, uSatBoost), 0.0, 1.0);
        if (uIsTrain > 0.5) {
          float edgeFade = smoothstep(18.9, 13.8, abs(vWorldPosCloud.x));
          gl_FragColor.a *= (uTrainOpacity * edgeFade);
          if (gl_FragColor.a < 0.01) discard;
        }
        #include <dithering_fragment>
        `
      );
    };
    return material;
  }

  const toonMaterialCache = new Map();

  function makeToonMat(color, opts = {}) {
    const colorKey = typeof color === 'number' ? color : color.getHex();
    const cacheable = !opts.map &&
      !opts.transparent &&
      !opts.clippingPlanes &&
      opts.emissive === undefined &&
      opts.opacity === undefined &&
      (!opts.side || opts.side === THREE.FrontSide);
    const cacheKey = cacheable
      ? [colorKey, opts.boostHSL !== false ? 1 : 0, opts.cloudShadow !== false ? 1 : 0, opts.cloudStrength || 0.11, opts.saturationBoost || 1.26].join('|')
      : null;
    if (cacheKey && toonMaterialCache.has(cacheKey)) return toonMaterialCache.get(cacheKey);

    const baseCol = new THREE.Color(color);
    if (opts.boostHSL !== false) {
      const hsl = {};
      baseCol.getHSL(hsl);
      baseCol.setHSL(hsl.h, Math.min(1.0, hsl.s * 1.22), hsl.l);
    }
    const isTrainMat = Boolean(opts.clippingPlanes);
    const mat = new THREE.MeshToonMaterial({
      color: baseCol,
      gradientMap: toonGradient,
      transparent: opts.transparent || isTrainMat || false,
      opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
      side: opts.side || THREE.FrontSide,
      map: opts.map || null,
      emissive: opts.emissive !== undefined ? new THREE.Color(opts.emissive) : new THREE.Color(0x000000),
      emissiveIntensity: opts.emissiveIntensity || 0.0,
      clippingPlanes: opts.clippingPlanes || null
    });
    if (opts.cloudShadow !== false || isTrainMat) {
      applyCloudShadowShader(mat, opts.cloudStrength || 0.11, opts.saturationBoost || 1.26, isTrainMat);
    }
    if (cacheKey) toonMaterialCache.set(cacheKey, mat);
    return mat;
  }

  const inkEdgeMat = new THREE.LineBasicMaterial({
    color: 0x3a322d,
    transparent: true,
    opacity: 0.34
  });

  const trainInkEdgeMat = new THREE.ShaderMaterial({
    uniforms: {
      uTrainOpacity: globalUniforms.uTrainOpacity
    },
    clippingPlanes: trainClipPlanes,
    clipping: true,
    transparent: true,
    vertexShader: `
      #include <clipping_planes_pars_vertex>
      varying vec3 vWorldPos;
      void main() {
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * mvPosition;
        #include <clipping_planes_vertex>
      }
    `,
    fragmentShader: `
      #include <clipping_planes_pars_fragment>
      uniform float uTrainOpacity;
      varying vec3 vWorldPos;
      void main() {
        #include <clipping_planes_fragment>
        float edgeFade = smoothstep(18.9, 13.8, abs(vWorldPos.x));
        float alpha = 0.42 * uTrainOpacity * edgeFade;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(0.15, 0.21, 0.27, alpha);
      }
    `
  });

  function addAnimeMesh(parent, geometry, material, opts = {}) {
    const mesh = new THREE.Mesh(geometry, material);
    if (opts.position) mesh.position.copy(opts.position);
    if (opts.rotation) mesh.rotation.copy(opts.rotation);
    if (opts.scale) mesh.scale.copy(opts.scale);
    mesh.castShadow = opts.castShadow !== undefined ? opts.castShadow : true;
    mesh.receiveShadow = opts.receiveShadow !== undefined ? opts.receiveShadow : true;

    if (opts.outline !== false) {
      const threshold = opts.edgeThreshold || 28;
      const edges = new THREE.EdgesGeometry(geometry, threshold);
      const line = new THREE.LineSegments(edges, opts.useTrainClip ? trainInkEdgeMat : inkEdgeMat);
      mesh.add(line);
    }
    parent.add(mesh);
    return mesh;
  }

  function batchStaticDioramaMeshes(root, excludedRoots = []) {
    const utils = THREE.BufferGeometryUtils;
    if (!utils || typeof utils.mergeBufferGeometries !== 'function') return null;

    root.updateMatrixWorld(true);
    const rootInverse = new THREE.Matrix4().copy(root.matrixWorld).invert();
    const excluded = new Set(excludedRoots);
    const meshBuckets = new Map();
    const lineBuckets = new Map();
    const batchedMeshes = [];
    const batchedLines = [];

    function attributeSignature(geometry) {
      return Object.keys(geometry.attributes).sort()
        .map((name) => name + ':' + geometry.attributes[name].itemSize)
        .join(',');
    }

    function collect(node) {
      if (excluded.has(node)) return;

      if (node.isMesh && !node.isInstancedMesh && !node.isSkinnedMesh && !Array.isArray(node.material)) {
        const material = node.material;
        const canBatch = material &&
          !material.isShaderMaterial &&
          !material.transparent &&
          !(material.clippingPlanes && material.clippingPlanes.length) &&
          !node.customDepthMaterial &&
          Object.keys(node.geometry.morphAttributes || {}).length === 0;

        if (canBatch) {
          const relativeMatrix = new THREE.Matrix4().multiplyMatrices(rootInverse, node.matrixWorld);
          const geometry = node.geometry.clone().applyMatrix4(relativeMatrix);
          const key = [
            material.uuid,
            node.renderOrder,
            node.castShadow ? 1 : 0,
            node.receiveShadow ? 1 : 0,
            geometry.index ? 'indexed' : 'non-indexed',
            attributeSignature(geometry)
          ].join('|');
          if (!meshBuckets.has(key)) {
            meshBuckets.set(key, { material, renderOrder: node.renderOrder, castShadow: node.castShadow, receiveShadow: node.receiveShadow, geometries: [], nodes: [] });
          }
          const bucket = meshBuckets.get(key);
          bucket.geometries.push(geometry);
          bucket.nodes.push(node);
        }
      }

      if (node.isLineSegments && node.material && !Array.isArray(node.material)) {
        const material = node.material;
        if (!material.isShaderMaterial && !(material.clippingPlanes && material.clippingPlanes.length)) {
          const relativeMatrix = new THREE.Matrix4().multiplyMatrices(rootInverse, node.matrixWorld);
          const geometry = node.geometry.clone().applyMatrix4(relativeMatrix);
          const key = [material.uuid, node.renderOrder, geometry.index ? 'indexed' : 'non-indexed', attributeSignature(geometry)].join('|');
          if (!lineBuckets.has(key)) {
            lineBuckets.set(key, { material, renderOrder: node.renderOrder, geometries: [], nodes: [] });
          }
          const bucket = lineBuckets.get(key);
          bucket.geometries.push(geometry);
          bucket.nodes.push(node);
        }
      }

      for (let i = 0; i < node.children.length; i++) collect(node.children[i]);
    }

    collect(root);

    const stats = { mergedMeshes: 0, mergedLines: 0, meshDrawsSaved: 0, lineDrawsSaved: 0 };

    meshBuckets.forEach((bucket) => {
      const mergedGeometry = utils.mergeBufferGeometries(bucket.geometries, false);
      if (!mergedGeometry) {
        bucket.geometries.forEach((geometry) => geometry.dispose());
        return;
      }
      mergedGeometry.computeBoundingSphere();
      mergedGeometry.computeBoundingBox();
      const mergedMesh = new THREE.Mesh(mergedGeometry, bucket.material);
      mergedMesh.name = 'STATIC_MESH_BATCH';
      mergedMesh.renderOrder = bucket.renderOrder;
      mergedMesh.castShadow = bucket.castShadow;
      mergedMesh.receiveShadow = bucket.receiveShadow;
      root.add(mergedMesh);
      stats.mergedMeshes++;
      stats.meshDrawsSaved += Math.max(0, bucket.nodes.length - 1);
      bucket.nodes.forEach((node) => batchedMeshes.push(node));
      bucket.geometries.forEach((geometry) => geometry.dispose());
    });

    lineBuckets.forEach((bucket) => {
      const mergedGeometry = utils.mergeBufferGeometries(bucket.geometries, false);
      if (!mergedGeometry) {
        bucket.geometries.forEach((geometry) => geometry.dispose());
        return;
      }
      mergedGeometry.computeBoundingSphere();
      const mergedLine = new THREE.LineSegments(mergedGeometry, bucket.material);
      mergedLine.name = 'STATIC_LINE_BATCH';
      mergedLine.renderOrder = bucket.renderOrder;
      root.add(mergedLine);
      stats.mergedLines++;
      stats.lineDrawsSaved += Math.max(0, bucket.nodes.length - 1);
      bucket.nodes.forEach((node) => batchedLines.push(node));
      bucket.geometries.forEach((geometry) => geometry.dispose());
    });

    batchedMeshes.forEach((mesh) => {
      if (mesh.parent) mesh.parent.remove(mesh);
    });
    batchedLines.forEach((line) => {
      if (line.parent) line.parent.remove(line);
    });

    stats.originalMeshes = batchedMeshes.length;
    stats.originalLines = batchedLines.length;
    window.__sakuraBatchStats = stats;
    return stats;
  }

  function createRootedGrassTuftGeometry() {
    const geo = new THREE.BufferGeometry();
    const positions = [];

    const cRoot = new THREE.Color(0x2e5c1e);
    const cMid = new THREE.Color(0x5ec447);

      const h = 0.24 + (b % 3) * 0.08;
      const w = 0.028;
      const dx = Math.cos(ang);
      const dz = Math.sin(ang);
      const px = -dz * w;
      const pz = dx * w;

      const xMid = dx * lean * 0.45;
      const zMid = dz * lean * 0.45;
      const xTip = dx * lean;
      const zTip = dz * lean;

      positions.push(
        -px, 0, -pz,
        px, 0, pz,
        xMid + px * 0.6, h * 0.55, zMid + pz * 0.6,
        -px, 0, -pz,
        xMid + px * 0.6, h * 0.55, zMid + pz * 0.6,
        xMid - px * 0.6, h * 0.55, zMid - pz * 0.6
      );
      colors.push(
        cRoot.r, cRoot.g, cRoot.b,
        cRoot.r, cRoot.g, cRoot.b,
        cMid.r, cMid.g, cMid.b,
        cRoot.r, cRoot.g, cRoot.b,
        cMid.r, cMid.g, cMid.b,
        cMid.r, cMid.g, cMid.b
      );

      positions.push(
        xMid - px * 0.6, h * 0.55, zMid - pz * 0.6,
        xMid + px * 0.6, h * 0.55, zMid + pz * 0.6,
        xTip, h, zTip

      colors.push(
        cMid.r, cMid.g, cMid.b,
        cMid.r, cMid.g, cMid.b,
        cTip.r, cTip.g, cTip.b
      );
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

  // Dynamic Catenary Contact Wire, Messenger Wire & Power Lines (vibrate when train pantograph passes!)
  const dynamicWires = [];
  function createSpanWire(x1, x2, yBase, zBase, sag, isCatenary = false) {
    const segs = 24;
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const u = i / segs;
      const x = THREE.MathUtils.lerp(x1, x2, u);
      const y = yBase - Math.sin(u * Math.PI) * sag;
      pts.push(new THREE.Vector3(x, y, zBase));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(geo, wireLineMat);
    dioramaGroup.add(line);
    dynamicWires.push({ geo, x1, x2, yBase, zBase, sag, isCatenary, segs });
  }

  for (let i = 0; i < poleXCoords.length - 1; i++) {
    const xA = poleXCoords[i];
    const xB = poleXCoords[i + 1];
    // Contact wire directly over trackCenterZ (-13.6) at y = 5.02
    createSpanWire(xA, xB, 5.02, trackCenterZ, 0.03, true);
    // Messenger wire above contact wire
    createSpanWire(xA, xB, 5.65, trackCenterZ, 0.26, true);
    // Distribution power lines along the poles
    [-0.75, 0.75].forEach((oz) => {
      createSpanWire(xA, xB, 6.95, -15.85 + oz, 0.22, false);
      createSpanWire(xA, xB, 7.75, -15.85 + oz, 0.22, false);
    });
    // Vertical catenary dropper wires
    for (let d = 1; d <= 4; d++) {
      const u = d / 5;
      const dx = THREE.MathUtils.lerp(xA, xB, u);
      const topY = 5.65 - Math.sin(u * Math.PI) * 0.26;
      const dropGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(dx, 5.02, trackCenterZ),
        new THREE.Vector3(dx, topY, trackCenterZ)
      ]);
      dioramaGroup.add(new THREE.Line(dropGeo, wireLineMat));
    }
  }

    grad.addColorStop(0, '#4a2e23');
    grad.addColorStop(0.5, '#634032');
    grad.addColorStop(1, '#42281e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (let x = 0; x < w; x += 12) {
      ctx.fillStyle = x % 24 === 0 ? 'rgba(30, 16, 10, 0.38)' : 'rgba(130, 90, 72, 0.22)';
      ctx.fillRect(x, 0, 5 + (x % 4), h);
    }
    for (let i = 0; i < 140; i++) {
      const rx = (i * 37) % w;
      const ry = (i * 29) % h;
      const rw = 22 + (i % 5) * 12;
      ctx.fillStyle = i % 2 === 0 ? '#875946' : '#331c14';
      ctx.fillRect(rx, ry, rw, 3.5);
      ctx.fillStyle = '#a1705b';
      ctx.fillRect(rx + 4, ry + 1, rw * 0.5, 1.5);
    }
    for (let m = 0; m < 28; m++) {
      ctx.fillStyle = 'rgba(92, 148, 68, 0.28)';
      ctx.beginPath();
      ctx.arc((m * 43) % w, h - 20 - (m % 4) * 18, 14 + (m % 3) * 6, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  sakuraBarkTex.wrapS = THREE.RepeatWrapping;
  sakuraBarkTex.wrapT = THREE.RepeatWrapping;
  const realisticBarkMat = makeToonMat(0xffffff, { map: sakuraBarkTex });
  const twigMat = makeToonMat(0x4d2c20);

  function createSakuraPetalGeometry() {
    const shape = new THREE.Shape();
    // Classic heart-shaped (心形) cherry blossom petal with top cleft and pointed base
    shape.moveTo(0, -0.105);
    shape.bezierCurveTo(0.048, -0.055, 0.118, 0.012, 0.105, 0.072);
    shape.bezierCurveTo(0.095, 0.118, 0.038, 0.125, 0, 0.072);
    shape.bezierCurveTo(-0.038, 0.125, -0.095, 0.118, -0.105, 0.072);
    shape.bezierCurveTo(-0.118, 0.012, -0.048, -0.055, 0, -0.105);
    const geo = new THREE.ShapeGeometry(shape, 12);
    geo.center();
    return geo;
  }

  function createFivePetalBlossomGeometry() {
    const groupGeo = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];
    const cCenter = new THREE.Color(0xd81b60);
    const cMid = new THREE.Color(0xff7aa8);
    const cTip = new THREE.Color(0xffd4e4);

    for (let p = 0; p < 5; p++) {
      const a = (p / 5) * Math.PI * 2;
      const aL = a - 0.34;
      const aR = a + 0.34;
      const rInner = 0.025;
      const rMid = 0.115;
      const rTip = 0.175;
      const rNotch = 0.140;
      const ix = Math.cos(a) * rInner;
      const iz = Math.sin(a) * rInner;

      positions.push(
        ix, 0.005, iz,
        Math.cos(aL) * rMid, 0.028, Math.sin(aL) * rMid,
        Math.cos(a - 0.11) * rTip, 0.042, Math.sin(a - 0.11) * rTip,
        ix, 0.005, iz,
        Math.cos(a - 0.11) * rTip, 0.042, Math.sin(a - 0.11) * rTip,
        Math.cos(a) * rNotch, 0.035, Math.sin(a) * rNotch
      );
      positions.push(
        ix, 0.005, iz,
        Math.cos(a) * rNotch, 0.035, Math.sin(a) * rNotch,
        Math.cos(a + 0.11) * rTip, 0.042, Math.sin(a + 0.11) * rTip,
        ix, 0.005, iz,
        Math.cos(a + 0.11) * rTip, 0.042, Math.sin(a + 0.11) * rTip,
        Math.cos(aR) * rMid, 0.028, Math.sin(aR) * rMid
      );

      for (let t = 0; t < 4; t++) {
        colors.push(cCenter.r, cCenter.g, cCenter.b);
        colors.push(cMid.r, cMid.g, cMid.b);
        colors.push(cTip.r, cTip.g, cTip.b);
      }
    }
    groupGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    groupGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    groupGeo.computeVertexNormals();
    return groupGeo;
  }
  const blossomClusterGeo = createFivePetalBlossomGeometry();
  const blossomClusterMat = new THREE.MeshBasicMaterial({
    vertexColors: true,
    side: THREE.DoubleSide
  });

  const singleBranchPetalGeo = createSakuraPetalGeometry();
  const singleBranchPetalMat = new THREE.MeshBasicMaterial({
    color: 0xffa6c9,
    side: THREE.DoubleSide
  });

  function createSakuraLeafGeometry() {
    const shape = new THREE.Shape();
    shape.moveTo(0, -0.11);
    shape.quadraticCurveTo(0.055, -0.05, 0.065, 0.0);
    shape.quadraticCurveTo(0.05, 0.06, 0, 0.12);
    shape.quadraticCurveTo(-0.05, 0.06, -0.065, 0.0);
    shape.quadraticCurveTo(-0.055, -0.05, 0, -0.11);
    const geo = new THREE.ShapeGeometry(shape);
    geo.rotateX(Math.PI / 2);
    return geo;
  }
  const sakuraLeafGeo = createSakuraLeafGeometry();
  const sakuraLeafMat = makeToonMat(0x68b836, { side: THREE.DoubleSide });

  function createTaperedBranchGeometry(curve, rStart, rEnd, tubularSegments = 12, radialSegments = 7) {
    const geo = new THREE.TubeGeometry(curve, tubularSegments, 1.0, radialSegments, false);
    const pos = geo.attributes.position;
    const norm = geo.attributes.normal;
    const center = new THREE.Vector3();
    const nVec = new THREE.Vector3();

    for (let i = 0; i <= tubularSegments; i++) {
      const t = i / tubularSegments;
      const radius = THREE.MathUtils.lerp(rStart, rEnd, Math.pow(t, 0.85));
      curve.getPointAt(t, center);
      for (let j = 0; j <= radialSegments; j++) {
        const idx = i * (radialSegments + 1) + j;
        nVec.fromBufferAttribute(norm, idx);
        pos.setXYZ(
          idx,
          center.x + nVec.x * radius,
          center.y + nVec.y * radius,
          center.z + nVec.z * radius
        );
      }
    }
    geo.computeVertexNormals();
    return geo;
  }

  const sakuraSwayBranches = [];

  function createSakuraTree(x, y, z, scale = 1.0, phaseSeed = 0.0) {
    const tGroup = new THREE.Group();
    tGroup.position.set(x, y, z);
    tGroup.scale.setScalar(scale);
    dioramaGroup.add(tGroup);

    for (let r = 0; r < 5; r++) {
      const rAng = (r / 5) * Math.PI * 2 + 0.3;
      const rootCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(Math.cos(rAng) * 0.10, 0.32, Math.sin(rAng) * 0.10),
        new THREE.Vector3(Math.cos(rAng) * 0.28, 0.12, Math.sin(rAng) * 0.28),
        new THREE.Vector3(Math.cos(rAng) * 0.48, 0.01, Math.sin(rAng) * 0.48)
      ]);
      addAnimeMesh(tGroup, createTaperedBranchGeometry(rootCurve, 0.095, 0.025, 8, 6), realisticBarkMat, {
        outline: false
      });
    }

    const trunkCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0.06, 0.82, -0.04),
      new THREE.Vector3(-0.04, 1.62, 0.05),
      new THREE.Vector3(0.03, 2.25, 0.02)
    ]);
    addAnimeMesh(tGroup, createTaperedBranchGeometry(trunkCurve, 0.23, 0.135, 14, 8), realisticBarkMat);

    const numMainBoughs = 6;
    for (let b = 0; b < numMainBoughs; b++) {
      const boughPivot = new THREE.Group();
      boughPivot.position.set(0.03, 2.20, 0.02);
      tGroup.add(boughPivot);

      sakuraSwayBranches.push({
        group: boughPivot,
        worldX: x,
        worldZ: z,
        phase: phaseSeed + b * 1.15,
        ampScale: 1.0 + (b % 2) * 0.35
      });

      const baseAng = (b / numMainBoughs) * Math.PI * 2 + (b % 2) * 0.18;
      const reach = 2.45 + (b % 3) * 0.32;
      const lift = 1.45 + (b % 2) * 0.38;

      const p1 = new THREE.Vector3(
        Math.cos(baseAng) * reach * 0.38,
        lift * 0.52,
        Math.sin(baseAng) * reach * 0.38
      );
      const p2 = new THREE.Vector3(
        Math.cos(baseAng + 0.08) * reach * 0.76,
        lift * 0.92,
        Math.sin(baseAng + 0.08) * reach * 0.76
      );
      const p3 = new THREE.Vector3(
        Math.cos(baseAng + 0.14) * reach,
        lift * 0.85,
        Math.sin(baseAng + 0.14) * reach
      );

      const mainBoughCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), p1, p2, p3]);
      addAnimeMesh(boughPivot, createTaperedBranchGeometry(mainBoughCurve, 0.11, 0.022, 14, 7), realisticBarkMat, {
        outline: false
      });

      const boughFlowerCurves = [mainBoughCurve];

      const secFractions = [0.28, 0.48, 0.66, 0.82];
      secFractions.forEach((f, sIdx) => {
        const origin = mainBoughCurve.getPointAt(f);
        const sideSign = sIdx % 2 === 0 ? 1 : -1;
        const secAng = baseAng + sideSign * (0.48 + sIdx * 0.12);
        const secLen = (1.35 - f * 0.45);

        const sMid = origin.clone().add(new THREE.Vector3(
          Math.cos(secAng) * secLen * 0.55,
          0.36 + (sIdx % 2) * 0.18,
          Math.sin(secAng) * secLen * 0.55
        ));
        const sEnd = origin.clone().add(new THREE.Vector3(
          Math.cos(secAng + sideSign * 0.15) * secLen,
          0.22 - (sIdx % 2) * 0.12,
          Math.sin(secAng + sideSign * 0.15) * secLen
        ));

        const secCurve = new THREE.CatmullRomCurve3([origin, sMid, sEnd]);
        addAnimeMesh(boughPivot, createTaperedBranchGeometry(secCurve, 0.048, 0.012, 10, 6), twigMat, {
          outline: false
        });
        boughFlowerCurves.push(secCurve);

        [0.45, 0.78].forEach((tf, tIdx) => {
          const tOrigin = secCurve.getPointAt(tf);
          const tSign = tIdx === 0 ? -sideSign : sideSign;
          const tAng = secAng + tSign * 0.52;
          const tLen = 0.68;
          const tMid = tOrigin.clone().add(new THREE.Vector3(
            Math.cos(tAng) * tLen * 0.5,
            0.14,
            Math.sin(tAng) * tLen * 0.5
          ));
          const tEnd = tOrigin.clone().add(new THREE.Vector3(
            Math.cos(tAng) * tLen,
            -0.08,
            Math.sin(tAng) * tLen
          ));
          const twigCurve = new THREE.CatmullRomCurve3([tOrigin, tMid, tEnd]);
          addAnimeMesh(boughPivot, createTaperedBranchGeometry(twigCurve, 0.022, 0.006, 7, 5), twigMat, {
            outline: false
          });
          boughFlowerCurves.push(twigCurve);
        });
      });

      if (b % 2 === 0) {
        const upOrigin = mainBoughCurve.getPointAt(0.32);
        const upMid = upOrigin.clone().add(new THREE.Vector3(Math.cos(baseAng) * 0.45, 0.85, Math.sin(baseAng) * 0.45));
        const upEnd = upOrigin.clone().add(new THREE.Vector3(Math.cos(baseAng + 0.3) * 1.05, 1.38, Math.sin(baseAng + 0.3) * 1.05));
        const upCurve = new THREE.CatmullRomCurve3([upOrigin, upMid, upEnd]);
        addAnimeMesh(boughPivot, createTaperedBranchGeometry(upCurve, 0.052, 0.012, 10, 6), twigMat, {
          outline: false
        });
        boughFlowerCurves.push(upCurve);
      }

      const blossomsPerBough = 165;
      const singlePetalsPerBough = 240;
      const leavesPerBough = 48;

      const boughBlossoms = new THREE.InstancedMesh(blossomClusterGeo, blossomClusterMat, blossomsPerBough);
      const boughPetals = new THREE.InstancedMesh(singleBranchPetalGeo, singleBranchPetalMat, singlePetalsPerBough);
      const boughLeaves = new THREE.InstancedMesh(sakuraLeafGeo, sakuraLeafMat, leavesPerBough);
      const bDummy = new THREE.Object3D();
      const pt = new THREE.Vector3();

      for (let i = 0; i < blossomsPerBough; i++) {
        const c = boughFlowerCurves[i % boughFlowerCurves.length];
        const u = 0.18 + ((i * 0.618034) % 0.82);
        c.getPointAt(u, pt);
        const radialAngle = i * 2.39996;
        const radialOffset = 0.04 + (i % 4) * 0.045;
        bDummy.position.set(
          pt.x + Math.cos(radialAngle) * radialOffset,
          pt.y + Math.sin(radialAngle * 0.7) * radialOffset * 0.85 + 0.02,
          pt.z + Math.sin(radialAngle) * radialOffset
        );
        bDummy.rotation.set(
          Math.sin(radialAngle) * 0.9,
          radialAngle,
          Math.cos(radialAngle) * 0.9
        );
        bDummy.scale.setScalar(0.72 + (i % 4) * 0.16);
        bDummy.updateMatrix();
        boughBlossoms.setMatrixAt(i, bDummy.matrix);
      }
      boughPivot.add(boughBlossoms);

      for (let i = 0; i < singlePetalsPerBough; i++) {
        const c = boughFlowerCurves[i % boughFlowerCurves.length];
        const u = 0.15 + ((i * 0.381966) % 0.85);
        c.getPointAt(u, pt);
        const ang = i * 1.91;
        const rOff = 0.03 + (i % 5) * 0.042;
        bDummy.position.set(
          pt.x + Math.cos(ang) * rOff,
          pt.y + ((i % 3) - 1) * 0.045,
          pt.z + Math.sin(ang) * rOff
        );
        bDummy.rotation.set(ang * 0.7, ang, (i % 3) * 0.8);
        bDummy.scale.setScalar(0.85 + (i % 3) * 0.25);
        bDummy.updateMatrix();
        boughPetals.setMatrixAt(i, bDummy.matrix);
      }
      boughPivot.add(boughPetals);

      for (let i = 0; i < leavesPerBough; i++) {
        const c = boughFlowerCurves[i % boughFlowerCurves.length];
        const u = 0.22 + ((i * 0.47) % 0.75);
        c.getPointAt(u, pt);
        const ang = i * 2.1;
        bDummy.position.set(
          pt.x + Math.cos(ang) * 0.05,
          pt.y + 0.02,
          pt.z + Math.sin(ang) * 0.05
        );
        bDummy.rotation.set(0.35, ang, 0.25);
        bDummy.scale.setScalar(0.75 + (i % 3) * 0.18);
        bDummy.updateMatrix();
        boughLeaves.setMatrixAt(i, bDummy.matrix);
      }
      boughPivot.add(boughLeaves);
    }
  }

  // 5 Sakura Trees placed in dedicated landscaped beds/planters — 100% clear of all buildings and road lanes!
  createSakuraTree(-15.5, 1.35, -9.2, 1.00, 0.0);
  createSakuraTree(-10.8, 0.38, -2.6, 1.10, 1.4);
  createSakuraTree(8.2, 0.38, -2.6, 1.04, 2.8);
  createSakuraTree(-15.4, 0.52, 6.9, 1.08, 4.1);
  createSakuraTree(17.7, 0.38, 2.4, 0.96, 5.5);

  const petalGeo = createSakuraPetalGeometry();
  const petalMat = new THREE.MeshBasicMaterial({
    color: 0xff8ab5,
    side: THREE.DoubleSide
  });

  // Static fallen petals scattered on platform edge, ballast, and puddles
  const staticPetalCount = 460;
  const staticPetals = new THREE.InstancedMesh(petalGeo, petalMat, staticPetalCount);
  for (let i = 0; i < staticPetalCount; i++) {
    const px = -16.5 + (i * 0.71) % 33.0;
    const pz = -14.8 + ((i * 1.37) % 21.0);
    let py = 0.26;
    if (pz > PLATFORM_NORTH_EDGE && pz < PLATFORM_SOUTH_EDGE && px > -16.8 && px < 10.2) py = 1.39;
    else if (pz > -5.0 && pz < 5.6 && px < 9.5) py = 0.39;
    dummy.position.set(px, py, pz);
    dummy.rotation.set(-Math.PI / 2, (i * 1.9) % (Math.PI * 2), 0);
    dummy.scale.setScalar(0.65 + (i % 3) * 0.2);
    dummy.updateMatrix();
    staticPetals.setMatrixAt(i, dummy.matrix);
  }
  dioramaGroup.add(staticPetals);

  // Dynamic swirling & falling cherry blossom petals
  const fallingPetalCount = 950;
  const fallingPetalMat = petalMat.clone();
  fallingPetalMat.transparent = true;
  const fallingPetalsMesh = new THREE.InstancedMesh(petalGeo, fallingPetalMat, fallingPetalCount);
  const petalData = [];
  for (let i = 0; i < fallingPetalCount; i++) {
    petalData.push({
      x: (Math.random() - 0.5) * 35.0,
      y: 0.4 + Math.random() * 6.5,
      z: (Math.random() - 0.5) * 33.0,
      vx: 0.22 + Math.random() * 0.35,
      vy: -(0.32 + Math.random() * 0.38),
      vz: (Math.random() - 0.5) * 0.28,
      rx: Math.random() * Math.PI * 2,
      ry: Math.random() * Math.PI * 2,
      rz: Math.random() * Math.PI * 2,
      phase: Math.random() * Math.PI * 2,
      scale: 0.7 + Math.random() * 0.45
    });
  }
  dioramaGroup.add(fallingPetalsMesh);

  // Station Forecourt Fountain & Flowerbed placed squarely on the Expanded Pedestrian Plaza (x = 4.6, y = 0.38, z = 4.2)
  // Near the station front entrance and set back 2.7m from the southern sidewalk curb (z = 9.2), completely off all roads!
  const rotaryGroup = new THREE.Group();
  rotaryGroup.position.set(4.6, 0.38, 4.2);
  dioramaGroup.add(rotaryGroup);
  rotaryGroup.scale.setScalar(0.82);

  addAnimeMesh(rotaryGroup, new THREE.CylinderGeometry(2.65, 2.78, 0.42, 28), makeToonMat(0xd7c8b6), {
    position: new THREE.Vector3(0, 0.21, 0)
  });
  addAnimeMesh(rotaryGroup, new THREE.CylinderGeometry(2.45, 2.45, 0.44, 28), richSoilMat, {
    position: new THREE.Vector3(0, 0.22, 0),
    outline: false
  });

  const rotaryGrassInst = new THREE.InstancedMesh(grassTuftGeo, windFoliageMat, 180);
  for (let i = 0; i < 180; i++) {
    const ang = (i / 180) * Math.PI * 2 + (i % 3) * 0.07;
    const rad = 1.96 + (i % 5) * 0.095;
    dummy.position.set(Math.cos(ang) * rad, 0.44, Math.sin(ang) * rad);
    dummy.rotation.set(0, ang, 0);
    dummy.scale.setScalar(0.75 + (i % 3) * 0.2);
    dummy.updateMatrix();
    rotaryGrassInst.setMatrixAt(i, dummy.matrix);
  }
  rotaryGroup.add(rotaryGrassInst);

  const flowerBedPalette = [0xff4081, 0xffca28, 0xba68c8, 0xff7043, 0xff80ab];
  flowerBedPalette.forEach((fCol, pIdx) => {
    const fGeo = createRootedFlowerGeometry(fCol);
    const fInst = new THREE.InstancedMesh(fGeo, windFoliageMat, 36);
    for (let i = 0; i < 36; i++) {
      const ang = ((i + pIdx * 0.2) / 36) * Math.PI * 2;
      const rad = 2.02 + ((i + pIdx) % 3) * 0.14;
      dummy.position.set(Math.cos(ang) * rad, 0.44, Math.sin(ang) * rad);
      dummy.rotation.set((Math.random() - 0.5) * 0.15, ang + i, (Math.random() - 0.5) * 0.15);
      dummy.scale.setScalar(0.95 + (i % 3) * 0.22);
      dummy.updateMatrix();
      fInst.setMatrixAt(i, dummy.matrix);
    }
    rotaryGroup.add(fInst);
  });

  // Inner Raised Stone Fountain Pool Basin
  addAnimeMesh(rotaryGroup, new THREE.CylinderGeometry(1.88, 1.96, 0.62, 24), makeToonMat(0xe5ddd0), {
    position: new THREE.Vector3(0, 0.31, 0)
  });

  // Rippling Fountain Pool Water Surface
  const fountainWaterMat = new THREE.ShaderMaterial({
    uniforms: { uTime: globalUniforms.uTime },
    transparent: true,
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv * 2.0 - 1.0;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec2 vUv;
      void main() {
        float r = length(vUv);
        float wave1 = sin(r * 24.0 - uTime * 6.5) * 0.5 + 0.5;
        float wave2 = cos(r * 16.0 - uTime * 4.2 + atan(vUv.y, vUv.x) * 4.0) * 0.5 + 0.5;
        vec3 deepWater = vec3(0.18, 0.72, 0.92);
        vec3 foamHighlight = vec3(0.92, 0.99, 1.0);
        float foam = smoothstep(0.68, 0.92, wave1 * 0.65 + wave2 * 0.35) + smoothstep(0.32, 0.05, r) * 0.55;
        vec3 col = mix(deepWater, foamHighlight, clamp(foam, 0.0, 1.0));
        gl_FragColor = vec4(col, 0.88);
      }
    `
  });
  const poolWater = new THREE.Mesh(new THREE.CircleGeometry(1.72, 28), fountainWaterMat);
  poolWater.rotation.x = -Math.PI / 2;
  poolWater.position.set(0, 0.58, 0);
  rotaryGroup.add(poolWater);

  // Two-Tier Carved Stone Fountain Pedestal
  const carvedStoneMat = makeToonMat(0xf2ece1);
  addAnimeMesh(rotaryGroup, new THREE.CylinderGeometry(0.36, 0.48, 0.85, 16), carvedStoneMat, {
    position: new THREE.Vector3(0, 0.82, 0)
  });
  addAnimeMesh(rotaryGroup, new THREE.CylinderGeometry(0.95, 0.62, 0.22, 20), carvedStoneMat, {
    position: new THREE.Vector3(0, 1.25, 0)
  });
  addAnimeMesh(rotaryGroup, new THREE.CylinderGeometry(0.22, 0.28, 0.62, 14), carvedStoneMat, {
    position: new THREE.Vector3(0, 1.58, 0)
  });
  addAnimeMesh(rotaryGroup, new THREE.CylinderGeometry(0.46, 0.28, 0.16, 16), carvedStoneMat, {
    position: new THREE.Vector3(0, 1.88, 0)
  });

  // Parabolic Continuous Translucent Water Arcs from 12 Brass Nozzles
  const waterStreamMat = new THREE.ShaderMaterial({
    uniforms: { uTime: globalUniforms.uTime },
    transparent: true,
    depthWrite: false,
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec2 vUv;
      void main() {
        float flow = fract(vUv.x * 5.0 - uTime * 3.8);
        float streak = smoothstep(0.15, 0.85, sin(flow * 6.2831));
        vec3 col = mix(vec3(0.68, 0.93, 1.0), vec3(1.0), streak * 0.7);
        float alpha = (0.38 + streak * 0.36) * smoothstep(0.0, 0.12, vUv.x) * (1.0 - smoothstep(0.88, 1.0, vUv.x));
        gl_FragColor = vec4(col, alpha);
      }
    `
  });

  for (let n = 0; n < 12; n++) {
    const ang = (n / 12) * Math.PI * 2;
    const arcCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(Math.cos(ang) * 0.34, 1.92, Math.sin(ang) * 0.34),
      new THREE.Vector3(Math.cos(ang) * 0.82, 2.35, Math.sin(ang) * 0.82),
      new THREE.Vector3(Math.cos(ang) * 1.32, 0.59, Math.sin(ang) * 1.32)
    ]);
    const arcGeo = new THREE.TubeGeometry(arcCurve, 14, 0.026, 6, false);
    const arcMesh = new THREE.Mesh(arcGeo, waterStreamMat);
    rotaryGroup.add(arcMesh);
  }

  // Physics-Driven Fountain Water Droplets (parabolic trajectory y = y0 + vy*t - 0.5*g*t^2)
  const fountainDropCount = 380;
  const dropGeo = new THREE.SphereGeometry(0.032, 6, 6);
  const dropMat = new THREE.MeshBasicMaterial({ color: 0xe6f9ff, transparent: true, opacity: 0.88 });
  const fountainDropsMesh = new THREE.InstancedMesh(dropGeo, dropMat, fountainDropCount);
  const fountainDropsData = [];
  for (let i = 0; i < fountainDropCount; i++) {
    const isOuter = i < 260;
    const nozzleIdx = i % 12;
    const angle = isOuter
      ? (nozzleIdx / 12) * Math.PI * 2 + (Math.random() - 0.5) * 0.14
      : Math.random() * Math.PI * 2;
    fountainDropsData.push({
      isOuter,
      angle,
      r0: isOuter ? 0.34 : 0.05,

      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.015, 6, 18), chromeMat);

      for (let s = 0; s < 6; s++) {

        spoke.rotation.x = (s / 6) * Math.PI;
        wGroup.add(spoke);
      }

      const fender = new THREE.Mesh(new THREE.TorusGeometry(0.275, 0.022, 6, 14, Math.PI), frameMat);
      fender.rotation.y = Math.PI / 2;
      wGroup.add(fender);

      if (wIdx === 1) {
        // Rear rack above rear wheel
        addAnimeMesh(bike, new THREE.BoxGeometry(0.16, 0.025, 0.42), chromeMat, {
          position: new THREE.Vector3(0, 0.56, wz),
          outline: false
        });
      }
    });

    // Step-through curved frame tubes, chain guard, pedals, handlebars, saddle & front basket
    addAnimeMesh(bike, new THREE.CylinderGeometry(0.022, 0.022, 0.66, 8), frameMat, {
      position: new THREE.Vector3(0, 0.50, -0.35),
      rotation: new THREE.Euler(-0.22, 0, 0),
      outline: false
    });
    addAnimeMesh(bike, new THREE.CylinderGeometry(0.024, 0.024, 0.62, 8), frameMat, {
      position: new THREE.Vector3(0, 0.42, -0.06),
      rotation: new THREE.Euler(0.95, 0, 0),
      outline: false
    });
    addAnimeMesh(bike, new THREE.CylinderGeometry(0.022, 0.022, 0.46, 8), frameMat, {
      position: new THREE.Vector3(0, 0.44, 0.145),
      rotation: new THREE.Euler(-0.24, 0, 0),
      outline: false
    });
    // Chain case
    addAnimeMesh(bike, new THREE.BoxGeometry(0.04, 0.12, 0.44), frameMat, {
      position: new THREE.Vector3(0.04, 0.27, 0.24),
      outline: false

      outline: false

    // Handlebars & Grips

      position: new THREE.Vector3(0, 0.82, -0.28),
      rotation: new THREE.Euler(0, 0, Math.PI / 2),
      outline: false
    });
    // Wire Front Basket
    addAnimeMesh(bike, new THREE.BoxGeometry(0.28, 0.22, 0.24), makeToonMat(0x546e7a), {
      position: new THREE.Vector3(0, 0.68, -0.48)
    });

        position: new THREE.Vector3(0, 0.74, -0.48),

    const crankGroup = new THREE.Group();
    crankGroup.position.set(0, BIKE_CRANK_Y, BIKE_CRANK_Z);

  function createFallbackAtlasTexture(accentColor) {
    const tex = createCanvasTexture(512, 512, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      const cols = 8;
      const rows = 9;
      const cw = w / cols;
      const ch = h / rows;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cx = c * cw + cw * 0.5;
          const cy = r * ch + ch * 0.52;
          const bounce = Math.sin((c / cols) * Math.PI * 2) * 2.5;
          ctx.fillStyle = accentColor;
          ctx.beginPath();
          ctx.arc(cx, cy - 8 + bounce, cw * 0.28, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffe6cc';
          ctx.beginPath();
          ctx.arc(cx, cy - 6 + bounce, cw * 0.22, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#231815';
          ctx.beginPath();
          ctx.arc(cx - 5, cy - 6 + bounce, 2.2, 0, Math.PI * 2);
          ctx.arc(cx + 5, cy - 6 + bounce, 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = accentColor;
          ctx.fillRect(cx - cw * 0.16, cy + 6 + bounce, cw * 0.32, ch * 0.26);
        }
      }
    });
    tex.magFilter = THREE.LinearFilter;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    return tex;
  }

  function analyzeCodexSpritesheet(img) {
    const cols = 8;
    const approxRows = Math.round((img.height / img.width) * cols * (192 / 208));
    const rows = (approxRows === 11 || img.height >= 2100) ? 11 : 9;

    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);

    const cellW = Math.floor(img.width / cols);
    const cellH = Math.floor(img.height / rows);
    const validFramesPerRow = [];
    let globalBottomRatios = [];

    for (let r = 0; r < rows; r++) {
      const validCols = [];
      for (let c = 0; c < cols; c++) {
        const imgData = ctx.getImageData(c * cellW, r * cellH, cellW, cellH).data;
        let nonTransparentCount = 0;
        let maxY = 0;
        for (let py = 0; py < cellH; py += 2) {
          for (let px = 0; px < cellW; px += 2) {
            const a = imgData[(py * cellW + px) * 4 + 3];
            if (a > 24) {
              nonTransparentCount++;
              if (py > maxY) maxY = py;
            }
          }
        }
        if (nonTransparentCount > 18) {
          validCols.push(c);
          if (r === 0 || r === 3) {
            globalBottomRatios.push((cellH - 1 - maxY) / cellH);
          }
        }
      }
      validFramesPerRow.push(validCols.length > 0 ? validCols : [0]);
    }

    let bottomPadRatio = 0.04;
    if (globalBottomRatios.length > 0) {
      globalBottomRatios.sort((a, b) => a - b);
      bottomPadRatio = globalBottomRatios[Math.floor(globalBottomRatios.length * 0.3)];
    }

    return {
      cols,
      rows,
      hasLookDirections: rows >= 11,
      validFramesPerRow,
      bottomPadRatio: THREE.MathUtils.clamp(bottomPadRatio, 0.0, 0.22)
    };
  }

  function loadCodexPetAtlas(charType) {
    const spec = CODEX_PET_REGISTRY[charType] || CODEX_PET_REGISTRY.miku;
    if (codexPetAtlasCache[spec.slug]) {
      return codexPetAtlasCache[spec.slug];
    }

    const fallbackTex = createFallbackAtlasTexture(spec.fallbackColor);
    const entry = {
      slug: spec.slug,
      texture: fallbackTex,
      cols: 8,
      rows: 9,
      hasLookDirections: false,
      validFramesPerRow: Array.from({ length: 9 }, () => [0, 1, 2, 3, 4, 5, 6, 7]),
      bottomPadRatio: 0.05,
      loaded: false,
      subscribers: []
    };
    codexPetAtlasCache[spec.slug] = entry;

    const cdnUrls = [
      `https://cdn.jsdelivr.net/gh/legeling/awesome-codex-pet@main/pets/${spec.slug}/spritesheet.webp`,
      `https://fastly.jsdelivr.net/gh/legeling/awesome-codex-pet@main/pets/${spec.slug}/spritesheet.webp`,
      `https://raw.githubusercontent.com/legeling/awesome-codex-pet/main/pets/${spec.slug}/spritesheet.webp`
    ];

    function tryLoadUrl(idx) {
      if (idx >= cdnUrls.length) return;
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const meta = analyzeCodexSpritesheet(img);
        const tex = new THREE.Texture(img);
        tex.encoding = THREE.sRGBEncoding;
        tex.magFilter = THREE.LinearFilter;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.wrapS = THREE.ClampToEdgeWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.needsUpdate = true;

        entry.texture = tex;
        entry.cols = meta.cols;
        entry.rows = meta.rows;
        entry.hasLookDirections = meta.hasLookDirections;
        entry.validFramesPerRow = meta.validFramesPerRow;
        entry.bottomPadRatio = meta.bottomPadRatio;
        entry.loaded = true;

        entry.subscribers.forEach((cb) => cb(entry));
      };
      img.onerror = () => {
        tryLoadUrl(idx + 1);
      };
      img.src = cdnUrls[idx];
    }

    tryLoadUrl(0);
    return entry;
  }

  function createChibiCharacter(opts) {

      uMap: { value: atlasEntry.texture },

    const spriteMat = new THREE.ShaderMaterial({
      uniforms: spriteUniforms,

      clipping: true,
      transparent: true,
      side: THREE.DoubleSide,
      vertexShader: `
        #include <clipping_planes_pars_vertex>
        varying vec2 vUv;
        varying vec3 vWorldPos;
        void main() {
          vUv = uv;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * mvPosition;
          #include <clipping_planes_vertex>
        }
      `,
      fragmentShader: `
        #include <clipping_planes_pars_fragment>
        uniform sampler2D uMap;
        uniform vec2 uUvOffset;
        uniform vec2 uUvScale;
        uniform float uFlipX;
        uniform float uCropBottom;
        uniform float uCropTop;
        uniform float uTrainOpacity;
        uniform float uIsTrainClipped;
        varying vec2 vUv;
        varying vec3 vWorldPos;
        void main() {
          #include <clipping_planes_fragment>
          if (vUv.y < uCropBottom || vUv.y > uCropTop) discard;
          vec2 localUv = vUv;
          if (uFlipX > 0.5) {
            localUv.x = 1.0 - localUv.x;
          }
          // Inset slightly from cell borders to prevent sprite atlas bleeding
          localUv = clamp(localUv, 0.006, 0.994);
          vec2 atlasUv = uUvOffset + localUv * uUvScale;
          vec4 texCol = texture2D(uMap, atlasUv);

          float fade = 1.0;
          if (uIsTrainClipped > 0.5) {
            float edgeFade = smoothstep(18.9, 13.8, abs(vWorldPos.x));
            fade = uTrainOpacity * edgeFade;
          }
          float alpha = texCol.a * fade;
          if (alpha < 0.14) discard;

          // Warm daylight anime grade matching the diorama lighting
          vec3 rgb = texCol.rgb * 1.04;
          gl_FragColor = vec4(rgb, alpha);
        }
      `
    });

    // Custom depth material so sunlight casts the character's animated silhouette shadow
    const depthMat = new THREE.ShaderMaterial({
      uniforms: {
        uMap: spriteUniforms.uMap,
        uUvOffset: spriteUniforms.uUvOffset,
        uUvScale: spriteUniforms.uUvScale,
        uFlipX: spriteUniforms.uFlipX,
        uCropBottom: spriteUniforms.uCropBottom,
        uCropTop: spriteUniforms.uCropTop
      },
      clippingPlanes: clipPlanes,
      clipping: true,
      side: THREE.DoubleSide,
      vertexShader: `
        #include <clipping_planes_pars_vertex>
        varying vec2 vUv;
        void main() {
          vUv = uv;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);

      fragmentShader: `
        #include <clipping_planes_pars_fragment>
        #include <packing>
        uniform sampler2D uMap;

        uniform vec2 uUvScale;

          vec2 atlasUv = uUvOffset + clamp(localUv, 0.006, 0.994) * uUvScale;

          gl_FragColor = packDepthToRGBA(gl_FragCoord.z);

    });

    const billboardMesh = new THREE.Mesh(spriteGeo, spriteMat);
    billboardMesh.customDepthMaterial = depthMat;

      spriteUniforms.uMap.value = loadedEntry.texture;

  const _actorWorldPos = new THREE.Vector3();
  const _camRight = new THREE.Vector3();
  const _camForward = new THREE.Vector3();
  const _toCam = new THREE.Vector3();
  const _parentQuat = new THREE.Quaternion();

  // Codex Pet standard row indices:
  // Row 0: Idle | Row 1: Waving | Row 2: Waiting | Row 3: Running
  // Row 4: Running right | Row 5: Running left | Row 6: Jumping | Row 7: Review (Signature Trick)
  // Row 9 & 10 (v2): 16 clockwise look directions
  function updateAllCodexPetBillboards(time) {
    camera.getWorldDirection(_camForward);
    _camRight.crossVectors(_camForward, camera.up).normalize();

    for (let i = 0; i < chibiDynamicActors.length; i++) {
      const actor = chibiDynamicActors[i];
      if (!actor.group.visible) continue;

      actor.group.getWorldPosition(_actorWorldPos);

      // Track world-space velocity vector for accurate screen-space left/right running selection
      if (actor.hasLastPos) {
        const dx = _actorWorldPos.x - actor.lastWorldPos.x;
        const dz = _actorWorldPos.z - actor.lastWorldPos.z;
        const distSq = dx * dx + dz * dz;
        if (distSq > 0.000004) {
          actor.moveDirWorld.set(dx, 0, dz).normalize();
        }
      } else {
        actor.hasLastPos = true;
      }
      actor.lastWorldPos.copy(_actorWorldPos);

      // Rotate billboard on Y axis so it always faces the camera cleanly
      _toCam.subVectors(camera.position, _actorWorldPos);
      const worldYawToCam = Math.atan2(_toCam.x, _toCam.z);
      actor.group.getWorldQuaternion(_parentQuat);
      const parentEuler = new THREE.Euler().setFromQuaternion(_parentQuat, 'YXZ');

      const entry = actor.atlasEntry;
      const totalCols = entry.cols || 8;
      const totalRows = entry.rows || 9;

      let targetRow = 0;
      let flipX = 0.0;
      let fps = 8.0;
      let rollZ = 0.0;

      if (actor.animMode === 'run_board' || actor.animMode === 'jump_board') {
        const screenRightDot = actor.moveDirWorld.dot(_camRight);
        if (actor.animMode === 'jump_board' || (actor.boardHopY && actor.boardHopY > 0.11)) {
          targetRow = 6; // Jumping row for threshold leap & pre-dash hop
          fps = 12.5;
        } else if (screenRightDot > 0.16) {
          targetRow = 4; // Running right
          fps = 15.5;
        } else if (screenRightDot < -0.16) {
          targetRow = 5; // Running left
          fps = 15.5;
        } else {
          // Alternate dynamic running / jumping frames when sprinting into the doorway
          targetRow = (Math.floor(time * 6.0) % 3 === 0) ? 6 : 3;
          fps = 15.5;
        }

        // Physical 3D running cadence bounce, squash-and-stretch, and dynamic stride tilt
        const stridePhase = time * 24.0 + actor.phase * 4.0;
        const strideSin = Math.sin(stridePhase);
        const strideBounce = Math.abs(strideSin) * 0.115;
        const totalHopY = strideBounce + (actor.boardHopY || 0.0);
        const squash = 1.0 + Math.cos(stridePhase * 2.0) * 0.075;

        actor.billboardMesh.position.y = actor.spriteH * (0.5 - entry.bottomPadRatio) + totalHopY;
        actor.billboardMesh.scale.set(1.0 / Math.sqrt(squash), squash, 1.0);
        const shadowScale = THREE.MathUtils.clamp(1.0 - totalHopY * 1.4, 0.45, 1.0);
        actor.contactShadow.scale.setScalar(shadowScale);

        rollZ = strideSin * 0.115 - screenRightDot * 0.09;
      } else if (actor.animMode === 'walk' && actor.walkSpeed > 0.05) {
        // Project world movement vector onto camera right vector
        const screenRightDot = actor.moveDirWorld.dot(_camRight);
        if (screenRightDot > 0.22) {
          targetRow = 4; // Running right
        } else if (screenRightDot < -0.22) {
          targetRow = 5; // Running left
        } else {
          targetRow = 3; // Running (front/back)
        }
        fps = 9.5;
        const walkStride = Math.sin(time * 15.0 + actor.phase * 3.0);
        actor.billboardMesh.position.y = actor.spriteH * (0.5 - entry.bottomPadRatio) + Math.abs(walkStride) * 0.042;
        rollZ = walkStride * 0.045;
      } else if (actor.animMode === 'sit') {
        // Calm idle breathing pose while seated inside the train or taxi
        targetRow = 0;
        fps = 4.5;
      } else {
        // Stationary / waiting: cycle through the character's built-in showcase actions
        // (Row 0: Idle, Row 1: Waving, Row 2: Waiting, Row 6: Jumping, Row 7: Review / Coin Trick)
        const showcaseRows = actor.charType === 'mikoto'
          ? [0, 1, 2, 7, 0, 6, 1, 7]
          : [0, 1, 2, 0, 1, 7, 2, 6];
        const cycleSlot = Math.floor((time + actor.phase) * 0.42) % showcaseRows.length;
        targetRow = showcaseRows[cycleSlot];
        fps = 7.8;
      }

      actor.billboardMesh.rotation.set(actor.leanX || 0, worldYawToCam - parentEuler.y, rollZ);

      targetRow = Math.min(targetRow, totalRows - 1);
      const validCols = (entry.validFramesPerRow && entry.validFramesPerRow[targetRow]) || [0];
      const frameIdx = Math.floor((time * fps) + actor.phase * 3.0) % validCols.length;
      const col = validCols[frameIdx];

      // In Three.js UV coordinates, v = 0 is bottom of image, v = 1 is top of image
      const uScale = 1.0 / totalCols;
      const vScale = 1.0 / totalRows;
      const uOffset = col * uScale;
      const vOffset = 1.0 - (targetRow + 1) * vScale;

      actor.spriteUniforms.uUvScale.value.set(uScale, vScale);
      actor.spriteUniforms.uUvOffset.value.set(uOffset, vOffset);
      actor.spriteUniforms.uFlipX.value = flipX;
    }
  }

  function resetPersonSpriteCrop(person) {
    person.leanX = 0;

  function setPersonWalkPose(person, walkSpeed, time, phase = 0) {
    person.phase = phase;
    person.walkSpeed = walkSpeed;
    person.animMode = walkSpeed > 0.05 ? 'walk' : 'idle';
    resetPersonSpriteCrop(person);
    person.billboardMesh.position.set(0, person.spriteH * (0.5 - person.atlasEntry.bottomPadRatio), 0);
    person.billboardMesh.scale.set(1, 1, 1);
    person.contactShadow.visible = true;
    person.contactShadow.scale.setScalar(1);
    person.spriteUniforms.uIsTrainClipped.value = 0.0;
  }

  function setPersonRunBoardPose(person, walkSpeed, time, phase = 0, hopY = 0.0, isJumpMode = false, isClipped = true) {
    person.phase = phase;

    person.animMode = isJumpMode ? 'jump_board' : 'run_board';

    person.leanX = 0.12;

  function setPersonSeatedPose(person, time, phase = 0, insideTrain = true) {
    person.phase = phase;

    resetPersonSpriteCrop(person);
    person.billboardMesh.position.set(0, person.spriteH * (0.44 - person.atlasEntry.bottomPadRatio), 0);
    // Vehicle cabins are much lower than the train; compress the 2D sprite instead of letting its head pass through the roof.
    person.billboardMesh.scale.set(insideTrain ? 1 : 0.82, insideTrain ? 1 : 0.56, 1);
    person.contactShadow.visible = false;
    person.spriteUniforms.uIsTrainClipped.value = insideTrain ? 1.0 : 0.0;
  }

  function setPersonVehicleApproachPose(person, walkSpeed, time, phase, compression) {
    setPersonWalkPose(person, walkSpeed, time, phase);
    const c = THREE.MathUtils.clamp(compression, 0, 1);
    const sx = THREE.MathUtils.lerp(1, 0.82, c);
    const sy = THREE.MathUtils.lerp(1, 0.60, c);
    person.billboardMesh.scale.set(sx, sy, 1);
    person.billboardMesh.position.set(0, person.spriteH * sy * (0.5 - person.atlasEntry.bottomPadRatio), 0);
  }

  function getVehicleLocalWorldPosition(vehicleGroup, localPosition, target = new THREE.Vector3()) {
    const vehicleScale = vehicleGroup.scale.x || 1;
    const yaw = vehicleGroup.rotation.y;
    const c = Math.cos(yaw);
    const s = Math.sin(yaw);
    return target.set(
      vehicleGroup.position.x + (c * localPosition.x + s * localPosition.z) * vehicleScale,
      vehicleGroup.position.y + localPosition.y * vehicleScale,
      vehicleGroup.position.z + (-s * localPosition.x + c * localPosition.z) * vehicleScale
    );
  }

  function setPersonVehicleLocalPosition(person, vehicleGroup, localPosition) {
    getVehicleLocalWorldPosition(vehicleGroup, localPosition, person.group.position);

      #include <clipping_planes_pars_vertex>
      varying vec3 vWorldPos;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * mvPosition;

      }

      #include <clipping_planes_pars_fragment>
      uniform float uTime;
      uniform float uTrainOpacity;
      varying vec3 vWorldPos;
      varying vec2 vUv;
      void main() {
        #include <clipping_planes_fragment>
        float edgeFade = smoothstep(18.9, 13.8, abs(vWorldPos.x));

  function updateBoardingEffects(delta) {
    for (let i = 0; i < boardingFxPool.length; i++) {
      const fx = boardingFxPool[i];
      if (!fx.active) continue;
      fx.age += delta;
      const u = fx.age / fx.life;
      if (u >= 1.0) {
        fx.active = false;
        fx.puffSprite.visible = false;
        fx.sigSprite.visible = false;
        fx.streakMesh.visible = false;
        fx.ringMesh.visible = false;
        continue;
      }

      if (fx.kind === 'puff') {
        fx.puffSprite.position.x += fx.vx * delta;
        fx.puffSprite.position.y += fx.vy * delta;
        fx.puffSprite.position.z += fx.vz * delta;
        fx.puffSprite.scale.setScalar(fx.baseScale * (1.0 + u * 1.35));
        fx.puffSprite.material.opacity = (1.0 - u) * 0.85;
      } else if (fx.kind === 'signature') {
        fx.sigSprite.position.x += fx.vx * delta;
        fx.sigSprite.position.y += fx.vy * delta;
        fx.sigSprite.position.z += fx.vz * delta;
        fx.sigSprite.scale.setScalar(fx.baseScale * (0.85 + Math.sin(u * Math.PI) * 0.55));
        fx.sigSprite.material.opacity = (1.0 - Math.pow(u, 1.4)) * 0.95;
      } else if (fx.kind === 'streak') {
        fx.streakMesh.position.x += fx.vx * delta;
        fx.streakMesh.position.y += fx.vy * delta;
        fx.streakMesh.position.z += fx.vz * delta;
        fx.streakMesh.scale.set(fx.baseScale * (1.15 - u * 0.4), 1.0 - u * 0.5, 1);
        fx.streakMesh.material.opacity = (1.0 - u) * 0.9;
      } else if (fx.kind === 'ring') {
        fx.ringMesh.scale.setScalar(fx.baseScale + u * 2.1);
        fx.ringMesh.material.opacity = (1.0 - u) * 0.85;
      }
    }
