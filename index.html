        drop.y -= drop.speed * (0.72 + atmosphereCurrent.rain * 0.28) * delta;
        drop.x -= (1.8 + Math.sin(elapsed * 0.7 + i) * 0.18) * delta;
        drop.z += 0.24 * delta;
        if (drop.y < 0.22 || drop.x < -weatherHalfWidth - 2) {
          resetRainDrop(drop, true);
        }
        const offset = i * 6;
        rainPositions[offset] = drop.x;
        rainPositions[offset + 1] = drop.y;
        rainPositions[offset + 2] = drop.z;
        rainPositions[offset + 3] = drop.x + 0.11;
        rainPositions[offset + 4] = drop.y + drop.length;
        rainPositions[offset + 5] = drop.z - 0.035;
      }
      rainPositionAttr.needsUpdate = true;
    }

    snowSystem.visible = atmosphereCurrent.snow > 0.012;
    snowMaterial.opacity = 0.82 * atmosphereCurrent.snow;
    if (snowSystem.visible) {
      for (let i = 0; i < snowCount; i++) {
        const flake = snowFlakes[i];
        flake.y -= flake.speed * delta;
        flake.x += (
          Math.sin(elapsed * 0.72 + flake.phase) * flake.drift +
          0.20
        ) * delta;
        flake.z += Math.cos(elapsed * 0.54 + flake.phase) * flake.drift * 0.55 * delta;
        if (flake.y < 0.26 || flake.x > weatherHalfWidth + 2) {
          resetSnowFlake(flake, true);
        }
        const offset = i * 3;
        snowPositions[offset] = flake.x;
        snowPositions[offset + 1] = flake.y;
        snowPositions[offset + 2] = flake.z;
      }
      snowPositionAttr.needsUpdate = true;
    }
  }

  function updateAtmosphere(delta, elapsed) {
    const blend = 1.0 - Math.exp(-delta * 2.8);
    skyMat.uniforms.uHorizon.value.lerp(atmosphereTarget.sky[0], blend);
    skyMat.uniforms.uMidSky.value.lerp(atmosphereTarget.sky[1], blend);
    skyMat.uniforms.uZenith.value.lerp(atmosphereTarget.sky[2], blend);
    skyMat.uniforms.uOvercastColor.value.lerp(atmosphereTarget.cloudColor, blend);
    skyMat.uniforms.uTime.value = elapsed;
    skyMat.uniforms.uOvercast.value +=
      (atmosphereTarget.overcast - skyMat.uniforms.uOvercast.value) * blend;

    hemiLight.color.lerp(atmosphereTarget.hemiSky, blend);
    hemiLight.groundColor.lerp(atmosphereTarget.hemiGround, blend);
    sunLight.color.lerp(atmosphereTarget.sunColor, blend);
    fillLight.color.lerp(atmosphereTarget.fillColor, blend);
    sunLight.position.lerp(atmosphereTarget.sunPosition, blend);
    sceneFog.color.lerp(atmosphereTarget.fogColor, blend);

    atmosphereCurrent.sunIntensity +=
      (atmosphereTarget.sunIntensity - atmosphereCurrent.sunIntensity) * blend;
    atmosphereCurrent.hemiIntensity +=
      (atmosphereTarget.hemiIntensity - atmosphereCurrent.hemiIntensity) * blend;
    atmosphereCurrent.fillIntensity +=
      (atmosphereTarget.fillIntensity - atmosphereCurrent.fillIntensity) * blend;
    atmosphereCurrent.lampGlass +=
      (atmosphereTarget.lampGlass - atmosphereCurrent.lampGlass) * blend;
    atmosphereCurrent.lampCore +=
      (atmosphereTarget.lampCore - atmosphereCurrent.lampCore) * blend;
    atmosphereCurrent.lampGlow +=
      (atmosphereTarget.lampGlow - atmosphereCurrent.lampGlow) * blend;
    atmosphereCurrent.lampLight +=
      (atmosphereTarget.lampLight - atmosphereCurrent.lampLight) * blend;
    atmosphereCurrent.interiorA +=
      (atmosphereTarget.interiorA - atmosphereCurrent.interiorA) * blend;
    atmosphereCurrent.interiorB +=
      (atmosphereTarget.interiorB - atmosphereCurrent.interiorB) * blend;
    atmosphereCurrent.stars +=
      (atmosphereTarget.stars - atmosphereCurrent.stars) * blend;
    atmosphereCurrent.fogNear +=
      (atmosphereTarget.fogNear - atmosphereCurrent.fogNear) * blend;
    atmosphereCurrent.fogFar +=
      (atmosphereTarget.fogFar - atmosphereCurrent.fogFar) * blend;
    atmosphereCurrent.rain +=
      (atmosphereTarget.rain - atmosphereCurrent.rain) * blend;
    atmosphereCurrent.snow +=
      (atmosphereTarget.snow - atmosphereCurrent.snow) * blend;

    sunLight.intensity = atmosphereCurrent.sunIntensity;
    hemiLight.intensity = atmosphereCurrent.hemiIntensity;
    fillLight.intensity = atmosphereCurrent.fillIntensity;
    sceneFog.near = atmosphereCurrent.fogNear;
    sceneFog.far = atmosphereCurrent.fogFar;
    lampGlassMat.emissiveIntensity = atmosphereCurrent.lampGlass;
    lampCoreMat.emissiveIntensity = atmosphereCurrent.lampCore;
    lampGlowMat.opacity = atmosphereCurrent.lampGlow;
    interiorLight1.intensity = atmosphereCurrent.interiorA;
    interiorLight2.intensity = atmosphereCurrent.interiorB;
    streetLampLights.forEach((light) => {
      light.intensity = atmosphereCurrent.lampLight;
    });
    starMaterial.opacity = atmosphereCurrent.stars * 0.92;
    moonMaterial.opacity = Math.max(0, atmosphereCurrent.stars - 0.1) * 0.62;
    starField.visible = atmosphereCurrent.stars > 0.015;
    moonSprite.visible = atmosphereCurrent.stars > 0.18;
    fallingPetalMat.opacity = THREE.MathUtils.clamp(
      0.94 - atmosphereCurrent.rain * 0.47 - atmosphereCurrent.snow * 0.64,
      0.20,
      0.94
    );

    updateWeatherParticles(delta, elapsed);
  }

  function normalizeAtmosphereState(value) {
    return {
      time: atmosphereTimePresets[value && value.time] ? value.time : 'day',
      weather: atmosphereWeatherPresets[value && value.weather] ? value.weather : 'clear'
    };
  }

  function readSavedAtmosphereState() {
    try {
      return normalizeAtmosphereState(JSON.parse(localStorage.getItem('sakura-atmosphere') || '{}'));
    } catch {
      return { time: 'day', weather: 'clear' };
    }
  }

  function updateAtmosphereControls() {
    const time = atmosphereTimePresets[atmosphereState.time];
    const weather = atmosphereWeatherPresets[atmosphereState.weather];
    document.querySelectorAll('[data-time]').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.time === atmosphereState.time));
    });
    document.querySelectorAll('[data-weather]').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.weather === atmosphereState.weather));
    });
    const summary = document.getElementById('atmo-summary');
    const summaryIcon = document.getElementById('atmo-summary-icon');
    if (summary) {
      summary.textContent = `${weather.label} · ${time.label}`;
    }
    if (summaryIcon) {
      summaryIcon.textContent = weather.icon;
    }
    document.documentElement.style.background = time.body;
  }

  function setAtmosphereState(next, options = {}) {
    const normalized = normalizeAtmosphereState({
      ...atmosphereState,
      ...next
    });
    atmosphereState.time = normalized.time;
    atmosphereState.weather = normalized.weather;
    Object.assign(atmosphereTarget, buildAtmosphereTarget());
    updateAtmosphereControls();

    if (options.persist !== false) {
      try {
        localStorage.setItem('sakura-atmosphere', JSON.stringify(atmosphereState));
      } catch {
        // Private browsing and locked-down webviews may reject storage.
      }
    }

    window.dispatchEvent(new CustomEvent('sakura:atmosphere-changed', {
      detail: { ...atmosphereState }
    }));
  }

  function initializeAtmosphereControls() {
    const controlRoot = document.getElementById('sakura-atmosphere');
    const trigger = document.getElementById('atmo-trigger');
    const closeButton = document.getElementById('atmo-close');
    if (!controlRoot || !trigger) {
      return;
    }

    const setOpen = (open) => {
      controlRoot.classList.toggle('is-open', open);
      trigger.setAttribute('aria-expanded', String(open));
    };

    trigger.addEventListener('click', () => {
      setOpen(!controlRoot.classList.contains('is-open'));
    });
    closeButton.addEventListener('click', () => setOpen(false));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setOpen(false);
      }
    });
    controlRoot.addEventListener('click', (event) => {
      const timeButton = event.target.closest('[data-time]');
      const weatherButton = event.target.closest('[data-weather]');
      if (timeButton) {
        setAtmosphereState({ time: timeButton.dataset.time });
      } else if (weatherButton) {
        setAtmosphereState({ weather: weatherButton.dataset.weather });
      }
    });

    setAtmosphereState(readSavedAtmosphereState(), { persist: false });
  }

  Object.assign(atmosphereTarget, buildAtmosphereTarget());
  initializeAtmosphereControls();

  window.sakuraAtmosphere = {
    setTime: (time) => setAtmosphereState({ time }),
    setWeather: (weather) => setAtmosphereState({ weather }),
    getState: () => ({ ...atmosphereState })
  };

  const clock = new THREE.Clock();
  let renderedFrameIndex = 0;

  function animate() {
    requestAnimationFrame(animate);
    if (document.hidden) return;

    const delta = Math.min(clock.getDelta(), 0.05);
    const elapsed = clock.getElapsedTime();
    const tCycle = elapsed % CYCLE_DURATION;

    globalUniforms.uTime.value = elapsed;
    updateAtmosphere(delta, elapsed);

    // 1. Animate Commuter Train (C1 Continuous Arrival, Stop, Door Open/Close & Departure with Alpha Fade)
    const trainStopX = -1.2;
    let trainX = -28.0;
    let trainSpeed = 0.0;
    let trainOpacity = 0.0;
    let doorSlide = 0.0;

    if (tCycle < 2.2) {
      trainX = -28.0;
      trainSpeed = 0.0;
      trainOpacity = 0.0;
    } else if (tCycle < 11.2) {
      // Smoothly decelerate into the station from West (-24.5) to Stop (-1.2)
      const u = (tCycle - 2.2) / 9.0;
      const easeOut = 1.0 - Math.pow(1.0 - u, 2.6);
      trainX = THREE.MathUtils.lerp(-24.5, trainStopX, easeOut);
      trainSpeed = (1.0 - u) * 5.2;
      trainOpacity = smoothstep(2.2, 4.0, tCycle);
    } else if (tCycle < 16.4) {
      // Stopped at platform: doors slide open (11.4 -> 12.2), stay open for boarding, then close (15.2 -> 16.0)
      trainX = trainStopX;
      trainSpeed = 0.0;
      trainOpacity = 1.0;
      doorSlide = smoothstep(11.4, 12.2, tCycle) * (1.0 - smoothstep(15.2, 16.0, tCycle));
    } else if (tCycle < 25.8) {
      // Smoothly accelerate Eastward from Stop (-1.2) to East exit (+26.5)
      const u = (tCycle - 16.4) / 9.4;
      const easeIn = Math.pow(u, 2.2);
      trainX = THREE.MathUtils.lerp(trainStopX, 26.5, easeIn);
      trainSpeed = u * 6.0;
      trainOpacity = 1.0 - smoothstep(23.6, 25.6, tCycle);
    } else {
      trainX = 28.0;
      trainSpeed = 0.0;
      trainOpacity = 0.0;
    }

    const vibration = THREE.MathUtils.clamp(trainSpeed / 5.0, 0.0, 1.0) * trainOpacity;
    const crossingClosed = smoothstep(2.0, 3.2, tCycle) * (1.0 - smoothstep(23.4, 24.6, tCycle));

    globalUniforms.uTrainOpacity.value = trainOpacity;
    puddleUniforms.uTrainX.value = trainX;
    puddleUniforms.uTrainVibration.value = vibration;

    trainGroup.visible = trainOpacity > 0.01;
    trainGroup.position.x = trainX;

    // Subtle air-spring body roll on upper car bodies only (wheels stay firmly planted on rails)
    trainCarBodies.forEach((body, idx) => {
      body.rotation.x = Math.sin(elapsed * 9.5 + idx * 1.4) * 0.0045 * vibration;
      body.position.y = Math.sin(elapsed * 14.0 + idx) * 0.003 * vibration;
    });

    // Rotate wheelsets proportionally to train speed
    trainWheels.forEach((w) => {
      w.rotation.z -= trainSpeed * delta * 2.8;
    });

    // Slide platform-side passenger doors open/closed
    trainSlidingDoors.forEach((d) => {
      d.group.position.x = d.baseX + d.dir * doorSlide * 0.46;
    });

    // 2. Animate Sakura Tree Branches (Gentle Spring Breeze + Train Slipstream Gust)
    for (let i = 0; i < sakuraSwayBranches.length; i++) {
      const sb = sakuraSwayBranches[i];
      const windWave = Math.sin(elapsed * 1.65 + sb.phase) * 0.028 * sb.ampScale;
      const windWaveZ = Math.cos(elapsed * 1.35 + sb.phase * 0.8) * 0.022 * sb.ampScale;
      const distToTrain = Math.abs(sb.worldX - trainX);
      const trainGust = ( sb.worldZ < -6.0 && distToTrain < 6.5 )
        ? (1.0 - distToTrain / 6.5) * vibration * 0.045
        : 0.0;
      sb.group.rotation.x = windWave + trainGust * 0.5;
      sb.group.rotation.z = windWaveZ - trainGust;
    }

    // 3. Animate Road Vehicles (Collision-Free Left-Hand Traffic & Dedicated Forecourt Taxi Pick-up Bay)
    // Taxi enters along Eastbound lane (z = 11.4), pulls beside the forecourt curb at (x = -0.8, z = 10.3),
    // opens left rear door for Phoebe (tCycle 14.5 -> 18.5), then drives East through the green intersection light.
    let taxiX = 0, taxiZ = 11.4, taxiYaw = -Math.PI / 2, taxiSpeed = 0, taxiDoorAngle = 0;
    if (tCycle < 10.5) {
      const u = tCycle / 10.5;
      taxiX = THREE.MathUtils.lerp(-18.2, -5.8, u);
      taxiZ = 11.4;
      taxiYaw = -Math.PI / 2;
      taxiSpeed = 1.35;
    } else if (tCycle < 14.5) {
      const u = (tCycle - 10.5) / 4.0;
      const ease = smoothstep(0.0, 1.0, u);
      taxiX = THREE.MathUtils.lerp(-5.8, -0.8, ease);
      taxiZ = THREE.MathUtils.lerp(11.4, 10.3, ease);
      taxiYaw = -Math.PI / 2 + Math.sin(ease * Math.PI) * 0.22;
      taxiSpeed = (1.0 - ease * 0.85) * 1.35;
    } else if (tCycle < 19.0) {
      taxiX = -0.8;
      taxiZ = 10.3;
      taxiYaw = -Math.PI / 2;
      taxiSpeed = 0.0;
      const doorT = tCycle - 14.5;
      taxiDoorAngle = smoothstep(0.0, 0.9, doorT) * (1.0 - smoothstep(3.4, 4.2, doorT)) * 0.82;
    } else if (tCycle < 28.2) {
      const u = (tCycle - 19.0) / 9.2;
      const ease = Math.pow(u, 1.35);
      taxiX = THREE.MathUtils.lerp(-0.8, 18.2, ease);
      taxiZ = THREE.MathUtils.lerp(10.3, 11.4, smoothstep(0.0, 0.35, u));
      taxiYaw = -Math.PI / 2 - Math.sin(smoothstep(0.0, 0.35, u) * Math.PI) * 0.22;
      taxiSpeed = u * 2.4;
    } else {
      taxiX = 24.0;
      taxiZ = 11.4;
      taxiYaw = -Math.PI / 2;
      taxiSpeed = 0.0;
    }
    taxiVehicle.group.visible = tCycle < 28.2;
    taxiVehicle.group.position.set(taxiX, 0.25, taxiZ);
    taxiVehicle.group.rotation.y = taxiYaw;
    taxiVehicle.rearDoorPivot.rotation.y = -taxiDoorAngle;
    taxiVehicle.wheels.forEach((w) => { w.rotation.x += taxiSpeed * delta * 3.2; });

    // Car 1 (Yellow Kei Car): Northbound lane (x = 12.95), stops behind stop line (z = -9.5) when barrier is down
    let car1Z = 0, car1Speed = 0;
    if (tCycle < 9.5) {
      const u = tCycle / 9.5;
      const ease = 1.0 - Math.pow(1.0 - u, 2.0);
      car1Z = THREE.MathUtils.lerp(17.8, -9.5, ease);
      car1Speed = (1.0 - u) * 2.5;
    } else if (tCycle < 24.8) {
      car1Z = -9.5;
      car1Speed = 0.0;
    } else {
      const u = (tCycle - 24.8) / 5.2;
      const ease = Math.pow(u, 1.5);
      car1Z = THREE.MathUtils.lerp(-9.5, -18.4, ease);
      car1Speed = u * 2.8;
    }
    crossingCar1.group.position.set(12.95, 0.25, car1Z);
    crossingCar1.group.rotation.y = 0;
    crossingCar1.wheels.forEach((w) => { w.rotation.x -= car1Speed * delta * 3.2; });

    // Car 2 (Blue Sedan): Southbound lane (x = 15.05), waits behind North stop line (z = -17.6), crosses after barrier opens
    let car2Z = -17.6, car2Speed = 0;
    if (tCycle < 24.8) {
      car2Z = -17.6;
      car2Speed = 0.0;
    } else {
      const u = (tCycle - 24.8) / 5.2;
      const ease = smoothstep(0.0, 1.0, u);
      car2Z = THREE.MathUtils.lerp(-17.6, 17.8, ease);
      car2Speed = 3.2;
    }
    crossingCar2.group.position.set(15.05, 0.25, car2Z);
    crossingCar2.group.rotation.y = Math.PI;
    crossingCar2.wheels.forEach((w) => { w.rotation.x -= car2Speed * delta * 3.2; });

    // 4. Animate the 5 Characters (2 Train Passengers + 1 Crosswalk Pedestrian + 1 Taxi Passenger + 1 Photographer)
    function getWalkElevation(zPos) {
      if (zPos <= PLATFORM_SOUTH_EDGE) return PLATFORM_TOP_Y;
      if (zPos < -6.8) {
        const rampT = (-6.8 - zPos) / (-6.8 - PLATFORM_SOUTH_EDGE);
        return THREE.MathUtils.lerp(0.62, PLATFORM_TOP_Y, THREE.MathUtils.clamp(rampT, 0, 1));
      }
      if (zPos <= -1.2) return 0.62;
      if (zPos < -0.5) return THREE.MathUtils.lerp(0.38, 0.62, (-0.5 - zPos) / 0.7);
      return 0.38;
    }

    // Helper for energetic 2-stage anime run & leap train boarding with action FX
    function updateBoardingPassenger(actor, doorWorldX, seatRelX, waitDoneTime, phaseSeed, approachFn) {
      const seatTargetZ = trackCenterZ - 0.30;
      const aisleZ = trackCenterZ + 0.05;
      const seatFloorY = 1.48;

      if (tCycle < 11.55) {
        actor.group.visible = true;
        actor.fxStage = 0;
        approachFn(tCycle);
      } else if (tCycle < 12.05) {
        // Pre-dash excitement hop on the platform as the train doors slide open
        const uHop = (tCycle - 11.55) / 0.50;
        const hopArc = Math.sin(uHop * Math.PI) * 0.16;
        actor.group.visible = true;
        actor.group.position.set(doorWorldX, 1.38, -10.85);
        actor.group.rotation.y = Math.PI;
        setPersonRunBoardPose(actor, 1.8, elapsed, phaseSeed, hopArc, true, false);

        if (actor.fxStage !== 1) {
          actor.fxStage = 1;
          spawnBoardingEffect('ring', doorWorldX, 1.38, -10.85, 0, 0, 0, actor.charType);
          spawnBoardingEffect('signature', doorWorldX, 2.05, -10.85, 0, 0.45, 0, actor.charType);
        }
      } else if (tCycle < 13.25) {
        // Stage 1: Energetic sprint & threshold leap from platform (-10.85) through the train doorway into the aisle
        const rawU = THREE.MathUtils.clamp((tCycle - 12.05) / 1.20, 0.0, 1.0);
        // Fast burst acceleration curve + slight S-sway so running into the door feels dynamic and alive
        const burstU = Math.pow(rawU, 0.78);
        const lateralSway = Math.sin(rawU * Math.PI * 3.0) * 0.065 * (1.0 - rawU);
        // Parabolic leap over the platform-to-train threshold gap
        const leapWindow = THREE.MathUtils.clamp((rawU - 0.22) / 0.56, 0.0, 1.0);
        const hopArc = Math.sin(leapWindow * Math.PI) * 0.21;

        const curX = doorWorldX + lateralSway;
        const curY = THREE.MathUtils.lerp(1.38, seatFloorY, burstU);
        const curZ = THREE.MathUtils.lerp(-10.85, aisleZ, burstU);

        actor.group.visible = true;
        actor.group.position.set(curX, curY, curZ);
        actor.group.rotation.y = Math.PI;
        actor.moveDirWorld.set(lateralSway * 2.0, 0, -1).normalize();
        setPersonRunBoardPose(actor, 3.2, elapsed, phaseSeed, hopArc, hopArc > 0.13, true);

        // Emit footstep dust puffs, speed streaks, and Miku/Mikoto signature FX
        if (!actor.nextFxTime || elapsed >= actor.nextFxTime) {
          actor.nextFxTime = elapsed + 0.095;
          spawnBoardingEffect(
            'puff',
            curX + (Math.random() - 0.5) * 0.16,
            curY + 0.08,
            curZ + 0.18,
            (Math.random() - 0.5) * 0.35,
            0.38 + Math.random() * 0.22,
            0.65,
            actor.charType
          );
          spawnBoardingEffect(
            'streak',
            curX + (Math.random() - 0.5) * 0.28,
            curY + 0.45 + Math.random() * 0.45,
            curZ + 0.32,
            0,
            0,
            1.4,
            actor.charType,
            Math.PI
          );
          if (Math.random() < 0.75) {
            spawnBoardingEffect(
              'signature',
              curX + (Math.random() - 0.5) * 0.32,
              curY + 0.48 + Math.random() * 0.45,
              curZ + 0.15,
              (Math.random() - 0.5) * 0.5,
              0.55 + Math.random() * 0.35,
              0.4,
              actor.charType
            );
          }
        }
      } else if (tCycle < 14.30) {
        // Stage 2: Brisk lateral sprint along the cabin aisle to the bench seat, finishing with a seat hop
        const rawU = THREE.MathUtils.clamp((tCycle - 13.25) / 1.05, 0.0, 1.0);
        const runU = 1.0 - Math.pow(1.0 - rawU, 1.65);
        const targetSeatWorldX = trainX + seatRelX;
        const dirSign = Math.sign(targetSeatWorldX - doorWorldX) || 1;
        const seatHopWindow = THREE.MathUtils.clamp((rawU - 0.65) / 0.35, 0.0, 1.0);
        const hopArc = Math.sin(seatHopWindow * Math.PI) * 0.16;

        const curX = THREE.MathUtils.lerp(doorWorldX, targetSeatWorldX, runU);
        const curZ = THREE.MathUtils.lerp(aisleZ, seatTargetZ, smoothstep(0.55, 1.0, rawU));

        actor.group.visible = true;
        actor.group.position.set(curX, seatFloorY, curZ);
        actor.group.rotation.y = dirSign > 0 ? Math.PI / 2 : -Math.PI / 2;
        actor.moveDirWorld.set(dirSign, 0, 0);
        setPersonRunBoardPose(actor, 2.8, elapsed, phaseSeed, hopArc, seatHopWindow > 0.15, true);

        if (!actor.nextFxTime || elapsed >= actor.nextFxTime) {
          actor.nextFxTime = elapsed + 0.11;
          spawnBoardingEffect(
            'puff',
            curX - dirSign * 0.18,
            seatFloorY + 0.08,
            curZ,
            -dirSign * 0.55,
            0.32,
            (Math.random() - 0.5) * 0.25,
            actor.charType
          );
          spawnBoardingEffect(
            'streak',
            curX - dirSign * 0.28,
            seatFloorY + 0.48 + Math.random() * 0.35,
            curZ + 0.08,
            -dirSign * 1.2,
            0,
            0,
            actor.charType,
            dirSign > 0 ? Math.PI / 2 : -Math.PI / 2
          );
          spawnBoardingEffect(
            'signature',
            curX - dirSign * 0.15,
            seatFloorY + 0.55 + Math.random() * 0.35,
            curZ + 0.08,
            -dirSign * 0.45,
            0.48,
            0,
            actor.charType
          );
        }
      } else if (tCycle < 26.2) {
        const seatWorldX = trainX + seatRelX;
        if (actor.fxStage !== 2) {
          actor.fxStage = 2;
          spawnBoardingEffect('ring', seatWorldX, seatFloorY + 0.12, seatTargetZ, 0, 0, 0, actor.charType);
        }
        actor.group.visible = trainOpacity > 0.04 && Math.abs(seatWorldX) < HALF_BASE - 0.4;
        actor.group.position.set(seatWorldX, seatFloorY, seatTargetZ);
        actor.group.rotation.y = 0;
        setPersonSeatedPose(actor, elapsed, phaseSeed, true);
      } else {
        actor.group.visible = false;
      }
    }

    // 1) Miku (乘电车 1): Waits on platform at Lead Car Middle Door (x = +3.65), boards & sits at Lead Car East bench (+4.85 + 1.55 = +6.40)
    updateBoardingPassenger(passengerBoardA, 3.65, 4.85 + 1.55, 8.0, 0.5, (t) => {
      const u = Math.min(1.0, t / 7.5);
      passengerBoardA.group.position.set(3.65, 1.38, THREE.MathUtils.lerp(-8.5, -10.85, u));
      passengerBoardA.group.rotation.y = Math.PI;
      setPersonWalkPose(passengerBoardA, u < 1.0 ? 1.05 : 0.0, elapsed, 0.5);
    });

    // 2) Mikoto 御坂美琴 (乘电车 2): Enters via West Gate Lane 1 (x = -1.65), walks onto platform to Rear Car East Door (x = -2.95),
    // pauses to showcase her built-in coin-trick / waving / jumping animations, then boards & sits
    updateBoardingPassenger(passengerBoardB, -2.95, -4.85 + 1.55, 11.2, 1.7, (t) => {
      const u = Math.min(1.0, t / 7.8);
      let px = -1.65, pz = 3.2;
      if (u < 0.78) {
        const sub = u / 0.78;
        px = -1.65;
        pz = THREE.MathUtils.lerp(3.2, -10.65, sub);
      } else {
        const sub = (u - 0.78) / 0.22;
        px = THREE.MathUtils.lerp(-1.65, -2.95, sub);
        pz = THREE.MathUtils.lerp(-10.65, -10.85, sub);
      }
      passengerBoardB.group.position.set(px, getWalkElevation(pz), pz);
      passengerBoardB.group.rotation.y = Math.PI;
      setPersonWalkPose(passengerBoardB, u < 1.0 ? 1.45 : 0.0, elapsed, 1.7);
    });

    // 3) WhaleChan (过马路): Crosses the Intersection Zebra Crosswalk (x = 9.8, between z = 8.4 and z = 17.4) on Pedestrian Green Light
    passengerBoardC.group.visible = true;
    if (tCycle < 1.0) {
      // Waiting at North sidewalk curb before crossing
      passengerBoardC.group.position.set(9.8, 0.38, 8.4);
      passengerBoardC.group.rotation.y = 0;
      setPersonWalkPose(passengerBoardC, 0.0, elapsed, 2.9);
    } else if (tCycle < 7.5) {
      // Walking South across the zebra crosswalk while Pedestrian Green light is ON
      const u = smoothstep(0.0, 1.0, (tCycle - 1.0) / 6.5);
      const cz = THREE.MathUtils.lerp(8.4, 17.4, u);
      const cy = (cz > 9.1 && cz < 16.8) ? 0.26 : 0.38;
      passengerBoardC.group.position.set(9.8, cy, cz);
      passengerBoardC.group.rotation.y = 0;
      setPersonWalkPose(passengerBoardC, 1.38, elapsed, 2.9);
    } else if (tCycle < 10.5) {
      // Pauses on South sidewalk
      passengerBoardC.group.position.set(9.8, 0.38, 17.4);
      passengerBoardC.group.rotation.y = Math.PI;
      setPersonWalkPose(passengerBoardC, 0.0, elapsed, 2.9);
    } else if (tCycle < 17.0) {
      // Walks back North across the zebra crosswalk before the flashing Pedestrian Green ends
      const u = smoothstep(0.0, 1.0, (tCycle - 10.5) / 6.5);
      const cz = THREE.MathUtils.lerp(17.4, 8.4, u);
      const cy = (cz > 9.1 && cz < 16.8) ? 0.26 : 0.38;
      passengerBoardC.group.position.set(9.8, cy, cz);
      passengerBoardC.group.rotation.y = Math.PI;
      setPersonWalkPose(passengerBoardC, 1.38, elapsed, 2.9);
    } else {
      // Strolls safely on the North plaza sidewalk while E-W vehicular traffic light is Green
      const u = (tCycle - 17.0) / 13.0;
      const strollZ = 8.4 - Math.sin(u * Math.PI) * 1.6;
      passengerBoardC.group.position.set(9.8, 0.38, strollZ);
      passengerBoardC.group.rotation.y = 0;
      setPersonWalkPose(passengerBoardC, 0.65, elapsed, 2.9);
    }

    // 4) Phoebe (打车): Walks across forecourt to taxi bay, waits/waves, boards Crown Taxi when rear door opens, and rides away
    if (tCycle < 11.5) {
      const u = smoothstep(0.0, 1.0, tCycle / 11.5);
      passengerBoardD.group.visible = true;
      passengerBoardD.group.position.set(-0.8, 0.38, THREE.MathUtils.lerp(-0.2, 9.05, u));
      passengerBoardD.group.rotation.y = 0;
      setPersonWalkPose(passengerBoardD, 1.15, elapsed, 4.1);
    } else if (tCycle < 15.4) {
      // Waits and waves at the curb as the taxi pulls in and opens its left rear door
      passengerBoardD.group.visible = true;
      passengerBoardD.group.position.set(-0.8, 0.38, 9.05);
      passengerBoardD.group.rotation.y = 0;
      setPersonWalkPose(passengerBoardD, 0.0, elapsed, 4.1);
    } else if (tCycle < 17.2) {
      // Steps through the open curb-side rear portal, then settles into the rear seat in vehicle-local coordinates
      const u = smoothstep(0.0, 1.0, (tCycle - 15.4) / 1.8);
      passengerBoardD.group.visible = true;
      if (u < 0.58) {
        const approachU = smoothstep(0.0, 1.0, u / 0.58);
        const portalPos = getVehicleLocalWorldPosition(taxiVehicle.group, TAXI_DOOR_PORTAL_LOCAL);
        passengerBoardD.group.position.set(-0.8, 0.38, 9.05).lerp(portalPos, approachU);
      } else {
        const seatU = smoothstep(0.0, 1.0, (u - 0.58) / 0.42);
        const portalPos = getVehicleLocalWorldPosition(taxiVehicle.group, TAXI_DOOR_PORTAL_LOCAL);
        const seatPos = getVehicleLocalWorldPosition(taxiVehicle.group, TAXI_REAR_SEAT_LOCAL);
        passengerBoardD.group.position.copy(portalPos).lerp(seatPos, seatU);
      }
      passengerBoardD.group.rotation.y = taxiYaw;
      setPersonVehicleApproachPose(passengerBoardD, 1.1, elapsed, 4.1, smoothstep(0.25, 1.0, u));
    } else if (tCycle < 28.0) {
      // Seated in the rear seat of the taxi as the door closes and the taxi drives East
      setPersonVehicleLocalPosition(passengerBoardD, taxiVehicle.group, TAXI_REAR_SEAT_LOCAL);
      passengerBoardD.group.visible = Math.abs(passengerBoardD.group.position.x) < HALF_BASE - 0.5;
      passengerBoardD.group.rotation.y = taxiYaw;
      setPersonSeatedPose(passengerBoardD, elapsed, 4.1, false);
    } else {
      passengerBoardD.group.visible = false;
    }

    // 5) Linnea (旅の写真家): Walks onto the forecourt and photographs the station from a
    //    small tripod, stepping around it now and then to reframe the shot.
    passengerBoardE.group.visible = true;
    passengerBoardE.group.scale.setScalar(ACTOR_DEFAULT_SCALE);
    {
      const PT_A = { x: -2.40, z: 3.10 };    // loop start / end (mid-west plaza)
      const PT_B = { x: 1.60, z: 2.25 };     // west side of the tripod, working the camera
      const PT_C = { x: 3.25, z: 2.25 };     // east side, reframing the same shot
      let px = PT_A.x;
      let pz = PT_A.z;
      let walkSpeed = 0.0;

      if (tCycle < 7.5) {
        const u = smoothstep(0.0, 1.0, tCycle / 7.5);
        px = THREE.MathUtils.lerp(PT_A.x, PT_B.x, u);
        pz = THREE.MathUtils.lerp(PT_A.z, PT_B.z, u);
        walkSpeed = 0.72;
      } else if (tCycle < 18.0) {
        px = PT_B.x;
        pz = PT_B.z;
      } else if (tCycle < 21.0) {
        const u = smoothstep(0.0, 1.0, (tCycle - 18.0) / 3.0);
        px = THREE.MathUtils.lerp(PT_B.x, PT_C.x, u);
        pz = THREE.MathUtils.lerp(PT_B.z, PT_C.z, u);
        walkSpeed = 0.72;
      } else if (tCycle < 25.0) {
        px = PT_C.x;
        pz = PT_C.z;
      } else {
        const u = smoothstep(0.0, 1.0, (tCycle - 25.0) / 5.0);
        px = THREE.MathUtils.lerp(PT_C.x, PT_A.x, u);
        pz = THREE.MathUtils.lerp(PT_C.z, PT_A.z, u);
        walkSpeed = 0.95;
      }

      passengerBoardE.group.position.set(px, 0.38, pz);
      passengerBoardE.group.rotation.y = Math.PI;
      setPersonWalkPose(passengerBoardE, walkSpeed, elapsed, 5.3);

      // Shutter flash — a short additive bloom so you can see her actually take the photo
      let flashA = 0;
      for (let fi = 0; fi < TRIPOD_FLASH_TIMES.length; fi++) {
        const dt = tCycle - TRIPOD_FLASH_TIMES[fi];
        if (dt >= 0 && dt < 0.45) flashA = Math.max(flashA, 1 - dt / 0.45);
      }
      tripodFlash.visible = flashA > 0.02;
      tripodFlash.material.opacity = flashA * 0.78;
      tripodFlash.scale.setScalar(0.34 + 0.34 * flashA);
    }

    // Animate Ticket Gate Barrier Flaps (swing open when Mikoto passes through West Gate Lane 1)
    const activePedestrians = [passengerBoardB];
    gateFlapPairs.forEach((fp) => {
      let someoneNear = false;
      for (let pIdx = 0; pIdx < activePedestrians.length; pIdx++) {
        const ped = activePedestrians[pIdx].group;
        if (ped.visible && Math.abs(ped.position.x - fp.worldX) < 0.45 && Math.abs(ped.position.z - (-5.3)) < 1.35) {
          someoneNear = true;
          break;
        }
      }
      const targetAngle = someoneNear ? Math.PI * 0.46 : 0.0;
      fp.leftPivot.rotation.y += (targetAngle - fp.leftPivot.rotation.y) * Math.min(1.0, delta * 10.0);
      fp.rightPivot.rotation.y += (-targetAngle - fp.rightPivot.rotation.y) * Math.min(1.0, delta * 10.0);
    });

    // 5. Animate Physically Accurate Fountain Water Droplets
    const gravity = 5.8;
    for (let i = 0; i < fountainDropCount; i++) {
      const d = fountainDropsData[i];
      const u = ((elapsed / d.period) + d.phase) % 1.0;
      const t = u * d.period;
      const r = d.r0 + d.vr * t;
      const y = Math.max(0.58, d.y0 + d.vy0 * t - 0.5 * gravity * t * t);
      const x = Math.cos(d.angle) * r;
      const z = Math.sin(d.angle) * r;

      dummy.position.set(x, y, z);
      dummy.rotation.set(0, -d.angle, 0);
      dummy.scale.set(0.85, 1.45, 0.85);
      dummy.updateMatrix();
      fountainDropsMesh.setMatrixAt(i, dummy.matrix);
    }
    fountainDropsMesh.instanceMatrix.needsUpdate = true;

    // 6. Animate Falling Sakura Petals & Train Slipstream Vortex
    puddleUniforms.uRippleAge.value += delta;
    for (let i = 0; i < fallingPetalCount; i++) {
      const p = petalData[i];
      const swayX = Math.sin(elapsed * 2.1 + p.phase) * 0.45;
      const swayZ = Math.cos(elapsed * 1.7 + p.phase) * 0.35;

      p.x += (p.vx + swayX) * delta;
      p.y += p.vy * delta;
      p.z += (p.vz + swayZ) * delta;

      // Aerodynamic vortex when train speeds by
      const dxTrain = p.x - trainX;
      const dzTrain = p.z - trackCenterZ;
      if (Math.abs(dxTrain) < 6.5 && Math.abs(dzTrain) < 3.6 && trainSpeed > 1.0) {
        p.x += trainSpeed * 0.42 * delta;
        p.y += 1.65 * delta;
        p.z += Math.sign(dzTrain || 1) * 1.15 * delta;
      }

      p.rx += 2.2 * delta;
      p.ry += 1.8 * delta;

      if (p.y < 0.32 || p.x > HALF_BASE || p.x < -HALF_BASE) {
        if (Math.abs(p.x + 7.8) < 1.1 && Math.abs(p.z + 8.8) < 1.1 && puddleUniforms.uRippleAge.value > 1.2) {
          puddleUniforms.uRippleCenter.value.set(p.x, p.z);
          puddleUniforms.uRippleAge.value = 0.0;
        }
        p.x = (Math.random() - 0.5) * 34.0;
        p.y = 4.5 + Math.random() * 2.8;
        p.z = (Math.random() - 0.5) * 32.0;
      }

      dummy.position.set(p.x, p.y, p.z);
      dummy.rotation.set(p.rx, p.ry, p.rz);
      dummy.scale.setScalar(p.scale);
      dummy.updateMatrix();
      fallingPetalsMesh.setMatrixAt(i, dummy.matrix);
    }
    fallingPetalsMesh.instanceMatrix.needsUpdate = true;

    // 7. Animate Catenary & Overhead Wire Vibration
    const pantographWorldX = trainX - 2.2;
    for (let w = 0; w < dynamicWires.length; w++) {
      const wire = dynamicWires[w];
      const posAttr = wire.geo.attributes.position;
      const spanClose = wire.isCatenary && pantographWorldX >= wire.x1 - 1.5 && pantographWorldX <= wire.x2 + 1.5;
      for (let i = 0; i <= wire.segs; i++) {
        const u = i / wire.segs;
        const env = Math.sin(u * Math.PI);
        const breezeZ = Math.sin(elapsed * 2.0 + u * 3.14) * 0.025 * env;
        const vibY = spanClose ? Math.sin(elapsed * 38.0 + u * 12.0) * 0.032 * vibration * env : 0;
        posAttr.setY(i, wire.yBase - env * wire.sag + vibY);
        posAttr.setZ(i, wire.zBase + breezeZ);
      }
      posAttr.needsUpdate = true;
    }

    // 8. Animate Level Crossing Barriers, Warning Lights, Railway Signal, Clock & Ticket Gates
    barrierPivots.forEach((b) => {
      b.pivot.rotation.z = b.dir * (1.0 - crossingClosed) * (Math.PI * 0.44);
    });
    if (crossingClosed > 0.05) {
      const flash = Math.floor(elapsed * 4.5) % 2 === 0;
      warningLightMats[0].color.setHex(flash ? 0xff1744 : 0x241014);
      warningLightMats[1].color.setHex(flash ? 0x241014 : 0xff1744);
      warningGlowMats[0].opacity = flash ? 0.95 : 0.0;
      warningGlowMats[1].opacity = flash ? 0.0 : 0.95;
    } else {
      warningLightMats[0].color.setHex(0x241014);
      warningLightMats[1].color.setHex(0x241014);
      warningGlowMats[0].opacity = 0.0;
      warningGlowMats[1].opacity = 0.0;
    }

    // Trackside 3-aspect signal light state
    sigGreenMat.emissiveIntensity = tCycle > 26.0 || tCycle < 2.0 ? 1.1 : 0.08;
    sigYellowMat.emissiveIntensity = tCycle >= 2.0 && tCycle < 11.8 ? 1.1 : 0.08;
    sigRedMat.emissiveIntensity = tCycle >= 11.8 && tCycle <= 26.0 ? 1.1 : 0.08;

    // Intersection Traffic Lights & Pedestrian Signals with High-Contrast Glow & Flashing Effects
    const fastBlink = (Math.floor(elapsed * 8.0) % 2 === 0) ? 1.0 : 0.08;
    const yellowPulse = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(elapsed * 14.0));

    // E-W Avenue Signal (ewLightMats):
    // RED during 0.0 -> 18.5 (while WhaleChan crosses the E-W avenue crosswalk);
    // GREEN during 18.5 -> 25.0, FLASHING GREEN during 25.0 -> 28.0 (as Taxi with Phoebe drives through);
    // FLASHING YELLOW during 28.0 -> 30.0.
    let ewR = 0, ewY = 0, ewG = 0, ewPedR = 0, ewPedG = 0;
    if (tCycle < 18.5) {
      ewR = 1.0;
      ewPedR = 1.0;
    } else if (tCycle < 25.0) {
      ewG = 1.0;
      ewPedG = 1.0;
    } else if (tCycle < 28.0) {
      ewG = fastBlink;
      ewPedG = fastBlink;
    } else {
      ewY = yellowPulse;
      ewPedR = 1.0;
    }
    setSignalState(ewLightMats, ewR, ewY, ewG, ewPedR, ewPedG);

    // N-S Road Signal & Crosswalk across E-W Avenue (nsLightMats):
    // GREEN during 0.0 -> 12.5, FLASHING GREEN during 12.5 -> 16.5 (WhaleChan crosses on steady & flashing green!);
    // FLASHING YELLOW during 16.5 -> 18.5;
    // RED during 18.5 -> 24.5; GREEN during 24.5 -> 30.0 (when crossing barriers open for N-S cars).
    let nsR = 0, nsY = 0, nsG = 0, nsPedR = 0, nsPedG = 0;
    if (tCycle < 12.5) {
      nsG = 1.0;
      nsPedG = 1.0;
    } else if (tCycle < 16.5) {
      nsG = fastBlink;
      nsPedG = fastBlink;
    } else if (tCycle < 18.5) {
      nsY = yellowPulse;
      nsPedR = 1.0;
    } else if (tCycle < 24.5) {
      nsR = 1.0;
      nsPedR = 1.0;
    } else {
      nsG = 1.0;
      nsPedG = 1.0;
    }
    setSignalState(nsLightMats, nsR, nsY, nsG, nsPedR, nsPedG);

    // Station clock ticking second hand
    secondHandPivot.rotation.z = -Math.floor(elapsed) * (Math.PI * 2 / 60);

    // Blinking IC ticket gate indicators
    gateIndicators.forEach((gi) => {
      gi.mat.emissiveIntensity = 0.45 + 0.55 * Math.sin(elapsed * 4.2 + gi.phase);
    });

    // 9. Animate Little Bird perching on Utility Pole Crossarm & Flying
    const bCycle = elapsed % 18.0;
    if (bCycle < 3.5) {
      const u = bCycle / 3.5;
      birdGroup.position.set(
        THREE.MathUtils.lerp(-15.0, -3.2, u),
        THREE.MathUtils.lerp(11.5, 7.12, smoothstep(0.0, 1.0, u)),
        THREE.MathUtils.lerp(-22.0, -15.1, u)
      );
      birdWingL.rotation.x = Math.sin(elapsed * 26.0) * 0.65;
      birdWingR.rotation.x = -Math.sin(elapsed * 26.0) * 0.65;
    } else if (bCycle < 14.5) {
      birdGroup.position.set(-3.2, 7.12 + Math.abs(Math.sin(elapsed * 5.0)) * 0.03, -15.1);
      birdGroup.rotation.y = Math.sin(elapsed * 2.2) * 0.35;
      birdWingL.rotation.x = 0;
      birdWingR.rotation.x = 0;
    } else {
      const u = (bCycle - 14.5) / 3.5;
      birdGroup.position.set(
        THREE.MathUtils.lerp(-3.2, 14.0, u),
        THREE.MathUtils.lerp(7.12, 12.5, u),
        THREE.MathUtils.lerp(-15.1, -21.0, u)
      );
      birdWingL.rotation.x = Math.sin(elapsed * 26.0) * 0.65;
      birdWingR.rotation.x = -Math.sin(elapsed * 26.0) * 0.65;
    }

    // 10. Update all codexpet.top HD-2D sprite billboards & animation frames
    updateAllCodexPetBillboards(elapsed);
    updateBoardingEffects(delta);

    // Moving shadows stay responsive at 30 Hz while avoiding a full shadow pass every frame.
    renderer.shadowMap.needsUpdate = (renderedFrameIndex++ % 2) === 0;

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  window.onload = function () {
    animate();
  };
</script>
</body>
</html>
