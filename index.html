<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="桜ヶ丘駅：可切换晴雨雪与夕阳、蓝调、傍晚的日式樱花车站 3D 微缩景观，支持浏览器和 Electron 桌景。" />
  <meta name="author" content="Google Gemini, DeepSeek and project contributors" />
  <meta name="theme-color" content="#dceeff" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ffc8dd'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23fff0f6'/%3E%3C/svg%3E" />
  <title>桜ヶ丘駅 · 日式樱花车站 3D 微缩景观</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #f6fbff 0%, #dceeff 52%, #c5def6 100%);
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      outline: none;
    }
    canvas:active {
      cursor: grabbing;
    }
    #sakura-atmosphere {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 1000;
      color: #26384b;
      font-family: "Yu Gothic UI", "Microsoft YaHei", sans-serif;
      pointer-events: auto;
    }
    .atmo-trigger,
    .atmo-panel {
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(255, 246, 250, 0.82));
      box-shadow:
        0 12px 34px rgba(45, 75, 102, 0.16),
        inset 0 0 0 1px rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
    }
    .atmo-trigger {
      min-width: 162px;
      height: 38px;
      padding: 0 13px;
      border: 0;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: inherit;
      font: 600 12px/1 "Yu Gothic UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      touch-action: manipulation;
    }
    .atmo-trigger:hover {
      transform: translateY(-1px);
    }
    .atmo-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .atmo-play-btn {
      height: 38px;
      padding: 0 13px;
      border: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #26384b;
      font: 600 12px/1 "Yu Gothic UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      touch-action: manipulation;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(255, 246, 250, 0.82));
      box-shadow:
        0 12px 34px rgba(45, 75, 102, 0.16),
        inset 0 0 0 1px rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      transition: transform 150ms ease, color 150ms ease, background 150ms ease;
    }
    .atmo-play-btn:hover {
      transform: translateY(-1px);
    }
    .atmo-play-btn[aria-pressed="true"] {
      color: #9a3156;
      background: linear-gradient(145deg, rgba(255, 241, 247, 0.96), rgba(255, 223, 235, 0.88));
      box-shadow:
        0 10px 28px rgba(240, 103, 144, 0.18),
        inset 0 0 0 1px rgba(255, 127, 167, 0.48);
    }
    .atmo-trigger:focus-visible,
    .atmo-play-btn:focus-visible,
    .atmo-option:focus-visible,
    .atmo-close:focus-visible {
      outline: 2px solid #ff7fa7;
      outline-offset: 2px;
    }
    .atmo-trigger-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .atmo-chevron {
      font-size: 10px;
      opacity: 0.54;
      transition: transform 180ms ease;
    }
    #sakura-atmosphere.is-open .atmo-chevron {
      transform: rotate(180deg);
    }
    .atmo-panel {
      position: absolute;
      right: 0;
      bottom: 48px;
      width: 258px;
      padding: 13px;
      border-radius: 18px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px) scale(0.98);
      transform-origin: right bottom;
      transition:
        opacity 170ms ease,
        visibility 170ms ease,
        transform 170ms ease;
      pointer-events: none;
    }
    #sakura-atmosphere.is-open .atmo-panel {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .atmo-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 12px;
    }
    .atmo-panel-head strong {
      font-size: 12px;
      letter-spacing: 0.06em;
    }
    .atmo-close {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #52677b;
      background: rgba(74, 101, 125, 0.08);
      cursor: pointer;
    }
    .atmo-section + .atmo-section {
      margin-top: 11px;
    }
    .atmo-label {
      display: block;
      margin: 0 2px 6px;
      color: #74879a;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .atmo-options {
      display: grid;
      gap: 6px;
    }
    .atmo-time-options {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .atmo-weather-options {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .atmo-option {
      min-width: 0;
      height: 42px;
      padding: 5px 4px;
      border: 1px solid rgba(93, 119, 143, 0.11);
      border-radius: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #4b6276;
      background: rgba(255, 255, 255, 0.55);
      font: 600 10px/1.1 "Yu Gothic UI", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        color 150ms ease,
        background 150ms ease,
        border-color 150ms ease,
        transform 150ms ease;
    }
    .atmo-option:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.82);
    }
    .atmo-option[aria-pressed="true"] {
      color: #9a3156;
      border-color: rgba(255, 127, 167, 0.52);
      background: linear-gradient(145deg, rgba(255, 241, 247, 0.98), rgba(255, 219, 231, 0.9));
      box-shadow: 0 4px 12px rgba(240, 103, 144, 0.14);
    }
    .atmo-option-icon {
      font-size: 16px;
      line-height: 1;
    }
    .atmo-hint {
      margin: 11px 2px 0;
      color: #8193a4;
      font-size: 9px;
      line-height: 1.45;
    }
    @media (max-width: 560px), (max-height: 620px) {
      #sakura-atmosphere {
        right: 10px;
        bottom: 10px;
      }
      .atmo-trigger {
        min-width: 136px;
        height: 35px;
      }
      .atmo-play-btn {
        height: 35px;
        padding: 0 11px;
      }
      .atmo-panel {
        width: min(258px, calc(100vw - 20px));
        bottom: 44px;
      }
    }
  </style>
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>
  <script src="./vendor/BufferGeometryUtils.js"></script>
</head>
<body>
<aside id="sakura-atmosphere" aria-label="天气与时段控制">
  <div class="atmo-panel" id="atmo-panel">
    <div class="atmo-panel-head">
      <strong>场景氛围</strong>
      <button class="atmo-close" id="atmo-close" type="button" aria-label="收起氛围控制">×</button>
    </div>
    <section class="atmo-section" aria-labelledby="atmo-time-label">
      <span class="atmo-label" id="atmo-time-label">时段</span>
      <div class="atmo-options atmo-time-options" role="group" aria-labelledby="atmo-time-label">
        <button class="atmo-option" type="button" data-time="day" aria-pressed="true">
          <span class="atmo-option-icon" aria-hidden="true">☀️</span><span>白昼</span>
        </button>
        <button class="atmo-option" type="button" data-time="sunset" aria-pressed="false">
          <span class="atmo-option-icon" aria-hidden="true">🌇</span><span>夕阳</span>
        </button>
        <button class="atmo-option" type="button" data-time="blueHour" aria-pressed="false">
          <span class="atmo-option-icon" aria-hidden="true">🌆</span><span>蓝调时刻</span>
        </button>
        <button class="atmo-option" type="button" data-time="dusk" aria-pressed="false">
          <span class="atmo-option-icon" aria-hidden="true">🌙</span><span>傍晚</span>
        </button>
      </div>
    </section>
    <section class="atmo-section" aria-labelledby="atmo-weather-label">
      <span class="atmo-label" id="atmo-weather-label">天气</span>
      <div class="atmo-options atmo-weather-options" role="group" aria-labelledby="atmo-weather-label">
        <button class="atmo-option" type="button" data-weather="clear" aria-pressed="true">
          <span class="atmo-option-icon" aria-hidden="true">☀️</span><span>晴天</span>
        </button>
        <button class="atmo-option" type="button" data-weather="rain" aria-pressed="false">
          <span class="atmo-option-icon" aria-hidden="true">🌧️</span><span>下雨</span>
        </button>
        <button class="atmo-option" type="button" data-weather="snow" aria-pressed="false">
          <span class="atmo-option-icon" aria-hidden="true">❄️</span><span>下雪</span>
        </button>
      </div>
    </section>
    <p class="atmo-hint">开启自动播放后，日月沿天穹轨迹移动、月相阴晴圆缺自行演变，时段与随机天气每 2 分钟自动流转切换。</p>
  </div>
  <div class="atmo-bar">
    <button class="atmo-play-btn" id="atmo-play-toggle" type="button" aria-pressed="true" title="切换时间、日月轨迹与随机天气自动流逝">
      <span id="atmo-play-icon" aria-hidden="true">⏸</span>
      <span id="atmo-play-label">自动流逝</span>
    </button>
    <button class="atmo-trigger" id="atmo-trigger" type="button" aria-expanded="false" aria-controls="atmo-panel">
      <span class="atmo-trigger-main">
        <span id="atmo-summary-icon" aria-hidden="true">☀️</span>
        <span id="atmo-summary">晴天 · 白昼</span>
      </span>
      <span class="atmo-chevron" aria-hidden="true">▲</span>
    </button>
  </div>
</aside>
<script>
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 320);
  camera.position.set(28, 19.5, 31);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance',
    alpha: false
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.localClippingEnabled = true;
  renderer.domElement.setAttribute('role', 'application');
  renderer.domElement.setAttribute('aria-label', '可交互的日式樱花车站三维微缩景观，可拖动旋转并使用滚轮缩放');
  renderer.domElement.tabIndex = 0;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 3.8, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.maxPolarAngle = Math.PI / 2 - 0.015;
  controls.minPolarAngle = 0.08;
  controls.minDistance = 8;
  controls.maxDistance = 85;
  controls.update();

  // Shared reset hook used by both the Electron tray menu and title bar.
  window.addEventListener('sakura:diorama-reset', () => {
    camera.position.set(28, 19.5, 31);
    controls.target.set(0, 3.8, 0);
    controls.update();
  });

  const BASE_SIZE = 38;
  const HALF_BASE = BASE_SIZE / 2;
  const CYCLE_DURATION = 30.0;
  const PLATFORM_NORTH_EDGE = -11.7;
  const PLATFORM_SOUTH_EDGE = -7.65;
  const PLATFORM_TOP_Y = 1.38;
  const ACTOR_DEFAULT_SCALE = 0.88;
  const dummy = new THREE.Object3D();

  // Clipping planes at the East/West diorama boundaries for the train
  const trainClipPlanes = [
    new THREE.Plane(new THREE.Vector3(1, 0, 0), HALF_BASE - 0.05),
    new THREE.Plane(new THREE.Vector3(-1, 0, 0), HALF_BASE - 0.05)
  ];

  // 4-tone cel-shading gradient texture
  const gradData = new Uint8Array([
    105, 105, 118, 255,
    168, 168, 178, 255,
    224, 224, 230, 255,
    255, 255, 255, 255
  ]);
  const toonGradient = new THREE.DataTexture(gradData, 4, 1, THREE.RGBAFormat);
  toonGradient.minFilter = THREE.NearestFilter;
  toonGradient.magFilter = THREE.NearestFilter;
  toonGradient.needsUpdate = true;

  // Clean anime sky dome (removed blurry procedural cloud waves; keeps crisp gradient & horizon glow)
  const skyGeo = new THREE.SphereGeometry(165, 36, 28);
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      uHorizon: { value: new THREE.Color(0xf2f7ff) },
      uMidSky: { value: new THREE.Color(0xa9d9fa) },
      uZenith: { value: new THREE.Color(0x52a3ee) },
      uOvercast: { value: 0.0 },
      uOvercastColor: { value: new THREE.Color(0xcbd8e2) },
      uTime: { value: 0.0 }
    },
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    vertexShader: `
      varying vec3 vLocalDir;
      void main() {
        vLocalDir = normalize(position);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 uHorizon;
      uniform vec3 uMidSky;
      uniform vec3 uZenith;
      uniform vec3 uOvercastColor;
      uniform float uOvercast;
      varying vec3 vLocalDir;
      void main() {
        float h = clamp((vLocalDir.y + 0.08) / 0.92, 0.0, 1.0);
        vec3 col = mix(uHorizon, uMidSky, smoothstep(0.0, 0.42, h));
        col = mix(col, uZenith, smoothstep(0.42, 1.0, h));
        // Subtle clean atmospheric horizon belt without blurry cloud noise
        float horizonGlow = pow(1.0 - clamp(abs(vLocalDir.y), 0.0, 1.0), 4.0) * 0.14;
        col += uHorizon * horizonGlow * (1.0 - uOvercast * 0.7);
        col = mix(col, uOvercastColor, uOvercast * 0.68);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const skyDomeMesh = new THREE.Mesh(skyGeo, skyMat);
  skyDomeMesh.frustumCulled = false;
  scene.add(skyDomeMesh);

  const sceneFog = new THREE.Fog(0xe7f2fb, 120, 260);
  scene.fog = sceneFog;

  // Warm afternoon anime daylight setup
  const hemiLight = new THREE.HemisphereLight(0xfffdf8, 0xc7def5, 0.86);
  hemiLight.position.set(0, 45, 0);
  scene.add(hemiLight);

  const sunLight = new THREE.DirectionalLight(0xfff7e8, 1.18);
  sunLight.position.set(22, 34, -24);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 5;
  sunLight.shadow.camera.far = 95;
  const dCam = 25;
  sunLight.shadow.camera.left = -dCam;
  sunLight.shadow.camera.right = dCam;
  sunLight.shadow.camera.top = dCam;
  sunLight.shadow.camera.bottom = -dCam;
  sunLight.shadow.bias = -0.0005;
  scene.add(sunLight);

  const fillLight = new THREE.DirectionalLight(0xdbeeff, 0.34);
  fillLight.position.set(-20, 18, 22);
  scene.add(fillLight);

  const globalUniforms = {
    uTime: { value: 0.0 },
    uTrainOpacity: { value: 1.0 },
    uSnowCover: { value: 0.0 }
  };

  // Removed blurry cloud shadow projection on ground/objects; preserves crisp anime saturation & train clipping
  function applyCloudShadowShader(material, shadowStrength = 0.0, saturationBoost = 1.28, isTrainMat = false) {
    material.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = globalUniforms.uTime;
      shader.uniforms.uTrainOpacity = globalUniforms.uTrainOpacity;
      shader.uniforms.uSatBoost = { value: saturationBoost };
      shader.uniforms.uIsTrain = { value: isTrainMat ? 1.0 : 0.0 };
      shader.vertexShader = `
        varying vec3 vWorldPosCloud;
      ` + shader.vertexShader.replace(
        '#include <worldpos_vertex>',
        `#include <worldpos_vertex>
         vWorldPosCloud = (modelMatrix * vec4(transformed, 1.0)).xyz;`
      );
      shader.fragmentShader = `
        uniform float uTime;
        uniform float uTrainOpacity;
        uniform float uSatBoost;
        uniform float uIsTrain;
        varying vec3 vWorldPosCloud;
      ` + shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        `
        float luma = dot(gl_FragColor.rgb, vec3(0.299, 0.587, 0.114));
        gl_FragColor.rgb = clamp(mix(vec3(luma), gl_FragColor.rgb, uSatBoost), 0.0, 1.0);
        if (uIsTrain > 0.5) {
          float edgeFade = smoothstep(18.9, 13.8, abs(vWorldPosCloud.x));
          gl_FragColor.a *= (uTrainOpacity * edgeFade);
          if (gl_FragColor.a < 0.01) discard;
        }
        #include <dithering_fragment>
        `
      );
    };
    return material;
  }

  const toonMaterialCache = new Map();

  function makeToonMat(color, opts = {}) {
    const colorKey = typeof color === 'number' ? color : color.getHex();
    const cacheable = !opts.map &&
      !opts.transparent &&
      !opts.clippingPlanes &&
      opts.emissive === undefined &&
      opts.opacity === undefined &&
      (!opts.side || opts.side === THREE.FrontSide);
    const cacheKey = cacheable
      ? [colorKey, opts.boostHSL !== false ? 1 : 0, opts.cloudShadow !== false ? 1 : 0, opts.saturationBoost || 1.26].join('|')
      : null;
    if (cacheKey && toonMaterialCache.has(cacheKey)) return toonMaterialCache.get(cacheKey);

    const baseCol = new THREE.Color(color);
    if (opts.boostHSL !== false) {
      const hsl = {};
      baseCol.getHSL(hsl);
      baseCol.setHSL(hsl.h, Math.min(1.0, hsl.s * 1.22), hsl.l);
    }
    const isTrainMat = Boolean(opts.clippingPlanes);
    const mat = new THREE.MeshToonMaterial({
      color: baseCol,
      gradientMap: toonGradient,
      transparent: opts.transparent || isTrainMat || false,
      opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
      side: opts.side || THREE.FrontSide,
      map: opts.map || null,
      emissive: opts.emissive !== undefined ? new THREE.Color(opts.emissive) : new THREE.Color(0x000000),
      emissiveIntensity: opts.emissiveIntensity || 0.0,
      clippingPlanes: opts.clippingPlanes || null
    });
    if (opts.cloudShadow !== false || isTrainMat) {
      applyCloudShadowShader(mat, 0.0, opts.saturationBoost || 1.26, isTrainMat);
    }
    if (cacheKey) toonMaterialCache.set(cacheKey, mat);
    return mat;
  }

  const inkEdgeMat = new THREE.LineBasicMaterial({
    color: 0x3a322d,
    transparent: true,
    opacity: 0.34
  });

  const trainInkEdgeMat = new THREE.ShaderMaterial({
    uniforms: {
      uTrainOpacity: globalUniforms.uTrainOpacity
    },
    clippingPlanes: trainClipPlanes,
    clipping: true,
    transparent: true,
    vertexShader: `
      #include <clipping_planes_pars_vertex>
      varying vec3 vWorldPos;
      void main() {
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * mvPosition;
        #include <clipping_planes_vertex>
      }
    `,
    fragmentShader: `
      #include <clipping_planes_pars_fragment>
      uniform float uTrainOpacity;
      varying vec3 vWorldPos;
      void main() {
        #include <clipping_planes_fragment>
        float edgeFade = smoothstep(18.9, 13.8, abs(vWorldPos.x));
        float alpha = 0.42 * uTrainOpacity * edgeFade;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(0.15, 0.21, 0.27, alpha);
      }
    `
  });

  function addAnimeMesh(parent, geometry, material, opts = {}) {
    const mesh = new THREE.Mesh(geometry, material);
    if (opts.position) mesh.position.copy(opts.position);
    if (opts.rotation) mesh.rotation.copy(opts.rotation);
    if (opts.scale) mesh.scale.copy(opts.scale);
    mesh.castShadow = opts.castShadow !== undefined ? opts.castShadow : true;
    mesh.receiveShadow = opts.receiveShadow !== undefined ? opts.receiveShadow : true;

    if (opts.outline !== false) {
      const threshold = opts.edgeThreshold || 28;
      const edges = new THREE.EdgesGeometry(geometry, threshold);
      const line = new THREE.LineSegments(edges, opts.useTrainClip ? trainInkEdgeMat : inkEdgeMat);
      mesh.add(line);
    }
    parent.add(mesh);
    return mesh;
  }

  function batchStaticDioramaMeshes(root, excludedRoots = []) {
    const utils = THREE.BufferGeometryUtils;
    if (!utils || typeof utils.mergeBufferGeometries !== 'function') return null;

    root.updateMatrixWorld(true);
    const rootInverse = new THREE.Matrix4().copy(root.matrixWorld).invert();
    const excluded = new Set(excludedRoots);
    const meshBuckets = new Map();
    const lineBuckets = new Map();
    const batchedMeshes = [];
    const batchedLines = [];

    function attributeSignature(geometry) {
      return Object.keys(geometry.attributes).sort()
        .map((name) => name + ':' + geometry.attributes[name].itemSize)
        .join(',');
    }

    function collect(node) {
      if (excluded.has(node)) return;

      if (node.isMesh && !node.isInstancedMesh && !node.isSkinnedMesh && !Array.isArray(node.material)) {
        const material = node.material;
        const canBatch = material &&
          !material.isShaderMaterial &&
          !material.transparent &&
          !(material.clippingPlanes && material.clippingPlanes.length) &&
          !node.customDepthMaterial &&
          Object.keys(node.geometry.morphAttributes || {}).length === 0;

        if (canBatch) {
          const relativeMatrix = new THREE.Matrix4().multiplyMatrices(rootInverse, node.matrixWorld);
          const geometry = node.geometry.clone().applyMatrix4(relativeMatrix);
          const key = [
            material.uuid,
            node.renderOrder,
            node.castShadow ? 1 : 0,
            node.receiveShadow ? 1 : 0,
            geometry.index ? 'indexed' : 'non-indexed',
            attributeSignature(geometry)
          ].join('|');
          if (!meshBuckets.has(key)) {
            meshBuckets.set(key, { material, renderOrder: node.renderOrder, castShadow: node.castShadow, receiveShadow: node.receiveShadow, geometries: [], nodes: [] });
          }
          const bucket = meshBuckets.get(key);
          bucket.geometries.push(geometry);
          bucket.nodes.push(node);
        }
      }

      if (node.isLineSegments && node.material && !Array.isArray(node.material)) {
        const material = node.material;
        if (!material.isShaderMaterial && !(material.clippingPlanes && material.clippingPlanes.length)) {
          const relativeMatrix = new THREE.Matrix4().multiplyMatrices(rootInverse, node.matrixWorld);
          const geometry = node.geometry.clone().applyMatrix4(relativeMatrix);
          const key = [material.uuid, node.renderOrder, geometry.index ? 'indexed' : 'non-indexed', attributeSignature(geometry)].join('|');
          if (!lineBuckets.has(key)) {
            lineBuckets.set(key, { material, renderOrder: node.renderOrder, geometries: [], nodes: [] });
          }
          const bucket = lineBuckets.get(key);
          bucket.geometries.push(geometry);
          bucket.nodes.push(node);
        }
      }

      for (let i = 0; i < node.children.length; i++) collect(node.children[i]);
    }

    collect(root);

    const stats = { mergedMeshes: 0, mergedLines: 0, meshDrawsSaved: 0, lineDrawsSaved: 0 };

    meshBuckets.forEach((bucket) => {
      const mergedGeometry = utils.mergeBufferGeometries(bucket.geometries, false);
      if (!mergedGeometry) {
        bucket.geometries.forEach((geometry) => geometry.dispose());
        return;
      }
      mergedGeometry.computeBoundingSphere();
      mergedGeometry.computeBoundingBox();
      const mergedMesh = new THREE.Mesh(mergedGeometry, bucket.material);
      mergedMesh.name = 'STATIC_MESH_BATCH';
      mergedMesh.renderOrder = bucket.renderOrder;
      mergedMesh.castShadow = bucket.castShadow;
      mergedMesh.receiveShadow = bucket.receiveShadow;
      root.add(mergedMesh);
      stats.mergedMeshes++;
      stats.meshDrawsSaved += Math.max(0, bucket.nodes.length - 1);
      bucket.nodes.forEach((node) => batchedMeshes.push(node));
      bucket.geometries.forEach((geometry) => geometry.dispose());
    });

    lineBuckets.forEach((bucket) => {
      const mergedGeometry = utils.mergeBufferGeometries(bucket.geometries, false);
      if (!mergedGeometry) {
        bucket.geometries.forEach((geometry) => geometry.dispose());
        return;
      }
      mergedGeometry.computeBoundingSphere();
      const mergedLine = new THREE.LineSegments(mergedGeometry, bucket.material);
      mergedLine.name = 'STATIC_LINE_BATCH';
      mergedLine.renderOrder = bucket.renderOrder;
      root.add(mergedLine);
      stats.mergedLines++;
      stats.lineDrawsSaved += Math.max(0, bucket.nodes.length - 1);
      bucket.nodes.forEach((node) => batchedLines.push(node));
      bucket.geometries.forEach((geometry) => geometry.dispose());
    });

    batchedMeshes.forEach((mesh) => {
      if (mesh.parent) mesh.parent.remove(mesh);
    });
    batchedLines.forEach((line) => {
      if (line.parent) line.parent.remove(line);
    });

    stats.originalMeshes = batchedMeshes.length;
    stats.originalLines = batchedLines.length;
    window.__sakuraBatchStats = stats;
    return stats;
  }

  function createRootedGrassTuftGeometry() {
    const geo = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];
    const cRoot = new THREE.Color(0x2e5c1e);
    const cMid = new THREE.Color(0x5ec447);
    const cTip = new THREE.Color(0x9be868);

    const bladeCount = 7;
    for (let b = 0; b < bladeCount; b++) {
      const ang = (b / bladeCount) * Math.PI * 2 + (b % 2) * 0.25;
      const lean = 0.09 + (b % 3) * 0.045;
      const h = 0.24 + (b % 3) * 0.08;
      const w = 0.028;
      const dx = Math.cos(ang);
      const dz = Math.sin(ang);
      const px = -dz * w;
      const pz = dx * w;

      const xMid = dx * lean * 0.45;
      const zMid = dz * lean * 0.45;
      const xTip = dx * lean;
      const zTip = dz * lean;

      positions.push(
        -px, 0, -pz,
        px, 0, pz,
        xMid + px * 0.6, h * 0.55, zMid + pz * 0.6,
        -px, 0, -pz,
        xMid + px * 0.6, h * 0.55, zMid + pz * 0.6,
        xMid - px * 0.6, h * 0.55, zMid - pz * 0.6
      );
      colors.push(
        cRoot.r, cRoot.g, cRoot.b,
        cRoot.r, cRoot.g, cRoot.b,
        cMid.r, cMid.g, cMid.b,
        cRoot.r, cRoot.g, cRoot.b,
        cMid.r, cMid.g, cMid.b,
        cMid.r, cMid.g, cMid.b
      );

      positions.push(
        xMid - px * 0.6, h * 0.55, zMid - pz * 0.6,
        xMid + px * 0.6, h * 0.55, zMid + pz * 0.6,
        xTip, h, zTip
      );
      colors.push(
        cMid.r, cMid.g, cMid.b,
        cMid.r, cMid.g, cMid.b,
        cTip.r, cTip.g, cTip.b
      );
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    return geo;
  }

  // Foliage shader also responds to uSnowCover so grass tips, pink muhly & flowers gather frost/snow when it snows

    },
    side: THREE.DoubleSide,
    vertexShader: `
      attribute vec3 color;
      uniform float uTime;
      varying vec3 vColor;
      varying float vLocalY;
      void main() {
        vColor = color;
        vLocalY = position.y;
        vec3 pos = position;
        vec4 wp = modelMatrix * instanceMatrix * vec4(pos, 1.0);
        float sway = sin(uTime * 2.4 + wp.x * 0.7 + wp.z * 0.5) * 0.065 * clamp(pos.y * 3.0, 0.0, 1.0);
        pos.x += sway;
        pos.z += sway * 0.5;
        gl_Position = projectionMatrix * viewMatrix * modelMatrix * instanceMatrix * vec4(pos, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uSnowCover;
      varying vec3 vColor;
      varying float vLocalY;
      void main() {
        float tipFrost = smoothstep(0.08, 0.25, vLocalY) * uSnowCover * 0.85;
        vec3 col = mix(vColor, vec3(0.96, 0.99, 1.0), tipFrost);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

      const spread = 0.08 + (s % 4) * 0.055;
      const h = 0.38 + (s % 3) * 0.11;
      const dx = Math.cos(ang);
      const dz = Math.sin(ang);
      const px = -dz * 0.014;
      const pz = dx * 0.014;

      const xMid = dx * spread * 0.45;
      const zMid = dz * spread * 0.45;
      positions.push(
        -px, 0, -pz,
        px, 0, pz,
        xMid, h * 0.48, zMid

      colors.push(
        cStem.r, cStem.g, cStem.b,
        cStem.r, cStem.g, cStem.b,
        cPlumeBase.r, cPlumeBase.g, cPlumeBase.b
      );

      for (let f = -1; f <= 1; f++) {
        const fAng = ang + f * 0.26;
        const fx = Math.cos(fAng) * (spread + 0.08);
        const fz = Math.sin(fAng) * (spread + 0.08);
        const pw = 0.032;
        positions.push(
          xMid - pw, h * 0.44, zMid - pw,
          xMid + pw, h * 0.44, zMid + pw,

          cPlumeBase.r, cPlumeBase.g, cPlumeBase.b,
          cPlumeTip.r, cPlumeTip.g, cPlumeTip.b
        );
      }

    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    depthWrite: false,
    vertexShader: `
      varying vec3 vWorldPos;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;

    fragmentShader: `
      uniform float uTime;
      uniform float uTrainX;
      uniform float uTrainVibration;
      uniform vec2 uRippleCenter;
      uniform float uRippleAge;
      uniform float uRainWetness;
      uniform float uMoonReflection;
      uniform float uSnowCover;
      varying vec3 vWorldPos;
      varying vec2 vUv;
      void main() {
        float rainGate = smoothstep(0.36, 0.88, uRainWetness);
        if (rainGate < 0.01) discard;

        vec2 centered = vUv * 2.0 - 1.0;
        float angle = atan(centered.y, centered.x);
        float organicEdge = 1.0 + 0.10 * sin(angle * 3.0 + vWorldPos.x) + 0.07 * cos(angle * 5.0 - vWorldPos.z);
        float distEdge = length(centered) / organicEdge;
        float maxRadius = mix(0.38, 1.0, rainGate);
        float alpha = smoothstep(maxRadius, maxRadius * 0.58, distEdge) * 0.78 * rainGate * (1.0 - uSnowCover * 0.85);
        if (alpha < 0.015) discard;

        float breezeWave = sin(vWorldPos.x * 16.0 + uTime * 3.2) * cos(vWorldPos.z * 16.0 - uTime * 2.6) * 0.025;
        float tremorWave = sin(distEdge * 44.0 - uTime * 22.0) * uTrainVibration * 0.06;

        // Multi-center raindrop concentric ripples on puddle surface
        vec2 rainCell = fract(vWorldPos.xz * 1.35) - 0.5;
        float dropCycle = fract(uTime * 1.45 + floor(vWorldPos.x * 1.35) * 0.37 + floor(vWorldPos.z * 1.35) * 0.61);
        float rainRing = sin((length(rainCell) - dropCycle * 0.48) * 52.0)
                       * exp(-length(rainCell) * 7.5) * (1.0 - dropCycle) * 0.16;

        float dRipple = length(vWorldPos.xz - uRippleCenter);
        float petalRing = sin((dRipple - uRippleAge * 0.85) * 28.0) * exp(-dRipple * 3.5) * exp(-uRippleAge * 1.4);

          vec3(0.16, 0.28, 0.52),
          uMoonReflection
        );

                           + pow(max(0.0, cos((vWorldPos.x - 7.8) * 0.55)), 8.0)
                           + pow(max(0.0, cos((vWorldPos.x + 0.8) * 0.45)), 6.0) * 0.7;
        float waveShimmer = 0.55 + 0.45 * sin(vWorldPos.z * 9.0 + uTime * 4.2 + breezeWave * 24.0);
        vec3 warmGlow = vec3(1.0, 0.78, 0.42) * warmLampBand * waveShimmer * (0.28 + uMoonReflection * 0.65);
        vec3 signalGlow = mix(vec3(0.18, 0.95, 0.65), vec3(1.0, 0.32, 0.42), sin(uTime * 0.8) * 0.5 + 0.5)

        col += vec3(edgeSpec + (petalRing + rainRing) * 0.28 + tremorWave * 0.35);

    addSnowAccent(
      pGroup,
      new THREE.CylinderGeometry(0.045, 0.065, 7.6, 8),
      new THREE.Vector3(-0.125, 4.1, 0.04)
    );

    // Climbing bolts with snow tufts
    for (let h = 1.6; h < 7.2; h += 0.45) {
      addAnimeMesh(pGroup, new THREE.BoxGeometry(0.28, 0.03, 0.03), crossarmMat, {
        position: new THREE.Vector3(0, h, 0),
        outline: false
      });
      addSnowAccent(
        pGroup,
        new THREE.BoxGeometry(0.30, 0.028, 0.05),

    // Upper power line crossarms & white ceramic insulators with thick snow caps
    [6.8, 7.6].forEach((cy) => {
      addAnimeMesh(pGroup, new THREE.BoxGeometry(0.12, 0.12, 1.85), crossarmMat, {
        position: new THREE.Vector3(0, cy, 0)

      addSnowAccent(
        pGroup,
        new THREE.BoxGeometry(0.18, 0.075, 1.94),

      [-0.75, 0, 0.75].forEach((iz) => {
        addAnimeMesh(pGroup, new THREE.CylinderGeometry(0.05, 0.05, 0.18, 8), insulatorMat, {
          position: new THREE.Vector3(0, cy + 0.14, iz),

        addSnowAccent(
          pGroup,
          new THREE.SphereGeometry(0.068, 8, 8),
          new THREE.Vector3(0, cy + 0.245, iz),
          null,
          new THREE.Vector3(1.1, 0.65, 1.1)

      });
    });

    // Cylindrical pole-mounted transformer + snow cap on alternating poles
    if (idx % 2 === 1) {
      addAnimeMesh(pGroup, new THREE.CylinderGeometry(0.24, 0.24, 0.78, 12), makeToonMat(0x607d8b), {
        position: new THREE.Vector3(0.28, 5.5, 0.22)
      });
      addSnowAccent(
        pGroup,
        new THREE.CylinderGeometry(0.26, 0.26, 0.085, 12),
        new THREE.Vector3(0.28, 5.92, 0.22)
      );
    }

    // Catenary cantilever arm extending over the railway track + snow strips along both cantilever tubes
    addAnimeMesh(pGroup, new THREE.CylinderGeometry(0.04, 0.04, 2.65, 8), crossarmMat, {
      position: new THREE.Vector3(0, 5.15, 1.25),
      rotation: new THREE.Euler(Math.PI / 2, 0, 0),
      outline: false
    });
    addSnowAccent(
      pGroup,
      new THREE.BoxGeometry(0.085, 0.055, 2.62),
      new THREE.Vector3(0, 5.195, 1.25)
    );
    addAnimeMesh(pGroup, new THREE.CylinderGeometry(0.03, 0.03, 2.75, 8), crossarmMat, {
      position: new THREE.Vector3(0, 5.55, 1.20),
      rotation: new THREE.Euler(Math.PI / 2 + 0.28, 0, 0),
      outline: false
    });
    addSnowAccent(
      pGroup,
      new THREE.BoxGeometry(0.075, 0.048, 2.72),
      new THREE.Vector3(0, 5.59, 1.20),
      new THREE.Euler(0.28, 0, 0)
    );
  });

  // Dynamic Catenary Contact Wire, Messenger Wire & Power Lines
  const dynamicWires = [];
  function createSpanWire(x1, x2, yBase, zBase, sag, isCatenary = false) {
    const segs = 24;
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const u = i / segs;
      const x = THREE.MathUtils.lerp(x1, x2, u);
      const y = yBase - Math.sin(u * Math.PI) * sag;
      pts.push(new THREE.Vector3(x, y, zBase));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(geo, wireLineMat);
    dioramaGroup.add(line);
    dynamicWires.push({ geo, x1, x2, yBase, zBase, sag, isCatenary, segs });
  }

  for (let i = 0; i < poleXCoords.length - 1; i++) {
    const xA = poleXCoords[i];
    const xB = poleXCoords[i + 1];
    createSpanWire(xA, xB, 5.02, trackCenterZ, 0.03, true);
    createSpanWire(xA, xB, 5.65, trackCenterZ, 0.26, true);
    [-0.75, 0.75].forEach((oz) => {
      createSpanWire(xA, xB, 6.95, -15.85 + oz, 0.22, false);
      createSpanWire(xA, xB, 7.75, -15.85 + oz, 0.22, false);
    });
    for (let d = 1; d <= 4; d++) {
      const u = d / 5;
      const dx = THREE.MathUtils.lerp(xA, xB, u);
      const topY = 5.65 - Math.sin(u * Math.PI) * 0.26;
      const dropGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(dx, 5.02, trackCenterZ),
        new THREE.Vector3(dx, topY, trackCenterZ)
      ]);
      dioramaGroup.add(new THREE.Line(dropGeo, wireLineMat));
    }
  }

  const sakuraBarkTex = createCanvasTexture(512, 512, (ctx, w, h) => {
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#4a2e23');
    grad.addColorStop(0.5, '#634032');
    grad.addColorStop(1, '#42281e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    for (let x = 0; x < w; x += 12) {
      ctx.fillStyle = x % 24 === 0 ? 'rgba(30, 16, 10, 0.38)' : 'rgba(130, 90, 72, 0.22)';
      ctx.fillRect(x, 0, 5 + (x % 4), h);
    }
    for (let i = 0; i < 140; i++) {
      const rx = (i * 37) % w;
      const ry = (i * 29) % h;
      const rw = 22 + (i % 5) * 12;
      ctx.fillStyle = i % 2 === 0 ? '#875946' : '#331c14';
      ctx.fillRect(rx, ry, rw, 3.5);
      ctx.fillStyle = '#a1705b';
      ctx.fillRect(rx + 4, ry + 1, rw * 0.5, 1.5);
    }
    for (let m = 0; m < 28; m++) {
      ctx.fillStyle = 'rgba(92, 148, 68, 0.28)';
      ctx.beginPath();
      ctx.arc((m * 43) % w, h - 20 - (m % 4) * 18, 14 + (m % 3) * 6, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  sakuraBarkTex.wrapS = THREE.RepeatWrapping;
  sakuraBarkTex.wrapT = THREE.RepeatWrapping;
  const realisticBarkMat = makeToonMat(0xffffff, { map: sakuraBarkTex });
  const twigMat = makeToonMat(0x4d2c20);

  function createSakuraPetalGeometry() {
    const shape = new THREE.Shape();
    shape.moveTo(0, -0.105);
    shape.bezierCurveTo(0.048, -0.055, 0.118, 0.012, 0.105, 0.072);
    shape.bezierCurveTo(0.095, 0.118, 0.038, 0.125, 0, 0.072);
    shape.bezierCurveTo(-0.038, 0.125, -0.095, 0.118, -0.105, 0.072);
    shape.bezierCurveTo(-0.118, 0.012, -0.048, -0.055, 0, -0.105);
    const geo = new THREE.ShapeGeometry(shape, 12);
    geo.center();
    return geo;
  }

  function createFivePetalBlossomGeometry() {
    const groupGeo = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];
    const cCenter = new THREE.Color(0xd81b60);
    const cMid = new THREE.Color(0xff7aa8);
    const cTip = new THREE.Color(0xffd4e4);

    for (let p = 0; p < 5; p++) {
      const a = (p / 5) * Math.PI * 2;
      const aL = a - 0.34;
      const aR = a + 0.34;
      const rInner = 0.025;
      const rMid = 0.115;
      const rTip = 0.175;
      const rNotch = 0.140;
      const ix = Math.cos(a) * rInner;
      const iz = Math.sin(a) * rInner;

      positions.push(
        ix, 0.005, iz,
        Math.cos(aL) * rMid, 0.028, Math.sin(aL) * rMid,
        Math.cos(a - 0.11) * rTip, 0.042, Math.sin(a - 0.11) * rTip,
        ix, 0.005, iz,
        Math.cos(a - 0.11) * rTip, 0.042, Math.sin(a - 0.11) * rTip,
        Math.cos(a) * rNotch, 0.035, Math.sin(a) * rNotch
      );
      positions.push(
        ix, 0.005, iz,
        Math.cos(a) * rNotch, 0.035, Math.sin(a) * rNotch,
        Math.cos(a + 0.11) * rTip, 0.042, Math.sin(a + 0.11) * rTip,
        ix, 0.005, iz,
        Math.cos(a + 0.11) * rTip, 0.042, Math.sin(a + 0.11) * rTip,
        Math.cos(aR) * rMid, 0.028, Math.sin(aR) * rMid
      );

      for (let t = 0; t < 4; t++) {
        colors.push(cCenter.r, cCenter.g, cCenter.b);
        colors.push(cMid.r, cMid.g, cMid.b);
        colors.push(cTip.r, cTip.g, cTip.b);
      }
    }
    groupGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    groupGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    groupGeo.computeVertexNormals();
    return groupGeo;
  }
  const blossomClusterGeo = createFivePetalBlossomGeometry();

  // Sakura blossom material blends a distinct, layered snow cap onto the upper-canopy blossoms
  // while keeping the lower and inner blossoms soft sakura pink.
  const blossomClusterMat = new THREE.ShaderMaterial({
    uniforms: {
      uSnowCover: globalUniforms.uSnowCover
    },
    side: THREE.DoubleSide,
    vertexShader: `
      attribute vec3 color;
      varying vec3 vColor;
      varying vec3 vLocalPos;
      varying vec3 vBoughPos;
      void main() {
        vColor = color;
        vLocalPos = position;
        vBoughPos = (instanceMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * viewMatrix * modelMatrix * instanceMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uSnowCover;
      varying vec3 vColor;
      varying vec3 vLocalPos;
      varying vec3 vBoughPos;
      void main() {
        float canopyHeightMask = smoothstep(0.28, 0.96, vBoughPos.y);
        float crownApexMask = smoothstep(0.68, 1.32, vBoughPos.y);
        float petalTopMask = smoothstep(0.004, 0.032, vLocalPos.y);
        float spatialPatch = smoothstep(0.10, 0.76, sin(vBoughPos.x * 4.2 + vBoughPos.z * 3.9) * 0.5 + 0.5);
        float snowMask = clamp(
          canopyHeightMask * (0.68 + petalTopMask * 0.34 + spatialPatch * 0.26) + crownApexMask * 0.35,
          0.0,
          1.0
        );
        float snowStrength = smoothstep(0.02, 0.78, uSnowCover);
        float snowMix = clamp(snowStrength * snowMask * 0.96, 0.0, 0.97);
        vec3 snowTone = mix(vec3(0.88, 0.94, 1.0), vec3(0.99, 0.996, 1.0), petalTopMask);
        vec3 col = mix(vColor, snowTone, snowMix);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  const singleBranchPetalGeo = createSakuraPetalGeometry();
  const singleBranchPetalMat = new THREE.ShaderMaterial({
    uniforms: {
      uSnowCover: globalUniforms.uSnowCover
    },
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vBoughPos;
      varying vec3 vLocalPos;
      void main() {
        vLocalPos = position;
        vBoughPos = (instanceMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * viewMatrix * modelMatrix * instanceMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uSnowCover;
      varying vec3 vBoughPos;
      varying vec3 vLocalPos;
      void main() {
        vec3 basePink = vec3(1.0, 0.65, 0.79);
        float heightMask = smoothstep(0.32, 1.02, vBoughPos.y);
        float patchMask = smoothstep(0.15, 0.80, cos(vBoughPos.x * 4.5 - vBoughPos.z * 4.1) * 0.5 + 0.5);
        float snowStrength = smoothstep(0.02, 0.78, uSnowCover);
        float snowMix = clamp(snowStrength * heightMask * (0.72 + patchMask * 0.28), 0.0, 0.95);
        vec3 snowCol = mix(vec3(0.90, 0.95, 1.0), vec3(0.99, 0.996, 1.0), smoothstep(-0.04, 0.06, vLocalPos.y));
        gl_FragColor = vec4(mix(basePink, snowCol, snowMix), 1.0);
      }
    `
  });

  function createSakuraLeafGeometry() {
    const shape = new THREE.Shape();
    shape.moveTo(0, -0.11);
    shape.quadraticCurveTo(0.055, -0.05, 0.065, 0.0);
    shape.quadraticCurveTo(0.05, 0.06, 0, 0.12);
    shape.quadraticCurveTo(-0.05, 0.06, -0.065, 0.0);
    shape.quadraticCurveTo(-0.055, -0.05, 0, -0.11);
    const geo = new THREE.ShapeGeometry(shape);
    geo.rotateX(Math.PI / 2);
    return geo;
  }
  const sakuraLeafGeo = createSakuraLeafGeometry();
  const sakuraLeafMat = makeToonMat(0x68b836, { side: THREE.DoubleSide });

  function createTaperedBranchGeometry(curve, rStart, rEnd, tubularSegments = 12, radialSegments = 7) {
    const geo = new THREE.TubeGeometry(curve, tubularSegments, 1.0, radialSegments, false);
    const pos = geo.attributes.position;
    const norm = geo.attributes.normal;
    const center = new THREE.Vector3();
    const nVec = new THREE.Vector3();

    for (let i = 0; i <= tubularSegments; i++) {
      const t = i / tubularSegments;
      const radius = THREE.MathUtils.lerp(rStart, rEnd, Math.pow(t, 0.85));
      curve.getPointAt(t, center);
      for (let j = 0; j <= radialSegments; j++) {
        const idx = i * (radialSegments + 1) + j;
        nVec.fromBufferAttribute(norm, idx);
        pos.setXYZ(
          idx,
          center.x + nVec.x * radius,
          center.y + nVec.y * radius,
          center.z + nVec.z * radius
        );
      }
    }
    geo.computeVertexNormals();
    return geo;
  }

  const sakuraSwayBranches = [];
  const sakuraSnowClumpGeo = new THREE.IcosahedronGeometry(0.16, 1);

  function createSakuraTree(x, y, z, scale = 1.0, phaseSeed = 0.0) {
    const tGroup = new THREE.Group();
    tGroup.position.set(x, y, z);
    tGroup.scale.setScalar(scale);
    dioramaGroup.add(tGroup);

    // Snow ring around the tree root collar & exposed roots
    addSnowAccent(
      tGroup,
      new THREE.CylinderGeometry(0.32, 0.56, 0.14, 14),
      new THREE.Vector3(0, 0.08, 0)
    );

    for (let r = 0; r < 5; r++) {
      const rAng = (r / 5) * Math.PI * 2 + 0.3;
      const rootCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(Math.cos(rAng) * 0.10, 0.32, Math.sin(rAng) * 0.10),
        new THREE.Vector3(Math.cos(rAng) * 0.28, 0.12, Math.sin(rAng) * 0.28),
        new THREE.Vector3(Math.cos(rAng) * 0.48, 0.01, Math.sin(rAng) * 0.48)
      ]);
      addAnimeMesh(tGroup, createTaperedBranchGeometry(rootCurve, 0.095, 0.025, 8, 6), realisticBarkMat, {
        outline: false
      });
    }

    const trunkCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0.06, 0.82, -0.04),
      new THREE.Vector3(-0.04, 1.62, 0.05),
      new THREE.Vector3(0.03, 2.25, 0.02)
    ]);
    addAnimeMesh(tGroup, createTaperedBranchGeometry(trunkCurve, 0.23, 0.135, 14, 8), realisticBarkMat);

    // Snow saddle in the main trunk fork crotch (y = 2.22)
    addSnowAccent(
      tGroup,
      new THREE.SphereGeometry(0.24, 12, 10),
      new THREE.Vector3(0.03, 2.24, 0.02),
      null,
      new THREE.Vector3(1.35, 0.65, 1.35)
    );

    const numMainBoughs = 6;
    for (let b = 0; b < numMainBoughs; b++) {
      const boughPivot = new THREE.Group();
      boughPivot.position.set(0.03, 2.20, 0.02);
      tGroup.add(boughPivot);

      sakuraSwayBranches.push({
        group: boughPivot,
        worldX: x,
        worldZ: z,
        phase: phaseSeed + b * 1.15,
        ampScale: 1.0 + (b % 2) * 0.35
      });

      const baseAng = (b / numMainBoughs) * Math.PI * 2 + (b % 2) * 0.18;
      const reach = 2.45 + (b % 3) * 0.32;
      const lift = 1.45 + (b % 2) * 0.38;

      const p1 = new THREE.Vector3(
        Math.cos(baseAng) * reach * 0.38,
        lift * 0.52,
        Math.sin(baseAng) * reach * 0.38
      );
      const p2 = new THREE.Vector3(
        Math.cos(baseAng + 0.08) * reach * 0.76,
        lift * 0.92,
        Math.sin(baseAng + 0.08) * reach * 0.76
      );
      const p3 = new THREE.Vector3(
        Math.cos(baseAng + 0.14) * reach,
        lift * 0.85,
        Math.sin(baseAng + 0.14) * reach
      );

      const mainBoughCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), p1, p2, p3]);
      addAnimeMesh(boughPivot, createTaperedBranchGeometry(mainBoughCurve, 0.11, 0.022, 14, 7), realisticBarkMat, {
        outline: false
      });

      const boughFlowerCurves = [mainBoughCurve];

      const secFractions = [0.28, 0.48, 0.66, 0.82];
      secFractions.forEach((f, sIdx) => {
        const origin = mainBoughCurve.getPointAt(f);
        const sideSign = sIdx % 2 === 0 ? 1 : -1;
        const secAng = baseAng + sideSign * (0.48 + sIdx * 0.12);
        const secLen = (1.35 - f * 0.45);

        const sMid = origin.clone().add(new THREE.Vector3(
          Math.cos(secAng) * secLen * 0.55,
          0.36 + (sIdx % 2) * 0.18,
          Math.sin(secAng) * secLen * 0.55
        ));
        const sEnd = origin.clone().add(new THREE.Vector3(
          Math.cos(secAng + sideSign * 0.15) * secLen,
          0.22 - (sIdx % 2) * 0.12,
          Math.sin(secAng + sideSign * 0.15) * secLen
        ));

        const secCurve = new THREE.CatmullRomCurve3([origin, sMid, sEnd]);
        addAnimeMesh(boughPivot, createTaperedBranchGeometry(secCurve, 0.048, 0.012, 10, 6), twigMat, {
          outline: false
        });
        boughFlowerCurves.push(secCurve);

        [0.45, 0.78].forEach((tf, tIdx) => {
          const tOrigin = secCurve.getPointAt(tf);
          const tSign = tIdx === 0 ? -sideSign : sideSign;
          const tAng = secAng + tSign * 0.52;
          const tLen = 0.68;
          const tMid = tOrigin.clone().add(new THREE.Vector3(
            Math.cos(tAng) * tLen * 0.5,
            0.14,
            Math.sin(tAng) * tLen * 0.5
          ));
          const tEnd = tOrigin.clone().add(new THREE.Vector3(
            Math.cos(tAng) * tLen,
            -0.08,
            Math.sin(tAng) * tLen
          ));
          const twigCurve = new THREE.CatmullRomCurve3([tOrigin, tMid, tEnd]);
          addAnimeMesh(boughPivot, createTaperedBranchGeometry(twigCurve, 0.022, 0.006, 7, 5), twigMat, {
            outline: false
          });
          boughFlowerCurves.push(twigCurve);
        });
      });

      if (b % 2 === 0) {
        const upOrigin = mainBoughCurve.getPointAt(0.32);
        const upMid = upOrigin.clone().add(new THREE.Vector3(Math.cos(baseAng) * 0.45, 0.85, Math.sin(baseAng) * 0.45));
        const upEnd = upOrigin.clone().add(new THREE.Vector3(Math.cos(baseAng + 0.3) * 1.05, 1.38, Math.sin(baseAng + 0.3) * 1.05));
        const upCurve = new THREE.CatmullRomCurve3([upOrigin, upMid, upEnd]);
        addAnimeMesh(boughPivot, createTaperedBranchGeometry(upCurve, 0.052, 0.012, 10, 6), twigMat, {
          outline: false
        });
        boughFlowerCurves.push(upCurve);
      }

      // Layered 3D snow cushions resting along the main bough and upper canopy crown
      const snowClumpCount = 24;
      const boughSnow = new THREE.InstancedMesh(sakuraSnowClumpGeo, snowAccentMaterial, snowClumpCount);
      const snowDummy = new THREE.Object3D();
      const snowPoint = new THREE.Vector3();
      for (let snowIdx = 0; snowIdx < snowClumpCount; snowIdx++) {
        if (snowIdx < 8) {
          const u = 0.14 + (snowIdx / 8) * 0.74;
          mainBoughCurve.getPointAt(u, snowPoint);
          snowDummy.position.set(snowPoint.x, snowPoint.y + 0.055, snowPoint.z);
          snowDummy.rotation.set(snowIdx * 0.25, snowIdx * 0.65, snowIdx * 0.18);
          snowDummy.scale.set(0.82 - u * 0.20, 0.28, 0.82 - u * 0.20);
        } else {
          // Plump snow pillows sitting on top of the upper canopy flower clusters
          const c = boughFlowerCurves[(snowIdx - 8) % boughFlowerCurves.length];
          const u = 0.32 + (((snowIdx - 8) * 0.618034) % 0.62);
          c.getPointAt(u, snowPoint);
          const ang = snowIdx * 2.15;
          snowDummy.position.set(
            snowPoint.x + Math.cos(ang) * 0.06,
            snowPoint.y + 0.105 + (snowIdx % 3) * 0.022,
            snowPoint.z + Math.sin(ang) * 0.06
          );
          snowDummy.rotation.set(0.08 * Math.sin(ang), ang, 0.08 * Math.cos(ang));
          snowDummy.scale.set(1.18 + (snowIdx % 3) * 0.26, 0.38 + (snowIdx % 2) * 0.10, 1.12 + (snowIdx % 2) * 0.24);
        }
        snowDummy.updateMatrix();
        boughSnow.setMatrixAt(snowIdx, snowDummy.matrix);
      }
      boughSnow.instanceMatrix.needsUpdate = true;
      boughPivot.add(registerSnowAccent(boughSnow));

      // Dense snow-frosted petal caps blanketing the top crown blossoms of each bough
      const crownSnowCount = 64;
      const boughCrownSnow = new THREE.InstancedMesh(blossomClusterGeo, snowAccentMaterial, crownSnowCount);
      for (let cIdx = 0; cIdx < crownSnowCount; cIdx++) {
        const c = boughFlowerCurves[cIdx % boughFlowerCurves.length];
        const u = 0.20 + ((cIdx * 0.618034) % 0.76);
        c.getPointAt(u, snowPoint);
        const radialAngle = cIdx * 2.39996;
        const radialOffset = 0.04 + (cIdx % 4) * 0.048;
        snowDummy.position.set(
          snowPoint.x + Math.cos(radialAngle) * radialOffset,
          snowPoint.y + 0.088 + (cIdx % 3) * 0.028,
          snowPoint.z + Math.sin(radialAngle) * radialOffset
        );
        snowDummy.rotation.set(
          Math.sin(radialAngle) * 0.20,
          radialAngle,
          Math.cos(radialAngle) * 0.20
        );
        snowDummy.scale.setScalar(0.88 + (cIdx % 3) * 0.18);
        snowDummy.updateMatrix();
        boughCrownSnow.setMatrixAt(cIdx, snowDummy.matrix);
      }
      boughCrownSnow.instanceMatrix.needsUpdate = true;
      boughPivot.add(registerSnowAccent(boughCrownSnow));

      const blossomsPerBough = 165;
      const singlePetalsPerBough = 240;
      const leavesPerBough = 48;

      const boughBlossoms = new THREE.InstancedMesh(blossomClusterGeo, blossomClusterMat, blossomsPerBough);
      const boughPetals = new THREE.InstancedMesh(singleBranchPetalGeo, singleBranchPetalMat, singlePetalsPerBough);

          pt.y + Math.sin(radialAngle * 0.7) * radialOffset * 0.85 + 0.02,

  function createDetailedBicycle(parent, x, y, z, frameHex = 0x26a69a, rotY = 0, hasBag = false) {
    const bike = new THREE.Group();
    bike.position.set(x, y, z);
    bike.rotation.y = rotY;
    parent.add(bike);

    const frameMat = makeToonMat(frameHex);
    const tireMat = makeToonMat(0x263238);
    const chromeMat = makeToonMat(0xeceff1);
    const leatherMat = makeToonMat(0x2e1c14);

    const wheelGroups = [];
    [-0.44, 0.44].forEach((wz, wIdx) => {
      const wGroup = new THREE.Group();
      wGroup.position.set(0, 0.27, wz);
      bike.add(wGroup);
      wheelGroups.push(wGroup);

      const tire = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.032, 8, 20), tireMat);
      tire.rotation.y = Math.PI / 2;
      wGroup.add(tire);

      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.015, 6, 18), chromeMat);
      rim.rotation.y = Math.PI / 2;
      wGroup.add(rim);

      for (let s = 0; s < 6; s++) {
        const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.44, 4), chromeMat);
        spoke.rotation.x = (s / 6) * Math.PI;
        wGroup.add(spoke);
      }

      const fender = new THREE.Mesh(new THREE.TorusGeometry(0.275, 0.022, 6, 14, Math.PI), frameMat);
      fender.rotation.y = Math.PI / 2;
      wGroup.add(fender);

      if (wIdx === 1) {
        addAnimeMesh(bike, new THREE.BoxGeometry(0.16, 0.025, 0.42), chromeMat, {
          position: new THREE.Vector3(0, 0.56, wz),
          outline: false
        });
      }
    });

    addAnimeMesh(bike, new THREE.CylinderGeometry(0.022, 0.022, 0.66, 8), frameMat, {
      position: new THREE.Vector3(0, 0.50, -0.35),
      rotation: new THREE.Euler(-0.22, 0, 0),
      outline: false
    });
    addAnimeMesh(bike, new THREE.CylinderGeometry(0.024, 0.024, 0.62, 8), frameMat, {
      position: new THREE.Vector3(0, 0.42, -0.06),
      rotation: new THREE.Euler(0.95, 0, 0),
      outline: false
    });
    addAnimeMesh(bike, new THREE.CylinderGeometry(0.022, 0.022, 0.46, 8), frameMat, {
      position: new THREE.Vector3(0, 0.44, 0.145),
      rotation: new THREE.Euler(-0.24, 0, 0),
      outline: false
    });
    addAnimeMesh(bike, new THREE.BoxGeometry(0.04, 0.12, 0.44), frameMat, {
      position: new THREE.Vector3(0.04, 0.27, 0.24),
      outline: false
    });
    addAnimeMesh(bike, new THREE.BoxGeometry(0.15, 0.055, 0.21), leatherMat, {
      position: new THREE.Vector3(0, 0.655, 0.16),
      outline: false
    });
    // Snow puffs on bicycle saddle, front basket rim, and rear rack
    addSnowAccent(
      bike,
      new THREE.BoxGeometry(0.14, 0.032, 0.19),
      new THREE.Vector3(0, 0.692, 0.16)
    );
    addSnowAccent(
      bike,
      new THREE.BoxGeometry(0.26, 0.035, 0.22),
      new THREE.Vector3(0, 0.795, -0.48)
    );
    addSnowAccent(
      bike,
      new THREE.BoxGeometry(0.15, 0.028, 0.38),
      new THREE.Vector3(0, 0.582, 0.44)
    );
    // Handlebars & Grips
    addAnimeMesh(bike, new THREE.CylinderGeometry(0.018, 0.018, 0.48, 8), chromeMat, {
      position: new THREE.Vector3(0, 0.82, -0.28),
      rotation: new THREE.Euler(0, 0, Math.PI / 2),
      outline: false
    });
    addSnowAccent(
      bike,
      new THREE.BoxGeometry(0.44, 0.026, 0.04),
      new THREE.Vector3(0, 0.842, -0.28)
    );
    // Wire Front Basket
    addAnimeMesh(bike, new THREE.BoxGeometry(0.28, 0.22, 0.24), makeToonMat(0x546e7a), {
      position: new THREE.Vector3(0, 0.68, -0.48)
    });
    if (hasBag) {
      addAnimeMesh(bike, new THREE.BoxGeometry(0.22, 0.18, 0.16), makeToonMat(0x8d6e63), {
        position: new THREE.Vector3(0, 0.74, -0.48),
        outline: false
      });
    }

    // Crank set + chainring + pedals
    const crankGroup = new THREE.Group();
    crankGroup.position.set(0, BIKE_CRANK_Y, BIKE_CRANK_Z);
    bike.add(crankGroup);

    const chainring = new THREE.Mesh(new THREE.TorusGeometry(0.078, 0.011, 6, 18), chromeMat);
    chainring.rotation.y = Math.PI / 2;
    chainring.position.x = 0.05;
    chainring.castShadow = false;
    crankGroup.add(chainring);

    [-1, 1].forEach((side) => {
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.024, BIKE_CRANK_R, 0.024), chromeMat);
      arm.position.set(side * 0.072, side * BIKE_CRANK_R * 0.5, 0);
      arm.castShadow = false;
      crankGroup.add(arm);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.05, 6), chromeMat);
      cap.rotation.z = Math.PI / 2;
      cap.position.set(side * 0.088, side * BIKE_CRANK_R, 0);
      cap.castShadow = false;
      crankGroup.add(cap);
    });

    const pedalMat = makeToonMat(0x37474f);
    const pedals = [-1, 1].map((side) => {
      const pedal = new THREE.Mesh(new THREE.BoxGeometry(0.088, 0.022, 0.062), pedalMat);
      pedal.position.set(side * BIKE_PEDAL_X, BIKE_CRANK_Y + side * BIKE_CRANK_R, BIKE_CRANK_Z);
      pedal.castShadow = true;
      pedal.receiveShadow = false;
      bike.add(pedal);
      return pedal;
    });

    bike.userData.wheelGroups = wheelGroups;
    bike.userData.crankGroup = crankGroup;
    bike.userData.pedals = pedals;
    return bike;
  }

  // Photographer's Tripod & Camera Kit standing on the Forecourt, aimed at the station front.
  function createStationTripod(x, z, yaw) {
    const group = new THREE.Group();
    group.position.set(x, 0.38, z);
    group.rotation.y = yaw;
    dioramaGroup.add(group);

    const legMat = makeToonMat(0x1b232b);
    const rubberMat = makeToonMat(0x161a1e);
    const collarMat = makeToonMat(0xb07a2e);
    const cameraMat = makeToonMat(0x14181c);
    const lensMat = makeToonMat(0x14181d);
    const lensGlassMat = makeToonMat(0x24485f, { emissive: 0x1d4257, emissiveIntensity: 0.55 });
    const bagMat = makeToonMat(0x2a1810);

    const UP = new THREE.Vector3(0, 1, 0);
    const APEX_Y = 0.63;
    const FOOT_R = 0.255;
    const from = new THREE.Vector3();
    const to = new THREE.Vector3();
    const dir = new THREE.Vector3();

    function strut(a, b, radius, material, outline) {
      dir.subVectors(b, a);
      const len = dir.length();
      dir.normalize();
      const mesh = addAnimeMesh(group, new THREE.CylinderGeometry(radius, radius, len, 6), material, {
        position: new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5),
        outline: outline !== false
      });
      mesh.quaternion.setFromUnitVectors(UP, dir);
      return mesh;
    }

    for (let i = 0; i < 3; i++) {
      const ang = (i / 3) * Math.PI * 2 + Math.PI / 6;
      from.set(Math.cos(ang) * 0.05, APEX_Y, Math.sin(ang) * 0.05);
      to.set(Math.cos(ang) * FOOT_R, 0.024, Math.sin(ang) * FOOT_R);
      strut(from, to, 0.0125, legMat);
      addAnimeMesh(group, new THREE.CylinderGeometry(0.019, 0.024, 0.034, 8), rubberMat, {
        position: new THREE.Vector3(to.x, 0.017, to.z),
        outline: false
      });
      strut(
        new THREE.Vector3(
          THREE.MathUtils.lerp(to.x, from.x, 0.52),
          THREE.MathUtils.lerp(to.y, from.y, 0.52),
          THREE.MathUtils.lerp(to.z, from.z, 0.52)
        ),
        new THREE.Vector3(Math.cos(ang) * 0.022, APEX_Y * 0.42, Math.sin(ang) * 0.022),
        0.0055, legMat, false
      );
    }

    addAnimeMesh(group, new THREE.CylinderGeometry(0.023, 0.025, 0.20, 10), legMat, {
      position: new THREE.Vector3(0, APEX_Y - 0.05, 0)
    });
    addAnimeMesh(group, new THREE.CylinderGeometry(0.030, 0.030, 0.036, 12), collarMat, {
      position: new THREE.Vector3(0, APEX_Y + 0.055, 0)
    });
    addAnimeMesh(group, new THREE.CylinderGeometry(0.0135, 0.0135, 0.09, 8), legMat, {
      position: new THREE.Vector3(0, APEX_Y + 0.115, 0)
    });

    addAnimeMesh(group, new THREE.CylinderGeometry(0.038, 0.040, 0.022, 12), cameraMat, {
      position: new THREE.Vector3(0, APEX_Y + 0.170, 0)
    });
    addAnimeMesh(group, new THREE.SphereGeometry(0.031, 10, 8), cameraMat, {
      position: new THREE.Vector3(0, APEX_Y + 0.198, 0)
    });
    addAnimeMesh(group, new THREE.BoxGeometry(0.078, 0.012, 0.058), collarMat, {
      position: new THREE.Vector3(0, APEX_Y + 0.222, 0),
      outline: false
    });

    const CAM_Y = APEX_Y + 0.268;
    addAnimeMesh(group, new THREE.BoxGeometry(0.118, 0.080, 0.056), cameraMat, {
      position: new THREE.Vector3(0, CAM_Y, 0)
    });
    addAnimeMesh(group, new THREE.BoxGeometry(0.032, 0.072, 0.050), cameraMat, {
      position: new THREE.Vector3(0.046, CAM_Y - 0.006, 0.004),
      outline: false
    });
    addAnimeMesh(group, new THREE.BoxGeometry(0.044, 0.022, 0.038), cameraMat, {
      position: new THREE.Vector3(0, CAM_Y + 0.050, 0.002),
      outline: false
    });
    const lensBarrel = addAnimeMesh(group, new THREE.CylinderGeometry(0.030, 0.031, 0.060, 12), lensMat, {
      position: new THREE.Vector3(0, CAM_Y, -0.056)
    });
    lensBarrel.rotation.x = Math.PI / 2;
    const lensRing = addAnimeMesh(group, new THREE.CylinderGeometry(0.034, 0.034, 0.008, 12), collarMat, {
      position: new THREE.Vector3(0, CAM_Y, -0.032),
      outline: false
    });
    lensRing.rotation.x = Math.PI / 2;
    const lensGlass = addAnimeMesh(group, new THREE.CylinderGeometry(0.025, 0.025, 0.005, 12), lensGlassMat, {
      position: new THREE.Vector3(0, CAM_Y, -0.087),
      outline: false
    });
    lensGlass.rotation.x = Math.PI / 2;
    addAnimeMesh(group, new THREE.CylinderGeometry(0.013, 0.013, 0.014, 8), collarMat, {
      position: new THREE.Vector3(-0.038, CAM_Y + 0.047, 0.006),
      outline: false
    });
    addAnimeMesh(group, new THREE.BoxGeometry(0.026, 0.006, 0.020), legMat, {
      position: new THREE.Vector3(0, CAM_Y + 0.064, 0.002),
      outline: false
    });
    addAnimeMesh(group, new THREE.BoxGeometry(0.050, 0.030, 0.022), cameraMat, {

    });
    addSnowAccent(
      group,
      new THREE.BoxGeometry(0.11, 0.024, 0.06),
      new THREE.Vector3(0, CAM_Y + 0.105, 0)
    );

    const bag = new THREE.Group();
    bag.position.set(0.40, 0, 0.13);
    bag.rotation.y = -0.55;
    group.add(bag);

    addAnimeMesh(bag, new THREE.BoxGeometry(0.262, 0.034, 0.140), bagLidMat, {

    addSnowAccent(

    addAnimeMesh(bag, new THREE.BoxGeometry(0.238, 0.062, 0.014), bagLidMat, {
      position: new THREE.Vector3(0, 0.120, -0.068),

    addAnimeMesh(bag, new THREE.BoxGeometry(0.030, 0.026, 0.010), collarMat, {

  // Pastel Sakura & Spring Breeze Livery Artwork Generator (inspired by airy anime sakura backgrounds)
  // Uses soft pink, pale sky-blue, light mint-green, and pearl white with blooming sakura branches & petals
  // ---------------------------------------------------------------------------
  function drawPastelSakuraBlossom(ctx, x, y, radius, rotation = 0, alpha = 1.0, tint = 'pink') {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.globalAlpha = alpha;

    // Soft dreamy outer blossom glow
    const glow = ctx.createRadialGradient(0, 0, radius * 0.1, 0, 0, radius * 1.25);
    glow.addColorStop(0, tint === 'white' ? 'rgba(255, 250, 253, 0.65)' : 'rgba(255, 205, 224, 0.55)');
    glow.addColorStop(1, 'rgba(255, 230, 240, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 1.25, 0, Math.PI * 2);
    ctx.fill();

    // 5 heart-notched sakura petals
    for (let p = 0; p < 5; p++) {
      ctx.save();
      ctx.rotate((p / 5) * Math.PI * 2);
      const pGrad = ctx.createLinearGradient(0, 0, 0, -radius);
      if (tint === 'white') {
        pGrad.addColorStop(0, '#ffb8d0');
        pGrad.addColorStop(0.55, '#ffeef5');
        pGrad.addColorStop(1, '#ffffff');
      } else {
        pGrad.addColorStop(0, '#ff8eb5');
        pGrad.addColorStop(0.5, '#ffc4d9');
        pGrad.addColorStop(1, '#fff5f9');
      }
      ctx.fillStyle = pGrad;
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.08);
      ctx.bezierCurveTo(radius * 0.42, -radius * 0.28, radius * 0.48, -radius * 0.85, radius * 0.14, -radius * 0.98);
      ctx.lineTo(0, -radius * 0.80);
      ctx.lineTo(-radius * 0.14, -radius * 0.98);
      ctx.bezierCurveTo(-radius * 0.48, -radius * 0.85, -radius * 0.42, -radius * 0.28, 0, -radius * 0.08);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Delicate rose-pink center calyx & stamens
    ctx.fillStyle = '#e86892';
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.14, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#f0789e';
    ctx.lineWidth = Math.max(1, radius * 0.045);
    for (let s = 0; s < 8; s++) {
      const sAng = (s / 8) * Math.PI * 2 + 0.2;
      const sLen = radius * 0.28;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(sAng) * sLen, Math.sin(sAng) * sLen);
      ctx.stroke();
      ctx.fillStyle = '#fff6fa';
      ctx.beginPath();
      ctx.arc(Math.cos(sAng) * sLen, Math.sin(sAng) * sLen, radius * 0.045, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFloatingSakuraPetal(ctx, x, y, size, angle, alpha = 0.85) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.globalAlpha = alpha;
    const grad = ctx.createLinearGradient(0, -size, 0, size);
    grad.addColorStop(0, '#fff7fa');
    grad.addColorStop(0.6, '#ffc6da');
    grad.addColorStop(1, '#ff9ec0');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, size * 0.85);
    ctx.bezierCurveTo(size * 0.55, size * 0.35, size * 0.62, -size * 0.55, size * 0.18, -size * 0.85);
    ctx.lineTo(0, -size * 0.58);
    ctx.lineTo(-size * 0.18, -size * 0.85);
    ctx.bezierCurveTo(-size * 0.62, -size * 0.55, -size * 0.55, size * 0.35, 0, size * 0.85);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawSpringLeafBud(ctx, x, y, size, angle, alpha = 0.85) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.globalAlpha = alpha;
    const grad = ctx.createLinearGradient(0, -size, 0, size);
    grad.addColorStop(0, '#c8f0a4');
    grad.addColorStop(1, '#84c464');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.quadraticCurveTo(size * 0.52, 0, 0, size);
    ctx.quadraticCurveTo(-size * 0.52, 0, 0, -size);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawSakuraBranchCorner(ctx, startX, startY, reachX, reachY, scale = 1.0) {
    ctx.save();
    // Soft rose-brown twig branches
    ctx.strokeStyle = 'rgba(136, 92, 102, 0.65)';
    ctx.lineCap = 'round';
    ctx.lineWidth = 4.5 * scale;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(startX + reachX * 0.48, startY + reachY * 0.32, startX + reachX, startY + reachY);
    ctx.stroke();

    ctx.lineWidth = 2.8 * scale;
    ctx.beginPath();
    ctx.moveTo(startX + reachX * 0.35, startY + reachY * 0.25);
    ctx.quadraticCurveTo(startX + reachX * 0.62, startY + reachY * 0.82, startX + reachX * 0.88, startY + reachY * 1.15);
    ctx.stroke();

  function drawSoftPastelSparkle(ctx, x, y, radius, color = '#fff6d6', alpha = 0.85) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -radius);
    ctx.quadraticCurveTo(radius * 0.18, -radius * 0.18, radius, 0);
    ctx.quadraticCurveTo(radius * 0.18, radius * 0.18, 0, radius);
    ctx.quadraticCurveTo(-radius * 0.18, radius * 0.18, -radius, 0);
    ctx.quadraticCurveTo(-radius * 0.18, -radius * 0.18, 0, -radius);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
