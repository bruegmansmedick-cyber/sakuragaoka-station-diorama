  function createFallbackAtlasTexture(accentColor) {
    const tex = createCanvasTexture(512, 512, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      const cols = 8;
      const rows = 9;
      const cw = w / cols;
      const ch = h / rows;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cx = c * cw + cw * 0.5;
          const cy = r * ch + ch * 0.52;
          const bounce = Math.sin((c / cols) * Math.PI * 2) * 2.5;
          ctx.fillStyle = accentColor;
          ctx.beginPath();
          ctx.arc(cx, cy - 8 + bounce, cw * 0.28, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffe6cc';
          ctx.beginPath();
          ctx.arc(cx, cy - 6 + bounce, cw * 0.22, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#231815';
          ctx.beginPath();
          ctx.arc(cx - 5, cy - 6 + bounce, 2.2, 0, Math.PI * 2);
          ctx.arc(cx + 5, cy - 6 + bounce, 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = accentColor;
          ctx.fillRect(cx - cw * 0.16, cy + 6 + bounce, cw * 0.32, ch * 0.26);
        }
      }
    });
    tex.magFilter = THREE.LinearFilter;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    return tex;
  }

  function analyzeCodexSpritesheet(img) {
    const cols = 8;
    const approxRows = Math.round((img.height / img.width) * cols * (192 / 208));
    const rows = (approxRows === 11 || img.height >= 2100) ? 11 : 9;

    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);

    const cellW = Math.floor(img.width / cols);
    const cellH = Math.floor(img.height / rows);
    const validFramesPerRow = [];
    let globalBottomRatios = [];

    for (let r = 0; r < rows; r++) {
      const validCols = [];
      for (let c = 0; c < cols; c++) {
        const imgData = ctx.getImageData(c * cellW, r * cellH, cellW, cellH).data;
        let nonTransparentCount = 0;
        let maxY = 0;
        for (let py = 0; py < cellH; py += 2) {
          for (let px = 0; px < cellW; px += 2) {
            const a = imgData[(py * cellW + px) * 4 + 3];
            if (a > 24) {
              nonTransparentCount++;
              if (py > maxY) maxY = py;
            }
          }
        }
        if (nonTransparentCount > 18) {
          validCols.push(c);
          if (r === 0 || r === 3) {
            globalBottomRatios.push((cellH - 1 - maxY) / cellH);
          }
        }
      }
      validFramesPerRow.push(validCols.length > 0 ? validCols : [0]);
    }

    let bottomPadRatio = 0.04;
    if (globalBottomRatios.length > 0) {
      globalBottomRatios.sort((a, b) => a - b);
      bottomPadRatio = globalBottomRatios[Math.floor(globalBottomRatios.length * 0.3)];
    }

    return {
      cols,
      rows,
      hasLookDirections: rows >= 11,
      validFramesPerRow,
      bottomPadRatio: THREE.MathUtils.clamp(bottomPadRatio, 0.0, 0.22)
    };
  }

  function loadCodexPetAtlas(charType) {
    const spec = CODEX_PET_REGISTRY[charType] || CODEX_PET_REGISTRY.miku;
    if (codexPetAtlasCache[spec.slug]) {
      return codexPetAtlasCache[spec.slug];
    }

    const fallbackTex = createFallbackAtlasTexture(spec.fallbackColor);
    const entry = {
      slug: spec.slug,
      texture: fallbackTex,
      cols: 8,
      rows: 9,
      hasLookDirections: false,
      validFramesPerRow: Array.from({ length: 9 }, () => [0, 1, 2, 3, 4, 5, 6, 7]),
      bottomPadRatio: 0.05,
      loaded: false,
      subscribers: []
    };
    codexPetAtlasCache[spec.slug] = entry;

    const cdnUrls = [
      `https://cdn.jsdelivr.net/gh/legeling/awesome-codex-pet@main/pets/${spec.slug}/spritesheet.webp`,
      `https://fastly.jsdelivr.net/gh/legeling/awesome-codex-pet@main/pets/${spec.slug}/spritesheet.webp`,
      `https://raw.githubusercontent.com/legeling/awesome-codex-pet/main/pets/${spec.slug}/spritesheet.webp`
    ];

    function tryLoadUrl(idx) {
      if (idx >= cdnUrls.length) return;
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const meta = analyzeCodexSpritesheet(img);
        const tex = new THREE.Texture(img);
        tex.encoding = THREE.sRGBEncoding;
        tex.magFilter = THREE.LinearFilter;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.wrapS = THREE.ClampToEdgeWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.needsUpdate = true;

        entry.texture = tex;
        entry.cols = meta.cols;
        entry.rows = meta.rows;
        entry.hasLookDirections = meta.hasLookDirections;
        entry.validFramesPerRow = meta.validFramesPerRow;
        entry.bottomPadRatio = meta.bottomPadRatio;
        entry.loaded = true;

        entry.subscribers.forEach((cb) => cb(entry));
      };
      img.onerror = () => {
        tryLoadUrl(idx + 1);
      };
      img.src = cdnUrls[idx];
    }

    tryLoadUrl(0);
    return entry;
  }

  function createChibiCharacter(opts) {
    const pGroup = new THREE.Group();
    const charType = opts.characterType || 'miku';
    const clipPlanes = opts.clippingPlanes || trainClipPlanes;
    const atlasEntry = loadCodexPetAtlas(charType);

    const shadowMat = new THREE.MeshBasicMaterial({
      color: 0x1e272e,
      transparent: true,
      opacity: 0.28,
      depthWrite: false,
      clippingPlanes: clipPlanes
    });
    const contactShadow = new THREE.Mesh(new THREE.CircleGeometry(0.24, 16), shadowMat);
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.y = 0.015;
    pGroup.add(contactShadow);

    const spriteH = 1.24;
    const spriteW = spriteH * 0.82;
    const spriteGeo = new THREE.PlaneGeometry(spriteW, spriteH);

    const spriteUniforms = {
      uMap: { value: atlasEntry.texture },
      uUvOffset: { value: new THREE.Vector2(0, 8 / 9) },
      uUvScale: { value: new THREE.Vector2(1 / 8, 1 / 9) },
      uFlipX: { value: 0.0 },
      uCropBottom: { value: 0.0 },
      uCropTop: { value: 1.0 },
      uTrainOpacity: globalUniforms.uTrainOpacity,
      uIsTrainClipped: { value: 0.0 }
    };

    const spriteMat = new THREE.ShaderMaterial({
      uniforms: spriteUniforms,
      clippingPlanes: clipPlanes,
      clipping: true,
      transparent: true,
      side: THREE.DoubleSide,
      vertexShader: `
        #include <clipping_planes_pars_vertex>
        varying vec2 vUv;
        varying vec3 vWorldPos;
        void main() {
          vUv = uv;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * mvPosition;
          #include <clipping_planes_vertex>
        }
      `,
      fragmentShader: `
        #include <clipping_planes_pars_fragment>
        uniform sampler2D uMap;
        uniform vec2 uUvOffset;
        uniform vec2 uUvScale;
        uniform float uFlipX;
        uniform float uCropBottom;
        uniform float uCropTop;
        uniform float uTrainOpacity;
        uniform float uIsTrainClipped;
        varying vec2 vUv;
        varying vec3 vWorldPos;
        void main() {
          #include <clipping_planes_fragment>
          if (vUv.y < uCropBottom || vUv.y > uCropTop) discard;
          vec2 localUv = vUv;
          if (uFlipX > 0.5) {
            localUv.x = 1.0 - localUv.x;
          }
          localUv = clamp(localUv, 0.006, 0.994);
          vec2 atlasUv = uUvOffset + localUv * uUvScale;
          vec4 texCol = texture2D(uMap, atlasUv);

          float fade = 1.0;
          if (uIsTrainClipped > 0.5) {
            float edgeFade = smoothstep(18.9, 13.8, abs(vWorldPos.x));
            fade = uTrainOpacity * edgeFade;
          }
          float alpha = texCol.a * fade;
          if (alpha < 0.14) discard;

          vec3 rgb = texCol.rgb * 1.04;
          gl_FragColor = vec4(rgb, alpha);
        }
      `
    });

    const depthMat = new THREE.ShaderMaterial({
      uniforms: {
        uMap: spriteUniforms.uMap,
        uUvOffset: spriteUniforms.uUvOffset,
        uUvScale: spriteUniforms.uUvScale,
        uFlipX: spriteUniforms.uFlipX,
        uCropBottom: spriteUniforms.uCropBottom,
        uCropTop: spriteUniforms.uCropTop
      },
      clippingPlanes: clipPlanes,
      clipping: true,
      side: THREE.DoubleSide,
      vertexShader: `
        #include <clipping_planes_pars_vertex>
        varying vec2 vUv;
        void main() {
          vUv = uv;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          #include <clipping_planes_vertex>
        }
      `,
      fragmentShader: `
        #include <clipping_planes_pars_fragment>
        #include <packing>
        uniform sampler2D uMap;
        uniform vec2 uUvOffset;
        uniform vec2 uUvScale;
        uniform float uFlipX;
        uniform float uCropBottom;
        uniform float uCropTop;
        varying vec2 vUv;
        void main() {
          #include <clipping_planes_fragment>
          if (vUv.y < uCropBottom || vUv.y > uCropTop) discard;
          vec2 localUv = vUv;
          if (uFlipX > 0.5) localUv.x = 1.0 - localUv.x;
          vec2 atlasUv = uUvOffset + clamp(localUv, 0.006, 0.994) * uUvScale;
          vec4 texCol = texture2D(uMap, atlasUv);
          if (texCol.a < 0.25) discard;
          gl_FragColor = packDepthToRGBA(gl_FragCoord.z);
        }
      `
    });

    const billboardMesh = new THREE.Mesh(spriteGeo, spriteMat);
    billboardMesh.customDepthMaterial = depthMat;
    billboardMesh.rotation.order = 'YXZ';
    billboardMesh.castShadow = true;
    billboardMesh.receiveShadow = false;
    billboardMesh.renderOrder = 4;
    billboardMesh.position.y = spriteH * (0.5 - atlasEntry.bottomPadRatio);
    pGroup.add(billboardMesh);

    atlasEntry.subscribers.push((loadedEntry) => {
      spriteUniforms.uMap.value = loadedEntry.texture;
      billboardMesh.position.y = spriteH * (0.5 - loadedEntry.bottomPadRatio);
    });

    pGroup.scale.setScalar(opts.scale || ACTOR_DEFAULT_SCALE);
    if (!opts.skipSceneAdd) {
      dioramaGroup.add(pGroup);
    }

    const dummyNode = new THREE.Group();
    const actor = {
      group: pGroup,
      billboardMesh,
      contactShadow,
      spriteUniforms,
      atlasEntry,
      spriteH,
      charType,
      animMode: 'idle',
      walkSpeed: 0,
      phase: Math.random() * 10,
      lastWorldPos: new THREE.Vector3(),
      hasLastPos: false,
      moveDirWorld: new THREE.Vector3(0, 0, 1),
      armL: dummyNode,
      armR: dummyNode,
      legL: dummyNode,
      legR: dummyNode,
      headGroup: dummyNode
    };
    chibiDynamicActors.push(actor);
    return actor;
  }

  const _actorWorldPos = new THREE.Vector3();
  const _camRight = new THREE.Vector3();
  const _camForward = new THREE.Vector3();
  const _toCam = new THREE.Vector3();
  const _parentQuat = new THREE.Quaternion();

  function updateAllCodexPetBillboards(time) {
    camera.getWorldDirection(_camForward);
    _camRight.crossVectors(_camForward, camera.up).normalize();

    for (let i = 0; i < chibiDynamicActors.length; i++) {
      const actor = chibiDynamicActors[i];
      if (!actor.group.visible) continue;

      actor.group.getWorldPosition(_actorWorldPos);

      if (actor.hasLastPos) {
        const dx = _actorWorldPos.x - actor.lastWorldPos.x;
        const dz = _actorWorldPos.z - actor.lastWorldPos.z;
        const distSq = dx * dx + dz * dz;
        if (distSq > 0.000004) {
          actor.moveDirWorld.set(dx, 0, dz).normalize();
        }
      } else {
        actor.hasLastPos = true;
      }
      actor.lastWorldPos.copy(_actorWorldPos);

      _toCam.subVectors(camera.position, _actorWorldPos);
      const worldYawToCam = Math.atan2(_toCam.x, _toCam.z);
      actor.group.getWorldQuaternion(_parentQuat);
      const parentEuler = new THREE.Euler().setFromQuaternion(_parentQuat, 'YXZ');

      const entry = actor.atlasEntry;
      const totalCols = entry.cols || 8;
      const totalRows = entry.rows || 9;

      let targetRow = 0;
      let flipX = 0.0;
      let fps = 8.0;
      let rollZ = 0.0;

      if (actor.animMode === 'run_board' || actor.animMode === 'jump_board') {
        const screenRightDot = actor.moveDirWorld.dot(_camRight);
        if (actor.animMode === 'jump_board' || (actor.boardHopY && actor.boardHopY > 0.11)) {
          targetRow = 6;
          fps = 12.5;
        } else if (screenRightDot > 0.16) {
          targetRow = 4;
          fps = 15.5;
        } else if (screenRightDot < -0.16) {
          targetRow = 5;
          fps = 15.5;
        } else {
          targetRow = (Math.floor(time * 6.0) % 3 === 0) ? 6 : 3;
          fps = 15.5;
        }

        const stridePhase = time * 24.0 + actor.phase * 4.0;
        const strideSin = Math.sin(stridePhase);
        const strideBounce = Math.abs(strideSin) * 0.115;
        const totalHopY = strideBounce + (actor.boardHopY || 0.0);
        const squash = 1.0 + Math.cos(stridePhase * 2.0) * 0.075;

        actor.billboardMesh.position.y = actor.spriteH * (0.5 - entry.bottomPadRatio) + totalHopY;
        actor.billboardMesh.scale.set(1.0 / Math.sqrt(squash), squash, 1.0);
        const shadowScale = THREE.MathUtils.clamp(1.0 - totalHopY * 1.4, 0.45, 1.0);
        actor.contactShadow.scale.setScalar(shadowScale);

        rollZ = strideSin * 0.115 - screenRightDot * 0.09;
      } else if (actor.animMode === 'walk' && actor.walkSpeed > 0.05) {
        const screenRightDot = actor.moveDirWorld.dot(_camRight);
        if (screenRightDot > 0.22) {
          targetRow = 4;
        } else if (screenRightDot < -0.22) {
          targetRow = 5;
        } else {
          targetRow = 3;
        }
        fps = 9.5;
        const walkStride = Math.sin(time * 15.0 + actor.phase * 3.0);
        actor.billboardMesh.position.y = actor.spriteH * (0.5 - entry.bottomPadRatio) + Math.abs(walkStride) * 0.042;
        rollZ = walkStride * 0.045;
      } else if (actor.animMode === 'sit') {
        targetRow = 0;
        fps = 4.5;
      } else {
        const showcaseRows = actor.charType === 'mikoto'
          ? [0, 1, 2, 7, 0, 6, 1, 7]
          : [0, 1, 2, 0, 1, 7, 2, 6];
        const cycleSlot = Math.floor((time + actor.phase) * 0.42) % showcaseRows.length;
        targetRow = showcaseRows[cycleSlot];
        fps = 7.8;
      }

      actor.billboardMesh.rotation.set(actor.leanX || 0, worldYawToCam - parentEuler.y, rollZ);

      targetRow = Math.min(targetRow, totalRows - 1);
      const validCols = (entry.validFramesPerRow && entry.validFramesPerRow[targetRow]) || [0];
      const frameIdx = Math.floor((time * fps) + actor.phase * 3.0) % validCols.length;
      const col = validCols[frameIdx];

      const uScale = 1.0 / totalCols;
      const vScale = 1.0 / totalRows;
      const uOffset = col * uScale;
      const vOffset = 1.0 - (targetRow + 1) * vScale;

      actor.spriteUniforms.uUvScale.value.set(uScale, vScale);
      actor.spriteUniforms.uUvOffset.value.set(uOffset, vOffset);
      actor.spriteUniforms.uFlipX.value = flipX;
    }
  }

  function resetPersonSpriteCrop(person) {

  function getVehicleLocalWorldPosition(vehicleGroup, localPosition, target = new THREE.Vector3()) {
    const vehicleScale = vehicleGroup.scale.x || 1;

    const s = Math.sin(yaw);
    return target.set(
      vehicleGroup.position.x + (c * localPosition.x + s * localPosition.z) * vehicleScale,
      vehicleGroup.position.y + localPosition.y * vehicleScale,
      vehicleGroup.position.z + (-s * localPosition.x + c * localPosition.z) * vehicleScale
    );

  function resolvePlazaObstacles(x, z) {
    let rx = x;
    let rz = z;
    for (let i = 0; i < PLAZA_CIRCULAR_OBSTACLES.length; i++) {
      const obs = PLAZA_CIRCULAR_OBSTACLES[i];
      const dx = rx - obs.x;
      const dz = rz - obs.z;
      const dist = Math.hypot(dx, dz);
      if (dist < obs.r) {
        const inv = dist > 0.0001 ? 1.0 / dist : 1.0;
        const nx = dist > 0.0001 ? dx * inv : 0.0;
        const nz = dist > 0.0001 ? dz * inv : 1.0;
        rx = obs.x + nx * obs.r;
        rz = obs.z + nz * obs.r;
      }
    }
    return { x: rx, z: rz };
  }

  // Walk a polyline at constant speed: u = 0..1 across the WHOLE path, so a route with
  // intermediate waypoints keeps a steady pace instead of speeding up on shorter legs.
  function walkPolyline(points, u) {
    const lengths = [];
    let total = 0;
    for (let i = 0; i < points.length - 1; i++) {
      const len = Math.hypot(points[i + 1].x - points[i].x, points[i + 1].z - points[i].z);
      lengths.push(len);
      total += len;
    }
    let travelled = u * total;
    for (let i = 0; i < lengths.length; i++) {
      if (travelled <= lengths[i] || i === lengths.length - 1) {
        const k = lengths[i] > 0.0001 ? Math.min(1, travelled / lengths[i]) : 1;
        return {
          x: THREE.MathUtils.lerp(points[i].x, points[i + 1].x, k),
          z: THREE.MathUtils.lerp(points[i].z, points[i + 1].z, k)
        };
      }
      travelled -= lengths[i];
    }
    return { x: points[points.length - 1].x, z: points[points.length - 1].z };
  }

  });
  // 4. 鸣潮·菲比 Phoebe: Walks across forecourt to hail the Crown Taxi, boards when rear door opens, and rides away
  const passengerBoardD = createChibiCharacter({
    characterType: 'phoebe'
  });
  // 5. 原神·莉奈娅 Linnea: Travelling photographer on the forecourt
  const passengerBoardE = createChibiCharacter({
    characterType: 'linnea'
  });
  const TAXI_DOOR_PORTAL_LOCAL = { x: -0.68, y: 0.14, z: 0.31 };
  const TAXI_REAR_SEAT_LOCAL = { x: -0.18, y: 0.34, z: 0.46 };

  const trainSlidingDoors = [];
  const trainWheels = [];
  const trainCarBodies = [];
  const trainGroup = new THREE.Group();
  trainGroup.position.set(-28.0, 0.585, trackCenterZ);
  dioramaGroup.add(trainGroup);

  // Harmonious multi-pastel train base palette (sakura rose, sky-celadon frieze, soft wisteria-blue roof & mint seats)
  const trainBodyGreenMat = makeToonMat(0xf4b2cc, { boostHSL: false, clippingPlanes: trainClipPlanes });
  const trainCreamMat = makeToonMat(0xc4e4f8, { boostHSL: false, clippingPlanes: trainClipPlanes });
  const trainRoofMat = makeToonMat(0xb8cae2, { boostHSL: false, clippingPlanes: trainClipPlanes });
  const trainBogieMat = makeToonMat(0x52606d, { boostHSL: false, clippingPlanes: trainClipPlanes });
  const trainWheelSteelMat = makeToonMat(0xcfd8dc, { clippingPlanes: trainClipPlanes });
  const trainWheelHubMat = makeToonMat(0x455a64, { clippingPlanes: trainClipPlanes });
  const trainSeatMat = makeToonMat(0x8fd9c4, { boostHSL: false, clippingPlanes: trainClipPlanes });
  const trainPrioritySeatMat = makeToonMat(0xf49eb8, { boostHSL: false, clippingPlanes: trainClipPlanes });
  const trainFloorMat = makeToonMat(0xf2e6ec, { boostHSL: false, clippingPlanes: trainClipPlanes });

  // ---------------------------------------------------------------------------
  // Pastel Sakura Wrapping Train (桜ミク・春風ラッピング車両) Materials
  // Rich pastel palette: Sakura Rose, Sky Blue, Celadon Mint, Wisteria Lilac & Warm Apricot (reduced white)
  // ---------------------------------------------------------------------------
  function createTrainItashaMaterials(isMikuCar) {
    const sideWrapTex = createCanvasTexture(1024, 256, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);

      // Rich multi-pastel gradient backdrop (replacing the previous white center band)
      const bg = ctx.createLinearGradient(0, 0, w, h);
      if (isMikuCar) {
        bg.addColorStop(0.00, '#f7b2cc');
        bg.addColorStop(0.34, '#f9cde0');
        bg.addColorStop(0.68, '#a4d6f8');
        bg.addColorStop(1.00, '#9ee6d4');
      } else {
        bg.addColorStop(0.00, '#9cd0f6');
        bg.addColorStop(0.35, '#d6c4f2');
        bg.addColorStop(0.70, '#f7b6cf');
        bg.addColorStop(1.00, '#fbe0c4');
      }
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Diagonal pastel color-block sashes for visual rhythm without clutter
      ctx.fillStyle = isMikuCar ? 'rgba(164, 232, 214, 0.58)' : 'rgba(166, 220, 250, 0.58)';
      ctx.beginPath();
      ctx.moveTo(w * 0.16, h);
      ctx.lineTo(w * 0.34, 0);
      ctx.lineTo(w * 0.50, 0);
      ctx.lineTo(w * 0.32, h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = isMikuCar ? 'rgba(214, 196, 244, 0.56)' : 'rgba(168, 236, 216, 0.56)';
      ctx.beginPath();
      ctx.moveTo(w * 0.52, h);
      ctx.lineTo(w * 0.68, 0);
      ctx.lineTo(w * 0.82, 0);
      ctx.lineTo(w * 0.66, h);
      ctx.closePath();
      ctx.fill();

      // Soft warm sunlight bokeh circles in pastel apricot & rose
      const bokehSpots = [
        [180, 70, 42], [340, 155, 52], [512, 82, 46], [690, 148, 50], [840, 75, 42]
      ];
      bokehSpots.forEach(([bx, by, br], idx) => {
        const bGrad = ctx.createRadialGradient(bx, by, 2, bx, by, br);
        bGrad.addColorStop(0, idx % 2 === 0 ? 'rgba(255, 240, 210, 0.62)' : 'rgba(255, 215, 232, 0.62)');
        bGrad.addColorStop(1, 'rgba(255, 235, 220, 0)');
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();
      });

      // Flowing Japanese spring breeze silk ribbons in celadon mint, sky blue, and sakura rose
      ctx.fillStyle = 'rgba(148, 228, 208, 0.74)';
      ctx.beginPath();
      ctx.moveTo(0, h * 0.70);
      ctx.bezierCurveTo(w * 0.28, h * 0.38, w * 0.64, h * 0.86, w, h * 0.46);
      ctx.lineTo(w, h * 0.76);
      ctx.bezierCurveTo(w * 0.64, h * 1.04, w * 0.28, h * 0.64, 0, h * 0.94);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(246, 158, 194, 0.76)';
      ctx.beginPath();
      ctx.moveTo(0, h * 0.82);
      ctx.bezierCurveTo(w * 0.32, h * 0.54, w * 0.68, h * 0.94, w, h * 0.60);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();

      // Delicate warm champagne-gold accent curve
      ctx.strokeStyle = 'rgba(248, 216, 156, 0.86)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.70);
      ctx.bezierCurveTo(w * 0.28, h * 0.38, w * 0.64, h * 0.86, w, h * 0.46);
      ctx.stroke();

      // Bottom trim bands in soft apricot-gold & celadon-mint
      ctx.fillStyle = '#fae0b8';
      ctx.fillRect(0, h - 22, w, 9);
      ctx.fillStyle = isMikuCar ? '#8edec8' : '#96ccf4';
      ctx.fillRect(0, h - 13, w, 13);

      // Arching sakura branches from left, center, and right
      drawSakuraBranchCorner(ctx, 12, 10, 300, 148, 1.06);
      drawSakuraBranchCorner(ctx, w - 12, 12, -300, 148, 1.06);
      drawSakuraBranchCorner(ctx, w * 0.50, 6, 155, 98, 0.84);
      drawSakuraBranchCorner(ctx, w * 0.50, 6, -155, 98, 0.84);

      // Drifting sakura petals & four-point pastel sparkles across the breeze
      const petals = [
        [285, 165, 13, 0.4], [360, 118, 11, -0.5], [435, 172, 14, 0.9],
        [512, 142, 12, -0.3], [595, 168, 13, 0.7], [670, 115, 11, -0.6],
        [748, 162, 14, 0.3]
      ];
      petals.forEach(([px, py, ps, pang], idx) => {
        drawFloatingSakuraPetal(ctx, px, py, ps, pang, 0.90);
        if (idx % 2 === 0) {
          drawSoftPastelSparkle(ctx, px + 26, py - 24, 9, '#fff5cc', 0.82);
        }
      });

      // Harmonious pastel typography
      ctx.fillStyle = '#9e3b62';
      ctx.font = 'bold 30px "Hiragino Mincho ProN", "Yu Gothic UI", serif';
      ctx.textAlign = 'center';
      ctx.fillText('さくらがおか 春風号', w * 0.5, 148);
      ctx.fillStyle = '#487699';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('SAKURAGAOKA SPRING PASTEL LINER', w * 0.5, 180);
    });

    const doorWrapTex = createCanvasTexture(256, 512, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0.00, '#a6d6f8');
      bg.addColorStop(0.48, '#decaf4');
      bg.addColorStop(1.00, '#f7b6cf');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Diagonal celadon-mint & warm apricot sash across the door
      ctx.fillStyle = 'rgba(162, 234, 212, 0.72)';
      ctx.beginPath();
      ctx.moveTo(0, h * 0.62);
      ctx.lineTo(w, h * 0.36);
      ctx.lineTo(w, h * 0.58);
      ctx.lineTo(0, h * 0.84);
      ctx.closePath();
      ctx.fill();

      // Warm champagne-gold & mint waist stripes
      ctx.fillStyle = '#fae0b8';
      ctx.fillRect(0, h * 0.76, w, 14);
      ctx.fillStyle = '#92e0ca';
      ctx.fillRect(0, h * 0.76 + 14, w, 18);

      // Blooming sakura branch arching across the door panel
      drawSakuraBranchCorner(ctx, 10, 24, w * 0.84, h * 0.38, 0.98);
      drawPastelSakuraBlossom(ctx, w * 0.32, h * 0.56, 28, 0.4, 0.95, 'pink');
      drawPastelSakuraBlossom(ctx, w * 0.68, h * 0.66, 22, 1.0, 0.92, 'white');
      drawFloatingSakuraPetal(ctx, w * 0.52, h * 0.46, 13, -0.4, 0.88);
      drawSoftPastelSparkle(ctx, w * 0.72, h * 0.42, 10, '#fff5cc', 0.85);
    });

    const headmarkTex = createCanvasTexture(256, 256, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      const cx = w * 0.5;
      const cy = h * 0.5;
      const r = w * 0.46;

      const bg = ctx.createRadialGradient(cx, cy - 18, 10, cx, cy, r);
      bg.addColorStop(0.0, '#fce6c8');
      bg.addColorStop(0.52, '#a6d6f8');
      bg.addColorStop(1.0, '#f6b2cc');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 8;
      ctx.strokeStyle = '#98e2cc';
      ctx.stroke();

      // Sakura blossom wreath inside the circular headmark
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2 - Math.PI / 2;
        drawPastelSakuraBlossom(
          ctx,
          cx + Math.cos(ang) * (r * 0.58),
          cy + Math.sin(ang) * (r * 0.58),
          22,
          ang,
          0.95,
          i % 2 === 0 ? 'pink' : 'white'
        );
      }
      drawPastelSakuraBlossom(ctx, cx, cy - 8, 30, 0.2, 0.96, 'pink');

      ctx.fillStyle = 'rgba(255, 240, 246, 0.92)';
      ctx.fillRect(36, h - 68, w - 72, 34);
      ctx.fillStyle = '#a83c66';
      ctx.font = 'bold 21px "Hiragino Kaku Gothic ProN", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('さくら 春風号', cx, h - 44);
    });

    return {
      sideMat: makeToonMat(0xffffff, { map: sideWrapTex, boostHSL: false, clippingPlanes: trainClipPlanes }),
      doorMat: makeToonMat(0xffffff, { map: doorWrapTex, boostHSL: false, clippingPlanes: trainClipPlanes }),
      headmarkMat: makeToonMat(0xffffff, { map: headmarkTex, boostHSL: false, clippingPlanes: trainClipPlanes })
    };
  }

  const mikuTrainWrap = createTrainItashaMaterials(true);
  const mikotoTrainWrap = createTrainItashaMaterials(false);

  const trainWinMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: globalUniforms.uTime,
      uTrainOpacity: globalUniforms.uTrainOpacity
    },
    clippingPlanes: trainClipPlanes,
    clipping: true,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      #include <clipping_planes_pars_vertex>
      varying vec3 vWorldPos;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * mvPosition;
        #include <clipping_planes_vertex>
      }
    `,
    fragmentShader: `
      #include <clipping_planes_pars_fragment>
      uniform float uTime;
      uniform float uTrainOpacity;
      varying vec3 vWorldPos;
      varying vec2 vUv;
      void main() {
        #include <clipping_planes_fragment>
        float edgeFade = smoothstep(18.9, 13.8, abs(vWorldPos.x));
        float streak = smoothstep(0.42, 0.48, fract(vUv.x * 1.6 + vUv.y * 0.9 - vWorldPos.x * 0.08));
        vec3 skyRef = mix(vec3(0.75, 0.92, 1.0), vec3(1.0, 0.78, 0.88), sin(vWorldPos.x * 0.6) * 0.5 + 0.5);
        vec3 col = skyRef + vec3(streak * 0.28);
        float alpha = (0.20 + streak * 0.14) * uTrainOpacity * edgeFade;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(col, alpha);
      }
    `
  });

  function buildTrainCar(offsetX, isLeadEast) {
    const car = new THREE.Group();
    car.position.set(offsetX, 0, 0);
    trainGroup.add(car);

    const carLen = 9.2;
    const carW = 2.24;
    const halfW = carW / 2;
    const carWrap = isLeadEast ? mikuTrainWrap : mikotoTrainWrap;

    [-2.85, 2.85].forEach((bx) => {
      const bogie = new THREE.Group();
      bogie.position.set(bx, 0.30, 0);
      car.add(bogie);

      [-0.64, 0.64].forEach((fz) => {
        addAnimeMesh(bogie, new THREE.BoxGeometry(1.78, 0.16, 0.10), trainBogieMat, {
          position: new THREE.Vector3(0, 0.04, fz),
          useTrainClip: true,
          outline: false
        });
        [-0.18, 0.18].forEach((sx) => {
          addAnimeMesh(bogie, new THREE.CylinderGeometry(0.075, 0.075, 0.22, 10), trainWheelHubMat, {
            position: new THREE.Vector3(sx, 0.08, fz),
            useTrainClip: true,
            outline: false
          });
        });
        [-0.58, 0.58].forEach((wx) => {
          addAnimeMesh(bogie, new THREE.BoxGeometry(0.22, 0.20, 0.14), trainBogieMat, {
            position: new THREE.Vector3(wx, 0.0, fz * 1.04),
            useTrainClip: true,
            outline: false
          });
          addAnimeMesh(bogie, new THREE.BoxGeometry(0.10, 0.18, 0.08), trainWheelHubMat, {
            position: new THREE.Vector3(wx + (wx > 0 ? -0.26 : 0.26), 0.0, fz * 0.88),
            useTrainClip: true,
            outline: false
          });
        });
      });

      [-0.58, 0.58].forEach((wx) => {
        const wheelsetGroup = new THREE.Group();
        wheelsetGroup.position.set(wx, 0.0, 0);
        bogie.add(wheelsetGroup);

        addAnimeMesh(wheelsetGroup, new THREE.CylinderGeometry(0.055, 0.055, 1.38, 10), trainBogieMat, {
          rotation: new THREE.Euler(Math.PI / 2, 0, 0),
          useTrainClip: true,
          outline: false
        });

        [-0.56, 0.56].forEach((wz) => {
          const wUnit = new THREE.Group();
          wUnit.position.set(0, 0, wz);
          wheelsetGroup.add(wUnit);

          addAnimeMesh(wUnit, new THREE.CylinderGeometry(0.30, 0.30, 0.095, 20), trainWheelSteelMat, {
            rotation: new THREE.Euler(Math.PI / 2, 0, 0),
            useTrainClip: true,
            outline: false
          });
          addAnimeMesh(wUnit, new THREE.CylinderGeometry(0.335, 0.335, 0.024, 20), trainWheelSteelMat, {
            position: new THREE.Vector3(0, 0, wz > 0 ? -0.048 : 0.048),
            rotation: new THREE.Euler(Math.PI / 2, 0, 0),
            useTrainClip: true,
            outline: false
          });
          addAnimeMesh(wUnit, new THREE.CylinderGeometry(0.23, 0.23, 0.105, 16), trainBogieMat, {
            rotation: new THREE.Euler(Math.PI / 2, 0, 0),
            useTrainClip: true,
            outline: false
          });
          addAnimeMesh(wUnit, new THREE.CylinderGeometry(0.085, 0.085, 0.125, 12), trainWheelSteelMat, {
            rotation: new THREE.Euler(Math.PI / 2, 0, 0),
            useTrainClip: true,
            outline: false
          });
          for (let h = 0; h < 4; h++) {
            const hang = (h / 4) * Math.PI * 2;
            addAnimeMesh(wUnit, new THREE.CylinderGeometry(0.036, 0.036, 0.115, 8), trainWheelSteelMat, {
              position: new THREE.Vector3(Math.cos(hang) * 0.155, Math.sin(hang) * 0.155, 0),
              rotation: new THREE.Euler(Math.PI / 2, 0, 0),
              useTrainClip: true,
              outline: false
            });
          }
        });
        trainWheels.push(wheelsetGroup);
      });
    });

    const bodyGroup = new THREE.Group();
    car.add(bodyGroup);
    trainCarBodies.push(bodyGroup);

    addAnimeMesh(bodyGroup, new THREE.BoxGeometry(carLen, 0.18, carW), trainBogieMat, {
      position: new THREE.Vector3(0, 0.58, 0),
      useTrainClip: true
    });
    addAnimeMesh(bodyGroup, new THREE.BoxGeometry(carLen - 0.16, 0.06, carW - 0.16), trainFloorMat, {
      position: new THREE.Vector3(0, 0.76, 0),
      useTrainClip: true,
      outline: false
    });

    [-0.78, 0.78].forEach((sz) => {
      [-1.55, 1.55].forEach((sx) => {
        addAnimeMesh(bodyGroup, new THREE.BoxGeometry(1.85, 0.36, 0.42), trainSeatMat, {
          position: new THREE.Vector3(sx, 0.96, sz),
          useTrainClip: true,
          outline: false
        });
      });
      addAnimeMesh(bodyGroup, new THREE.BoxGeometry(0.95, 0.36, 0.42), trainPrioritySeatMat, {
        position: new THREE.Vector3(isLeadEast ? -3.85 : 3.85, 0.96, sz),
        useTrainClip: true,
        outline: false
      });
      addAnimeMesh(bodyGroup, new THREE.BoxGeometry(carLen - 1.2, 0.04, 0.32), trainFloorMat, {
        position: new THREE.Vector3(0, 2.38, sz * 0.92),
        useTrainClip: true,
        outline: false
      });
      for (let hx = -3.6; hx <= 3.6; hx += 0.55) {
        addAnimeMesh(bodyGroup, new THREE.TorusGeometry(0.055, 0.012, 4, 3), trainCreamMat, {
          position: new THREE.Vector3(hx, 2.24, sz * 0.72),
          useTrainClip: true,
          outline: false
        });
      }
    });

    [-1, 1].forEach((zSide) => {
      addAnimeMesh(bodyGroup, new THREE.BoxGeometry(carLen, 0.34, 0.08), trainCreamMat, {
        position: new THREE.Vector3(0, 2.66, zSide * (halfW - 0.04)),
        useTrainClip: true
      });
      // Upper frieze anime wrapping banner along the top of the car
      addAnimeMesh(bodyGroup, new THREE.BoxGeometry(carLen - 0.16, 0.28, 0.015), carWrap.sideMat, {
        position: new THREE.Vector3(0, 2.66, zSide * (halfW + 0.008)),
        useTrainClip: true,
        outline: false
      });

      [
        [-4.12, 0.92],
        [-1.55, 1.98],
        [ 1.55, 1.98],
        [ 4.12, 0.92]
      ].forEach(([segX, segLen]) => {
        addAnimeMesh(bodyGroup, new THREE.BoxGeometry(segLen, 0.76, 0.08), trainBodyGreenMat, {
          position: new THREE.Vector3(segX, 1.09, zSide * (halfW - 0.04)),
          useTrainClip: true
        });
        // Full-color Itasha anime mural wrap on the lower side body panels
        addAnimeMesh(bodyGroup, new THREE.BoxGeometry(segLen - 0.04, 0.72, 0.015), carWrap.sideMat, {
          position: new THREE.Vector3(segX, 1.09, zSide * (halfW + 0.008)),
          useTrainClip: true,
          outline: false
        });
        addAnimeMesh(bodyGroup, new THREE.BoxGeometry(segLen, 0.12, 0.085), trainCreamMat, {
          position: new THREE.Vector3(segX, 1.52, zSide * (halfW - 0.04)),
          useTrainClip: true,
          outline: false
        });
        const winPane = new THREE.Mesh(new THREE.PlaneGeometry(segLen - 0.12, 0.92), trainWinMat);
        winPane.position.set(segX, 2.04, zSide * (halfW - 0.02));
        if (zSide < 0) winPane.rotation.y = Math.PI;
        winPane.renderOrder = 3;
        bodyGroup.add(winPane);
      });

      [-3.1, 0.0, 3.1].forEach((doorX) => {
        addAnimeMesh(bodyGroup, new THREE.BoxGeometry(0.025, 1.88, 0.055), trainBogieMat, {
          position: new THREE.Vector3(doorX, 1.66, zSide * (halfW - 0.05)),
          useTrainClip: true,
          outline: false
        });

        [-1, 1].forEach((leafDir) => {
          const leafGroup = new THREE.Group();
          const baseLeafX = doorX + leafDir * 0.27;
          leafGroup.position.set(baseLeafX, 0, zSide * (halfW - 0.05));
          bodyGroup.add(leafGroup);

          addAnimeMesh(leafGroup, new THREE.BoxGeometry(0.53, 0.98, 0.045), trainBodyGreenMat, {
            position: new THREE.Vector3(0, 1.20, 0),
            useTrainClip: true
          });
          // Anime character sticker on each sliding door leaf
          addAnimeMesh(leafGroup, new THREE.BoxGeometry(0.47, 0.88, 0.015), carWrap.doorMat, {
            position: new THREE.Vector3(0, 1.20, zSide * 0.028),
            useTrainClip: true,
            outline: false
          });
          addAnimeMesh(leafGroup, new THREE.BoxGeometry(0.05, 1.88, 0.055), trainCreamMat, {
            position: new THREE.Vector3(leafDir * 0.24, 1.66, 0),
            useTrainClip: true,
            outline: false
          });
          const dWin = new THREE.Mesh(new THREE.PlaneGeometry(0.44, 0.78), trainWinMat);
          dWin.position.set(0, 2.16, zSide * 0.012);
          if (zSide < 0) dWin.rotation.y = Math.PI;
          dWin.renderOrder = 3;
          leafGroup.add(dWin);

          if (zSide > 0) {
            trainSlidingDoors.push({
              group: leafGroup,
              baseX: baseLeafX,
              dir: leafDir
            });
          }
        });
      });
    });

    addAnimeMesh(bodyGroup, new THREE.BoxGeometry(carLen, 0.18, carW - 0.12), trainRoofMat, {
      position: new THREE.Vector3(0, 2.90, 0),
      useTrainClip: true
    });
    [-2.1, 2.1].forEach((acX) => {
      addAnimeMesh(bodyGroup, new THREE.BoxGeometry(1.65, 0.22, 1.18), trainCreamMat, {
        position: new THREE.Vector3(acX, 3.08, 0),
        useTrainClip: true
      });
    });

    const cabSign = isLeadEast ? 1 : -1;
    const cabX = cabSign * (carLen / 2 + 0.12);
    addAnimeMesh(bodyGroup, new THREE.BoxGeometry(0.28, 1.05, carW), trainBodyGreenMat, {
      position: new THREE.Vector3(cabX, 1.24, 0),
      useTrainClip: true
    });
    addAnimeMesh(bodyGroup, new THREE.BoxGeometry(0.22, 0.38, carW), trainCreamMat, {
      position: new THREE.Vector3(cabX - cabSign * 0.03, 2.66, 0),
      useTrainClip: true
    });
    const cabWindshield = new THREE.Mesh(new THREE.PlaneGeometry(carW - 0.24, 0.76), trainWinMat);
    cabWindshield.rotation.y = cabSign > 0 ? Math.PI / 2 : -Math.PI / 2;
    cabWindshield.position.set(cabX + cabSign * 0.11, 2.14, 0);
    cabWindshield.renderOrder = 3;
    bodyGroup.add(cabWindshield);

    [-0.68, 0.68].forEach((lz) => {
      addAnimeMesh(bodyGroup, new THREE.BoxGeometry(0.08, 0.18, 0.34), makeToonMat(isLeadEast ? 0xfffde7 : 0xff1744, {
        emissive: isLeadEast ? 0xffe082 : 0xff1744,
        emissiveIntensity: 0.95,

  function updateMikotoLightningCage(cx, cy, cz, elapsed) {
    mikotoLightningCage.position.set(cx, cy, cz);
    for (let b = 0; b < mikotoBoltLines.length; b++) {
      const bolt = mikotoBoltLines[b];
      const posAttr = bolt.geo.attributes.position;
      const baseAng = bolt.baseAngle + elapsed * 7.5;
      for (let s = 0; s <= bolt.segCount; s++) {
        const u = s / bolt.segCount;
        const ang = baseAng + u * 2.2 + Math.sin(elapsed * 42.0 + b * 3.1 + s * 4.7) * 0.45;
        const rad = 0.28 + Math.sin(u * Math.PI) * 0.28 + Math.cos(elapsed * 36.0 + s * 5.3) * 0.09;
        const py = 0.08 + u * 1.15 + Math.sin(elapsed * 48.0 + b + s * 2.3) * 0.06;
        posAttr.setXYZ(s, Math.cos(ang) * rad, py, Math.sin(ang) * rad);
      }
      posAttr.needsUpdate = true;
    }
  }

  function updateBoardingEffects(delta) {
    for (let i = 0; i < boardingFxPool.length; i++) {
      const fx = boardingFxPool[i];
      if (!fx.active) continue;
      fx.age += delta;
      const u = fx.age / fx.life;
      if (u >= 1.0) {
        fx.active = false;
        fx.puffSprite.visible = false;
        fx.sigSprite.visible = false;
        fx.streakMesh.visible = false;
        fx.ringMesh.visible = false;
        continue;
      }

      if (fx.kind === 'puff') {
        fx.puffSprite.position.x += fx.vx * delta;
        fx.puffSprite.position.y += fx.vy * delta;
        fx.puffSprite.position.z += fx.vz * delta;
        fx.puffSprite.scale.setScalar(fx.baseScale * (1.0 + u * 1.35));
        fx.puffSprite.material.opacity = (1.0 - u) * 0.85;
      } else if (fx.kind === 'signature') {
        fx.sigSprite.position.x += fx.vx * delta;
        fx.sigSprite.position.y += fx.vy * delta;
        fx.sigSprite.position.z += fx.vz * delta;
        fx.sigSprite.scale.setScalar(fx.baseScale * (0.85 + Math.sin(u * Math.PI) * 0.55));
        fx.sigSprite.material.opacity = (1.0 - Math.pow(u, 1.4)) * 0.95;
      } else if (fx.kind === 'streak') {
        fx.streakMesh.position.x += fx.vx * delta;
        fx.streakMesh.position.y += fx.vy * delta;
        fx.streakMesh.position.z += fx.vz * delta;
        fx.streakMesh.scale.set(fx.baseScale * (1.15 - u * 0.4), 1.0 - u * 0.5, 1);
        fx.streakMesh.material.opacity = (1.0 - u) * 0.9;
      } else if (fx.kind === 'ring') {
        fx.ringMesh.scale.setScalar(fx.baseScale + u * 2.1);
        fx.ringMesh.material.opacity = (1.0 - u) * 0.85;
      }
    }
  }

  function makeSoftParticleTexture(size, innerColor, outerColor) {
    return createCanvasTexture(size, size, (ctx, w, h) => {
      const gradient = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      gradient.addColorStop(0, innerColor);
      gradient.addColorStop(0.38, innerColor);
      gradient.addColorStop(0.72, outerColor);
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
    });
  }

  function makeSnowflakeTexture(size = 160) {
    return createCanvasTexture(size, size, (ctx, w, h) => {
      const cx = w / 2;
      const cy = h / 2;
      ctx.translate(cx, cy);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.strokeStyle = 'rgba(250,253,255,0.98)';
      ctx.shadowColor = 'rgba(210,238,255,0.9)';
      ctx.shadowBlur = 3;
      for (let arm = 0; arm < 6; arm++) {
        ctx.save();
        ctx.rotate((arm / 6) * Math.PI * 2);
        ctx.lineWidth = 6.4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -w * 0.38);
        ctx.stroke();

        [0.16, 0.25, 0.33].forEach((distance, index) => {
          const y = -w * distance;
          const branch = w * (0.085 + index * 0.012);
          ctx.lineWidth = 4.3;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(-branch, y - branch * 0.72);
          ctx.moveTo(0, y);
          ctx.lineTo(branch, y - branch * 0.72);
          ctx.stroke();
        });
        ctx.restore();

      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.beginPath();
      ctx.arc(0, 0, w * 0.048, 0, Math.PI * 2);

      ctx.beginPath();
      ctx.moveTo(-halfBase, -w * 0.10);
      ctx.lineTo(0, -len);
      ctx.lineTo(halfBase, -w * 0.10);
      ctx.closePath();
      ctx.fill();

    `,
    fragmentShader: `
      uniform sampler2D uMap;
      uniform float uOpacity;
      uniform float uPhaseAngle;
      varying vec2 vUv;
      void main() {
        if (uOpacity < 0.01) discard;
        float r = length(vUv);

        // Soft outer atmospheric lunar corona halo
        float corona = exp(-max(0.0, r - 0.36) * 5.2) * 0.52;
        if (r > 0.38) {
          gl_FragColor = vec4(vec3(0.82, 0.90, 1.0), corona * uOpacity);

    const baseSun = SUN_BASE_ANCHORS[atmosphereState.time] || SUN_BASE_ANCHORS.day;
    _celestialTarget.set(

      baseSun.y + Math.sin(elapsed * 0.06) * 1.4,
      baseSun.z
    );
    sunSprite.position.lerp(_celestialTarget, 0.08);

    _celestialTarget.set(
      MOON_BASE_ANCHOR.x + Math.sin(elapsed * 0.04) * 7.2 - (orbitProgress - 0.5) * 6.0,
      MOON_BASE_ANCHOR.y + Math.cos(elapsed * 0.055) * 1.35,
      MOON_BASE_ANCHOR.z
