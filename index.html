    new THREE.Euler(0.06, 0, 0)
  );

  const snowGroundMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uAmount: { value: 0 },
      uTime: globalUniforms.uTime
    },
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    polygonOffset: true,
    polygonOffsetFactor: -1,
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform float uAmount;
      uniform float uTime;
      varying vec3 vWorldPos;

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 345.45));
        p += dot(p, p + 34.345);
        return fract(p.x * p.y);
      }

      float valueNoise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
          mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x),
          f.y
        );
      }

      void main() {
        float n = valueNoise(vWorldPos.xz * 0.72) * 0.62
                + valueNoise(vWorldPos.xz * 1.85 + 11.0) * 0.38;
        float threshold = mix(0.92, -0.12, clamp(uAmount, 0.0, 1.0));
        float cover = smoothstep(threshold, threshold + 0.32, n);
        float film = smoothstep(0.25, 1.0, uAmount) * 0.16;
        float sparkle = pow(
          max(0.0, sin(vWorldPos.x * 7.0 + vWorldPos.z * 5.0 + uTime * 0.7)),
          24.0
        ) * 0.08 * uAmount;
        vec3 col = vec3(0.85, 0.91, 0.98) + sparkle;
        float alpha = (film + cover * 0.46) * (0.65 + uAmount * 0.35);
        if (alpha < 0.008) discard;
        gl_FragColor = vec4(col, alpha);
      }
    `
  });

  function addWeatherSurface(parent, width, depth, x, y, z, material) {
    const geometry = new THREE.PlaneGeometry(width, depth);
    geometry.rotateX(-Math.PI / 2);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    mesh.renderOrder = 2;
    parent.add(mesh);
    return mesh;
  }

  const snowSurfaceSpecs = [
    [37.8, 25.3, 0, 0.256, 6.2],
    [4.7, 12.9, 14.0, 0.256, -12.5],
    [29.7, 14.5, -3.7, 0.386, 1.9],
    [30.1, 2.1, -3.8, 0.386, 17.8],
    [2.3, 2.1, 17.7, 0.386, 17.8],
    [27.1, 4.15, -3.3, 1.387, (PLATFORM_NORTH_EDGE + PLATFORM_SOUTH_EDGE) / 2]
  ];
  snowSurfaceSpecs.forEach(([width, depth, x, y, z]) => {
    addWeatherSurface(dioramaGroup, width, depth, x, y, z, snowGroundMaterial);
  });
  // Wet light-refraction & reflection sheen on both the cream brick plaza/platform and the roadway
  const wetGroundMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uWetness: { value: 0 },
      uNight: { value: 0 },
      uTime: globalUniforms.uTime
    },
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending,
    side: THREE.DoubleSide,
    polygonOffset: true,
    polygonOffsetFactor: -1,
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform float uWetness;
      uniform float uNight;
      uniform float uTime;
      varying vec3 vWorldPos;

      float hash21(vec2 p) {
        p = fract(p * vec2(127.1, 311.7));
        p += dot(p, p + 27.31);
        return fract(p.x * p.y);
      }

      float valueNoise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
          mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x),
          f.y
        );
      }

      void main() {
        if (uWetness < 0.08) discard;
        // Localized organic water-film patches on the ground
        float patchNoise = valueNoise(vWorldPos.xz * 0.42) * 0.65
                         + valueNoise(vWorldPos.xz * 1.15 + 7.3) * 0.35;
        float patchMask = smoothstep(0.50, 0.78, patchNoise);
        if (patchMask < 0.01) discard;

        vec2 tileGrid = abs(fract(vWorldPos.xz * 1.45) - 0.5);
        float tileBevel = smoothstep(0.42, 0.49, max(tileGrid.x, tileGrid.y));
        float caustics = sin(vWorldPos.x * 2.2 + uTime * 1.1) * cos(vWorldPos.z * 2.2 - uTime * 0.85) * 0.5 + 0.5;

        vec3 dayRefraction = mix(
          vec3(0.72, 0.86, 0.98),
          vec3(1.00, 0.88, 0.94),
          caustics
        );
        vec3 nightRefraction = mix(
          vec3(0.30, 0.52, 0.84),
          vec3(1.00, 0.80, 0.46),
          caustics
        );
        vec3 col = mix(dayRefraction, nightRefraction, uNight);
        col += vec3(0.18, 0.22, 0.28) * tileBevel;

        float isRoad = step(vWorldPos.y, 0.31);
        float roadScale = mix(1.0, 0.68, isRoad);
        float alpha = uWetness * patchMask * (0.16 + caustics * 0.12 + tileBevel * 0.08 * (1.0 - isRoad)) * roadScale;
        if (alpha < 0.008) discard;
        gl_FragColor = vec4(col, alpha);
      }
    `
  });

  // Apply wet light reflection to both the plaza/walkways/platform and the asphalt roadway
  snowSurfaceSpecs.forEach(([width, depth, x, y, z]) => {
    addWeatherSurface(
      dioramaGroup,
      width,
      depth,
      x,
      y + 0.0015,
      z,
      wetGroundMaterial
    );
  });

  // Footprints are a fixed-size ring buffer. Snow depth controls visibility.
  const footprintTexture = createCanvasTexture(128, 128, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(20,34,47,0.96)';
    ctx.beginPath();
    ctx.ellipse(w * 0.50, h * 0.38, w * 0.19, h * 0.24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(w * 0.50, h * 0.76, w * 0.14, h * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(247,252,255,0.82)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(w * 0.50, h * 0.38, w * 0.24, h * 0.29, 0, 0, Math.PI * 2);
    ctx.stroke();
  });
  const footprintGeometry = new THREE.PlaneGeometry(0.18, 0.34);
  footprintGeometry.rotateX(-Math.PI / 2);
  const footprintMaterial = new THREE.MeshBasicMaterial({
    map: footprintTexture,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  // Big enough to keep a whole heart-shaped lap of whaleChan footprints alive at once
  // (the outline is ~15.3 m long, one print every 0.28 m ≈ 55 prints per lap).
  const footprintCapacity = 400;
  const footprintMesh = new THREE.InstancedMesh(
    footprintGeometry,
    footprintMaterial,
    footprintCapacity
  );
  footprintMesh.frustumCulled = false;
  footprintMesh.renderOrder = 10;
  footprintMesh.count = footprintCapacity;
  for (let i = 0; i < footprintCapacity; i++) {
    dummy.position.set(0, -20, 0);
    dummy.scale.setScalar(0);
    dummy.updateMatrix();
    footprintMesh.setMatrixAt(i, dummy.matrix);
  }
  footprintMesh.instanceMatrix.needsUpdate = true;
  footprintMesh.visible = false;
  dioramaGroup.add(footprintMesh);
  let footprintCursor = 0;
  let footprintSpawnCount = 0;

  // Vehicle tire tracks in the snow (parallel wheel ruts with tread impressions left by passing cars)
  const tireTrackTexture = createCanvasTexture(64, 128, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0.0, 'rgba(247, 252, 255, 0.0)');
    grad.addColorStop(0.15, 'rgba(245, 250, 255, 0.78)');
    grad.addColorStop(0.32, 'rgba(28, 42, 56, 0.88)');
    grad.addColorStop(0.68, 'rgba(28, 42, 56, 0.88)');
    grad.addColorStop(0.85, 'rgba(245, 250, 255, 0.78)');
    grad.addColorStop(1.0, 'rgba(247, 252, 255, 0.0)');
    ctx.fillStyle = grad;
    ctx.fillRect(4, 0, w - 8, h);

    ctx.fillStyle = 'rgba(15, 24, 34, 0.55)';
    for (let y = 6; y < h; y += 16) {
      ctx.fillRect(14, y, w - 28, 6);
    }
  });
  const tireTrackGeometry = new THREE.PlaneGeometry(0.22, 0.52);
  tireTrackGeometry.rotateX(-Math.PI / 2);
  const tireTrackMaterial = new THREE.MeshBasicMaterial({
    map: tireTrackTexture,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  const tireTrackCapacity = 280;
  const tireTrackMesh = new THREE.InstancedMesh(
    tireTrackGeometry,
    tireTrackMaterial,
    tireTrackCapacity
  );
  tireTrackMesh.frustumCulled = false;
  tireTrackMesh.renderOrder = 9;
  tireTrackMesh.count = tireTrackCapacity;
  for (let i = 0; i < tireTrackCapacity; i++) {
    dummy.position.set(0, -20, 0);
    dummy.scale.setScalar(0);
    dummy.updateMatrix();
    tireTrackMesh.setMatrixAt(i, dummy.matrix);
  }
  tireTrackMesh.instanceMatrix.needsUpdate = true;
  tireTrackMesh.visible = false;
  dioramaGroup.add(tireTrackMesh);
  let tireTrackCursor = 0;

  const trackedRoadVehicles = [taxiVehicle, crossingCar1, crossingCar2];

  function spawnVehicleTireTracks(x, y, z, heading, wheelTrackHalfWidth = 0.55) {
    [-1, 1].forEach((side) => {
      const lateral = side * wheelTrackHalfWidth;
      dummy.position.set(
        x + Math.cos(heading) * lateral,
        y + 0.011,
        z - Math.sin(heading) * lateral
      );
      dummy.rotation.set(0, heading, 0);
      dummy.scale.set(1.0, 1.0, 1.0);
      dummy.updateMatrix();
      tireTrackMesh.setMatrixAt(tireTrackCursor, dummy.matrix);
      tireTrackCursor = (tireTrackCursor + 1) % tireTrackCapacity;
    });
    tireTrackMesh.instanceMatrix.needsUpdate = true;
  }

  const splashTexture = createCanvasTexture(128, 128, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.shadowColor = 'rgba(100,205,255,0.75)';
    ctx.shadowBlur = 5;
    ctx.strokeStyle = 'rgba(94,205,255,0.96)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.ellipse(w / 2, h * 0.76, w * 0.29, h * 0.10, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(205,243,255,0.98)';
    [
      [40, 64, 4], [58, 47, 5], [76, 39, 4], [94, 57, 5], [62, 78, 3]
    ].forEach(([x, y, r]) => {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    });
  });
  const splashPool = [];
  const splashPoolSize = 42;
  for (let i = 0; i < splashPoolSize; i++) {
    const material = new THREE.SpriteMaterial({
      map: splashTexture,
      color: 0x78d8ff,
      transparent: true,
      opacity: 0,
      blending: THREE.NormalBlending,
      depthWrite: false
    });
    const sprite = new THREE.Sprite(material);
    sprite.visible = false;
    sprite.renderOrder = 8;
    sprite.userData.life = 0;
    dioramaGroup.add(sprite);
    splashPool.push(sprite);
  }
  let splashCursor = 0;
  let splashSpawnCount = 0;

  function spawnFootprint(actor, x, y, z, heading) {
    const trace = actor.weatherTrace;
    const lateral = trace.footSide ? 0.078 : -0.078;
    trace.footSide = !trace.footSide;
    dummy.position.set(
      x + Math.cos(heading) * lateral,
      y + 0.012,
      z - Math.sin(heading) * lateral
    );
    dummy.rotation.set(0, heading, 0);
    dummy.scale.set(0.88, 1.0, 0.88);
    dummy.updateMatrix();
    footprintMesh.setMatrixAt(footprintCursor, dummy.matrix);
    footprintCursor = (footprintCursor + 1) % footprintCapacity;
    footprintSpawnCount++;
    footprintMesh.instanceMatrix.needsUpdate = true;
  }

  function spawnRainSplash(x, y, z) {
    const splash = splashPool[splashCursor];
    splashCursor = (splashCursor + 1) % splashPoolSize;
    splashSpawnCount++;
    const baseScale = 0.36 + Math.random() * 0.12;
    splash.position.set(
      x + (Math.random() - 0.5) * 0.20,
      y + 0.14,
      z + (Math.random() - 0.5) * 0.20
    );
    splash.scale.set(baseScale * 1.16, baseScale, 1);
    splash.material.opacity = 0.94;
    splash.visible = true;
    splash.userData.life = 0.5;
  }

  function updateFootprintAndSplash(delta) {
    footprintMesh.visible = weatherAccumulation.snow > 0.12;
    footprintMaterial.opacity = smoothstep(0.12, 0.72, weatherAccumulation.snow) * 0.92;
    tireTrackMesh.visible = weatherAccumulation.snow > 0.12;
    tireTrackMaterial.opacity = smoothstep(0.12, 0.72, weatherAccumulation.snow) * 0.86;

    // Spawn dual tire tracks in the snow behind moving road vehicles
    for (let vIdx = 0; vIdx < trackedRoadVehicles.length; vIdx++) {
      const veh = trackedRoadVehicles[vIdx];
      const vGroup = veh.group;
      if (!veh.snowTrace) {
        veh.snowTrace = {
          previous: new THREE.Vector3(),
          initialized: false,
          distance: 0
        };
      }
      const vTrace = veh.snowTrace;
      if (!vGroup.visible || Math.abs(vGroup.position.x) > HALF_BASE - 0.3 || Math.abs(vGroup.position.z) > HALF_BASE - 0.3) {
        vTrace.initialized = false;
        continue;
      }
      if (!vTrace.initialized) {
        vTrace.previous.copy(vGroup.position);
        vTrace.initialized = true;
        vTrace.distance = 0;
        continue;
      }
      const vdx = vGroup.position.x - vTrace.previous.x;
      const vdz = vGroup.position.z - vTrace.previous.z;
      const vDist = Math.hypot(vdx, vdz);
      if (vDist > 0.001 && vDist < 1.5) {
        vTrace.distance += vDist;
        if (weatherAccumulation.snow > 0.14 && vTrace.distance > 0.34) {
          const vHeading = Math.atan2(vdx, vdz);
          spawnVehicleTireTracks(
            vGroup.position.x,
            0.256,
            vGroup.position.z,
            vHeading,
            0.54 * (vGroup.scale.x || 0.9)
          );
          vTrace.distance = 0;
        }
      }
      vTrace.previous.copy(vGroup.position);
    }

    for (const actor of chibiDynamicActors) {
      const group = actor.group;
      if (!actor.weatherTrace) {
        actor.weatherTrace = {
          previous: new THREE.Vector3(),
          initialized: false,
          distance: 0,
          footSide: false,
          splashCooldown: 0
        };
      }
      const trace = actor.weatherTrace;
      trace.splashCooldown = Math.max(0, trace.splashCooldown - delta);
      if (!group.visible) {
        trace.initialized = false;
        continue;
      }

      if (!trace.initialized) {
        trace.previous.copy(group.position);
        trace.initialized = true;
        trace.distance = 0;
        continue;
      }

      const dx = group.position.x - trace.previous.x;
      const dz = group.position.z - trace.previous.z;
      const distance = Math.hypot(dx, dz);
      const onGround = actor.groundedFootsteps !== false && group.position.y < 1.42;
      if (distance > 0.0005 && distance < 1.2 && onGround) {
        const heading = Math.atan2(dx, dz);
        trace.distance += distance;
        if (weatherAccumulation.snow > 0.14 && trace.distance > 0.28) {
          spawnFootprint(
            actor,
            group.position.x,
            group.position.y,
            group.position.z,
            heading
          );
          trace.distance = 0;
        }
        if (weatherAccumulation.wetness > 0.20 && trace.splashCooldown <= 0) {
          spawnRainSplash(group.position.x, group.position.y, group.position.z);
          trace.splashCooldown = 0.34 + Math.random() * 0.16;
        }
      }
      trace.previous.copy(group.position);
    }

    for (const splash of splashPool) {
      if (!splash.visible) {
        continue;
      }
      splash.userData.life -= delta;
      if (splash.userData.life <= 0) {
        splash.visible = false;
        splash.material.opacity = 0;
        continue;
      }
      const lifeRatio = splash.userData.life / 0.5;
      splash.position.y += delta * 0.42;
      splash.scale.x *= 1 + delta * 1.65;
      splash.scale.y *= 1 + delta * 1.25;
      splash.material.opacity = lifeRatio * 0.94;
    }
  }

  function resetRainDrop(drop, fromTop = false) {
    drop.x = (Math.random() - 0.5) * weatherHalfWidth * 2;
    drop.y = fromTop ? weatherTop + Math.random() * 5 : 1 + Math.random() * weatherTop;
    drop.z = (Math.random() - 0.5) * weatherHalfDepth * 2;
  }

  function resetSnowFlake(flake, fromTop = false) {
    flake.x = (Math.random() - 0.5) * weatherHalfWidth * 2;
    flake.y = fromTop ? weatherTop + Math.random() * 4 : 0.8 + Math.random() * weatherTop;
    flake.z = (Math.random() - 0.5) * weatherHalfDepth * 2;
  }

  function updateWeatherParticles(delta, elapsed) {
    rainSystem.visible = atmosphereCurrent.rain > 0.012;
    rainMaterial.opacity = 0.58 * atmosphereCurrent.rain;
    if (rainSystem.visible) {
      for (let i = 0; i < rainDropCount; i++) {
        const drop = rainDrops[i];
        drop.y -= drop.speed * (0.72 + atmosphereCurrent.rain * 0.28) * delta;
        drop.x -= (1.8 + Math.sin(elapsed * 0.7 + i) * 0.18) * delta;
        drop.z += 0.24 * delta;
        if (drop.y < 0.22 || drop.x < -weatherHalfWidth - 2) {
          resetRainDrop(drop, true);
        }
        const offset = i * 6;
        rainPositions[offset] = drop.x;
        rainPositions[offset + 1] = drop.y;
        rainPositions[offset + 2] = drop.z;
        rainPositions[offset + 3] = drop.x + 0.11;
        rainPositions[offset + 4] = drop.y + drop.length;
        rainPositions[offset + 5] = drop.z - 0.035;
      }
      rainPositionAttr.needsUpdate = true;
    }

    snowSystem.visible = atmosphereCurrent.snow > 0.012;
    snowMaterial.opacity = 0.82 * atmosphereCurrent.snow;
    if (snowSystem.visible) {
      for (let i = 0; i < snowCount; i++) {
        const flake = snowFlakes[i];
        flake.y -= flake.speed * delta;
        flake.x += (
          Math.sin(elapsed * 0.72 + flake.phase) * flake.drift +
          0.20
        ) * delta;
        flake.z += Math.cos(elapsed * 0.54 + flake.phase) * flake.drift * 0.55 * delta;
        if (flake.y < 0.26 || flake.x > weatherHalfWidth + 2) {
          resetSnowFlake(flake, true);
        }
        const offset = i * 3;
        snowPositions[offset] = flake.x;
        snowPositions[offset + 1] = flake.y;
        snowPositions[offset + 2] = flake.z;
      }
      snowPositionAttr.needsUpdate = true;
    }
  }

  function updateAtmosphere(delta, elapsed) {
    const blend = 1.0 - Math.exp(-delta * 2.8);
    skyMat.uniforms.uHorizon.value.lerp(atmosphereTarget.sky[0], blend);
    skyMat.uniforms.uMidSky.value.lerp(atmosphereTarget.sky[1], blend);
    skyMat.uniforms.uZenith.value.lerp(atmosphereTarget.sky[2], blend);
    skyMat.uniforms.uOvercastColor.value.lerp(atmosphereTarget.cloudColor, blend);
    skyMat.uniforms.uTime.value = elapsed;
    skyMat.uniforms.uOvercast.value +=
      (atmosphereTarget.overcast - skyMat.uniforms.uOvercast.value) * blend;

    hemiLight.color.lerp(atmosphereTarget.hemiSky, blend);
    hemiLight.groundColor.lerp(atmosphereTarget.hemiGround, blend);
    sunLight.color.lerp(atmosphereTarget.sunColor, blend);
    fillLight.color.lerp(atmosphereTarget.fillColor, blend);
    sunMaterial.color.lerp(atmosphereTarget.sunColor, blend);
    sunLight.position.lerp(atmosphereTarget.sunPosition, blend);
    sceneFog.color.lerp(atmosphereTarget.fogColor, blend);

    atmosphereCurrent.sunIntensity +=
      (atmosphereTarget.sunIntensity - atmosphereCurrent.sunIntensity) * blend;
    atmosphereCurrent.hemiIntensity +=
      (atmosphereTarget.hemiIntensity - atmosphereCurrent.hemiIntensity) * blend;
    atmosphereCurrent.fillIntensity +=
      (atmosphereTarget.fillIntensity - atmosphereCurrent.fillIntensity) * blend;
    atmosphereCurrent.lampGlass +=
      (atmosphereTarget.lampGlass - atmosphereCurrent.lampGlass) * blend;
    atmosphereCurrent.lampCore +=
      (atmosphereTarget.lampCore - atmosphereCurrent.lampCore) * blend;
    atmosphereCurrent.lampGlow +=
      (atmosphereTarget.lampGlow - atmosphereCurrent.lampGlow) * blend;
    atmosphereCurrent.lampLight +=
      (atmosphereTarget.lampLight - atmosphereCurrent.lampLight) * blend;
    atmosphereCurrent.interiorA +=
      (atmosphereTarget.interiorA - atmosphereCurrent.interiorA) * blend;
    atmosphereCurrent.interiorB +=
      (atmosphereTarget.interiorB - atmosphereCurrent.interiorB) * blend;
    atmosphereCurrent.stars +=
      (atmosphereTarget.stars - atmosphereCurrent.stars) * blend;
    atmosphereCurrent.nightness +=
      (atmosphereTarget.nightness - atmosphereCurrent.nightness) * blend;
    atmosphereCurrent.sunGlow +=
      (atmosphereTarget.sunGlow - atmosphereCurrent.sunGlow) * blend;
    atmosphereCurrent.moonGlow +=
      (atmosphereTarget.moonGlow - atmosphereCurrent.moonGlow) * blend;
    atmosphereCurrent.milkyWay +=
      (atmosphereTarget.milkyWay - atmosphereCurrent.milkyWay) * blend;
    atmosphereCurrent.fogNear +=
      (atmosphereTarget.fogNear - atmosphereCurrent.fogNear) * blend;
    atmosphereCurrent.fogFar +=
      (atmosphereTarget.fogFar - atmosphereCurrent.fogFar) * blend;
    atmosphereCurrent.rain +=
      (atmosphereTarget.rain - atmosphereCurrent.rain) * blend;
    atmosphereCurrent.snow +=
      (atmosphereTarget.snow - atmosphereCurrent.snow) * blend;

    if (atmosphereState.weather === 'snow') {
      weatherAccumulation.snow = Math.min(1.0, weatherAccumulation.snow + delta / 14.0);
    } else {
      weatherAccumulation.snow = Math.max(0.0, weatherAccumulation.snow - delta / 24.0);
    }
    if (atmosphereState.weather === 'rain') {
      weatherAccumulation.wetness = Math.min(
        1.0,
        weatherAccumulation.wetness + delta / 10.0
      );
    } else {
      weatherAccumulation.wetness = Math.max(
        0.0,
        weatherAccumulation.wetness - delta / 18.0
      );
    }

    sunLight.intensity = atmosphereCurrent.sunIntensity;
    hemiLight.intensity = atmosphereCurrent.hemiIntensity;
    fillLight.intensity = atmosphereCurrent.fillIntensity;
    sceneFog.near = atmosphereCurrent.fogNear;
    sceneFog.far = atmosphereCurrent.fogFar;
    lampGlassMat.emissiveIntensity = atmosphereCurrent.lampGlass;
    lampCoreMat.emissiveIntensity = atmosphereCurrent.lampCore;
    lampGlowMat.opacity = atmosphereCurrent.lampGlow;
    interiorLight1.intensity = atmosphereCurrent.interiorA;
    interiorLight2.intensity = atmosphereCurrent.interiorB;
    streetLampLights.forEach((light) => {
      light.intensity = atmosphereCurrent.lampLight;
    });
    starMaterial.opacity = atmosphereCurrent.stars;
    milkyWayMaterial.opacity = atmosphereCurrent.milkyWay;
    moonMaterial.uniforms.uOpacity.value = atmosphereCurrent.moonGlow * 0.98;
    sunMaterial.opacity = atmosphereCurrent.sunGlow;
    starField.visible = atmosphereCurrent.stars > 0.015;
    milkyWay.visible = atmosphereCurrent.milkyWay > 0.015;
    moonSprite.visible = atmosphereCurrent.moonGlow > 0.02;
    sunSprite.visible = atmosphereCurrent.sunGlow > 0.02;

    if (autoCyclePlaying) {
      timePhaseTimer += delta;
      weatherPhaseTimer += delta;
      if (timePhaseTimer >= AUTO_PERIOD_DURATION) {
        timePhaseTimer = 0.0;
        const curIdx = TIME_SEQUENCE.indexOf(atmosphereState.time);
        const nextTime = TIME_SEQUENCE[(curIdx + 1) % TIME_SEQUENCE.length];
        setAtmosphereState({ time: nextTime });
      }
      if (weatherPhaseTimer >= AUTO_PERIOD_DURATION) {
        weatherPhaseTimer = 0.0;
        const candidates = WEATHER_SEQUENCE.filter((w) => w !== atmosphereState.weather);
        const nextWeather = candidates[Math.floor(Math.random() * candidates.length)];
        setAtmosphereState({ weather: nextWeather });
      }
    }

    updateSkyDecorations(delta, elapsed);

    const snowVisual = smoothstep(0.015, 0.96, weatherAccumulation.snow);
    globalUniforms.uSnowCover.value = snowVisual;
    snowGroundMaterial.uniforms.uAmount.value = snowVisual;
    snowCapMaterial.opacity = snowVisual * 0.95;
    snowCapMeshes.forEach((mesh) => {
      mesh.visible = snowVisual > 0.018;
    });
    snowAccentMaterial.opacity = snowVisual * 0.96;
    snowAccentMeshes.forEach((mesh) => {
      mesh.visible = snowVisual > 0.018;
    });

    const wetVisual = smoothstep(0.01, 0.92, weatherAccumulation.wetness);
    wetGroundMaterial.uniforms.uWetness.value = wetVisual;
    wetGroundMaterial.uniforms.uNight.value = atmosphereCurrent.nightness;
    wetRoofMaterial.opacity = wetVisual * 0.24;
    wetRoofMeshes.forEach((mesh) => {
      mesh.visible = wetVisual > 0.015;
    });
    // Puddles are completely invisible on clear days and only appear after sustained rain accumulation!
    puddleUniforms.uRainWetness.value = wetVisual;
    puddleUniforms.uMoonReflection.value = wetVisual * atmosphereCurrent.nightness;
    puddleUniforms.uSnowCover.value = snowVisual;
    puddleMeshes.forEach((mesh) => {
      mesh.visible = wetVisual > 0.35;
    });

    fallingPetalMat.opacity = THREE.MathUtils.clamp(
      0.94 - atmosphereCurrent.rain * 0.47 - atmosphereCurrent.snow * 0.64,
      0.20,
      0.94
    );

    updateWeatherParticles(delta, elapsed);
  }

  function normalizeAtmosphereState(value) {
    return {
      time: atmosphereTimePresets[value && value.time] ? value.time : 'day',
      weather: atmosphereWeatherPresets[value && value.weather] ? value.weather : 'clear'
    };
  }

  function readSavedAtmosphereState() {
    try {
      return normalizeAtmosphereState(JSON.parse(localStorage.getItem('sakura-atmosphere') || '{}'));
    } catch {
      return { time: 'day', weather: 'clear' };
    }
  }

  function updateAtmosphereControls() {
    const time = atmosphereTimePresets[atmosphereState.time];
    const weather = atmosphereWeatherPresets[atmosphereState.weather];
    document.querySelectorAll('[data-time]').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.time === atmosphereState.time));
    });
    document.querySelectorAll('[data-weather]').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.weather === atmosphereState.weather));
    });
    const summary = document.getElementById('atmo-summary');
    const summaryIcon = document.getElementById('atmo-summary-icon');
    if (summary) {
      summary.textContent = `${weather.label} · ${time.label}`;
    }
    if (summaryIcon) {
      summaryIcon.textContent = weather.icon;
    }
    document.documentElement.style.background = time.body;
  }

  function setAtmosphereState(next, options = {}) {
    const normalized = normalizeAtmosphereState({
      ...atmosphereState,
      ...next
    });
    atmosphereState.time = normalized.time;
    atmosphereState.weather = normalized.weather;
    Object.assign(atmosphereTarget, buildAtmosphereTarget());
    updateAtmosphereControls();

    if (options.persist !== false) {
      try {
        localStorage.setItem('sakura-atmosphere', JSON.stringify(atmosphereState));
      } catch {
        // Ignore storage errors in restricted webviews.
      }
    }

    window.dispatchEvent(new CustomEvent('sakura:atmosphere-changed', {
      detail: { ...atmosphereState }
    }));
  }

  function initializeAtmosphereControls() {
    const controlRoot = document.getElementById('sakura-atmosphere');
    const trigger = document.getElementById('atmo-trigger');
    const playToggle = document.getElementById('atmo-play-toggle');
    const playIcon = document.getElementById('atmo-play-icon');
    const playLabel = document.getElementById('atmo-play-label');
    const closeButton = document.getElementById('atmo-close');
    if (!controlRoot || !trigger) {
      return;
    }

    const updatePlayButtonUI = () => {
      if (!playToggle) return;
      playToggle.setAttribute('aria-pressed', String(autoCyclePlaying));
      if (playIcon) playIcon.textContent = autoCyclePlaying ? '⏸' : '▶';
      if (playLabel) playLabel.textContent = autoCyclePlaying ? '自动流逝' : '已暂停';
    };

    if (playToggle) {
      playToggle.addEventListener('click', () => {
        autoCyclePlaying = !autoCyclePlaying;
        updatePlayButtonUI();
      });
      updatePlayButtonUI();
    }

    const setOpen = (open) => {
      controlRoot.classList.toggle('is-open', open);
      trigger.setAttribute('aria-expanded', String(open));
    };

    trigger.addEventListener('click', () => {
      setOpen(!controlRoot.classList.contains('is-open'));
    });
    closeButton.addEventListener('click', () => setOpen(false));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setOpen(false);
      }
    });
    controlRoot.addEventListener('click', (event) => {
      const timeButton = event.target.closest('[data-time]');
      const weatherButton = event.target.closest('[data-weather]');
      if (timeButton) {
        timePhaseTimer = 0.0;
        setAtmosphereState({ time: timeButton.dataset.time });
      } else if (weatherButton) {
        weatherPhaseTimer = 0.0;
        setAtmosphereState({ weather: weatherButton.dataset.weather });
      }
    });

    setAtmosphereState(readSavedAtmosphereState(), { persist: false });
  }

  Object.assign(atmosphereTarget, buildAtmosphereTarget());
  sunSprite.position.copy(SUN_BASE_ANCHORS[atmosphereState.time]);
  moonSprite.position.copy(MOON_BASE_ANCHOR);
  initializeAtmosphereControls();

  window.sakuraAtmosphere = {
    setTime: (time) => setAtmosphereState({ time }),
    setWeather: (weather) => setAtmosphereState({ weather }),
    getState: () => ({ ...atmosphereState }),
    getAccumulation: () => ({
      ...weatherAccumulation,
      footprints: footprintSpawnCount,
      splashes: splashSpawnCount
    })
  };

  const clock = new THREE.Clock();
  let renderedFrameIndex = 0;

  function animate() {
    requestAnimationFrame(animate);
    if (document.hidden) return;

    const delta = Math.min(clock.getDelta(), 0.05);
    const elapsed = clock.getElapsedTime();
    const tCycle = elapsed % CYCLE_DURATION;

    globalUniforms.uTime.value = elapsed;
    updateAtmosphere(delta, elapsed);

    // 1. Animate Commuter Train
    const trainStopX = -1.2;
    let trainX = -28.0;
    let trainSpeed = 0.0;
    let trainOpacity = 0.0;
    let doorSlide = 0.0;

    if (tCycle < 2.2) {
      trainX = -28.0;
      trainSpeed = 0.0;
      trainOpacity = 0.0;
    } else if (tCycle < 11.2) {
      const u = (tCycle - 2.2) / 9.0;
      const easeOut = 1.0 - Math.pow(1.0 - u, 2.6);
      trainX = THREE.MathUtils.lerp(-24.5, trainStopX, easeOut);
      trainSpeed = (1.0 - u) * 5.2;
      trainOpacity = smoothstep(2.2, 4.0, tCycle);
    } else if (tCycle < 16.4) {
      trainX = trainStopX;
      trainSpeed = 0.0;
      trainOpacity = 1.0;
      doorSlide = smoothstep(11.4, 12.2, tCycle) * (1.0 - smoothstep(15.2, 16.0, tCycle));
    } else if (tCycle < 25.8) {
      const u = (tCycle - 16.4) / 9.4;
      const easeIn = Math.pow(u, 2.2);
      trainX = THREE.MathUtils.lerp(trainStopX, 26.5, easeIn);
      trainSpeed = u * 6.0;
      trainOpacity = 1.0 - smoothstep(23.6, 25.6, tCycle);
    } else {
      trainX = 28.0;
      trainSpeed = 0.0;
      trainOpacity = 0.0;
    }

    const vibration = THREE.MathUtils.clamp(trainSpeed / 5.0, 0.0, 1.0) * trainOpacity;
    const crossingClosed = smoothstep(2.0, 3.2, tCycle) * (1.0 - smoothstep(23.4, 24.6, tCycle));

    globalUniforms.uTrainOpacity.value = trainOpacity;
    puddleUniforms.uTrainX.value = trainX;
    puddleUniforms.uTrainVibration.value = vibration;

    trainGroup.visible = trainOpacity > 0.01;
    trainGroup.position.x = trainX;

    trainCarBodies.forEach((body, idx) => {
      body.rotation.x = Math.sin(elapsed * 9.5 + idx * 1.4) * 0.0045 * vibration;
      body.position.y = Math.sin(elapsed * 14.0 + idx) * 0.003 * vibration;
    });

    trainWheels.forEach((w) => {
      w.rotation.z -= trainSpeed * delta * 2.8;
    });

    trainSlidingDoors.forEach((d) => {
      d.group.position.x = d.baseX + d.dir * doorSlide * 0.46;
    });

    // 2. Animate Sakura Tree Branches
    for (let i = 0; i < sakuraSwayBranches.length; i++) {
      const sb = sakuraSwayBranches[i];
      const windWave = Math.sin(elapsed * 1.65 + sb.phase) * 0.028 * sb.ampScale;
      const windWaveZ = Math.cos(elapsed * 1.35 + sb.phase * 0.8) * 0.022 * sb.ampScale;
      const distToTrain = Math.abs(sb.worldX - trainX);
      const trainGust = (sb.worldZ < -6.0 && distToTrain < 6.5)
        ? (1.0 - distToTrain / 6.5) * vibration * 0.045
        : 0.0;
      sb.group.rotation.x = windWave + trainGust * 0.5;
      sb.group.rotation.z = windWaveZ - trainGust;
    }

    // 3. Animate Road Vehicles
    let taxiX = 0, taxiZ = 11.4, taxiYaw = -Math.PI / 2, taxiSpeed = 0, taxiDoorAngle = 0;
    if (tCycle < 10.5) {
      const u = tCycle / 10.5;
      taxiX = THREE.MathUtils.lerp(-18.2, -5.8, u);
      taxiZ = 11.4;
      taxiYaw = -Math.PI / 2;
      taxiSpeed = 1.35;
    } else if (tCycle < 14.5) {
      const u = (tCycle - 10.5) / 4.0;
      const ease = smoothstep(0.0, 1.0, u);
      taxiX = THREE.MathUtils.lerp(-5.8, -0.8, ease);
      taxiZ = THREE.MathUtils.lerp(11.4, 10.3, ease);
      taxiYaw = -Math.PI / 2 + Math.sin(ease * Math.PI) * 0.22;
      taxiSpeed = (1.0 - ease * 0.85) * 1.35;
    } else if (tCycle < 19.0) {
      taxiX = -0.8;
      taxiZ = 10.3;
      taxiYaw = -Math.PI / 2;
      taxiSpeed = 0.0;
      const doorT = tCycle - 14.5;
      taxiDoorAngle = smoothstep(0.0, 0.9, doorT) * (1.0 - smoothstep(3.4, 4.2, doorT)) * 0.82;
    } else if (tCycle < 28.2) {
      const u = (tCycle - 19.0) / 9.2;
      const ease = Math.pow(u, 1.35);
      taxiX = THREE.MathUtils.lerp(-0.8, 18.2, ease);
      taxiZ = THREE.MathUtils.lerp(10.3, 11.4, smoothstep(0.0, 0.35, u));
      taxiYaw = -Math.PI / 2 - Math.sin(smoothstep(0.0, 0.35, u) * Math.PI) * 0.22;
      taxiSpeed = u * 2.4;
    } else {
      taxiX = 24.0;
      taxiZ = 11.4;
      taxiYaw = -Math.PI / 2;
      taxiSpeed = 0.0;
    }
    taxiVehicle.group.visible = tCycle < 28.2;
    taxiVehicle.group.position.set(taxiX, 0.25, taxiZ);
    taxiVehicle.group.rotation.y = taxiYaw;
    taxiVehicle.rearDoorPivot.rotation.y = -taxiDoorAngle;
    taxiVehicle.wheels.forEach((w) => { w.rotation.x += taxiSpeed * delta * 3.2; });

    let car1Z = 0, car1Speed = 0;
    if (tCycle < 9.5) {
      const u = tCycle / 9.5;
      const ease = 1.0 - Math.pow(1.0 - u, 2.0);
      car1Z = THREE.MathUtils.lerp(17.8, -9.5, ease);
      car1Speed = (1.0 - u) * 2.5;
    } else if (tCycle < 24.8) {
      car1Z = -9.5;
      car1Speed = 0.0;
    } else {
      const u = (tCycle - 24.8) / 5.2;
      const ease = Math.pow(u, 1.5);
      car1Z = THREE.MathUtils.lerp(-9.5, -18.4, ease);
      car1Speed = u * 2.8;
    }
    crossingCar1.group.position.set(12.95, 0.25, car1Z);
    crossingCar1.group.rotation.y = 0;
    crossingCar1.wheels.forEach((w) => { w.rotation.x -= car1Speed * delta * 3.2; });

    let car2Z = -17.6, car2Speed = 0;
    if (tCycle < 24.8) {
      car2Z = -17.6;
      car2Speed = 0.0;
    } else {
      const u = (tCycle - 24.8) / 5.2;
      const ease = smoothstep(0.0, 1.0, u);
      car2Z = THREE.MathUtils.lerp(-17.6, 17.8, ease);
      car2Speed = 3.2;
    }
    crossingCar2.group.position.set(15.05, 0.25, car2Z);
    crossingCar2.group.rotation.y = Math.PI;
    crossingCar2.wheels.forEach((w) => { w.rotation.x -= car2Speed * delta * 3.2; });

    // 4. Animate the 5 Characters
    function updateBoardingPassenger(actor, doorWorldX, seatRelX, waitDoneTime, phaseSeed, approachFn) {
      const seatTargetZ = trackCenterZ - 0.30;
      const aisleZ = trackCenterZ + 0.05;
      const seatFloorY = 1.48;

      if (tCycle < 11.55) {
        actor.group.visible = true;
        actor.fxStage = 0;
        approachFn(tCycle);
      } else if (tCycle < 12.05) {
        const uHop = (tCycle - 11.55) / 0.50;
        const hopArc = Math.sin(uHop * Math.PI) * 0.16;
        actor.group.visible = true;
        actor.group.position.set(doorWorldX, 1.38, -10.85);
        actor.group.rotation.y = Math.PI;
        setPersonRunBoardPose(actor, 1.8, elapsed, phaseSeed, hopArc, true, false);

        if (actor.fxStage !== 1) {
          actor.fxStage = 1;
          spawnBoardingEffect('ring', doorWorldX, 1.38, -10.85, 0, 0, 0, actor.charType);
          spawnBoardingEffect('signature', doorWorldX, 2.05, -10.85, 0, 0.45, 0, actor.charType);
        }
      } else if (tCycle < 13.25) {
        const rawU = THREE.MathUtils.clamp((tCycle - 12.05) / 1.20, 0.0, 1.0);
        const burstU = Math.pow(rawU, 0.78);
        const lateralSway = Math.sin(rawU * Math.PI * 3.0) * 0.065 * (1.0 - rawU);
        const leapWindow = THREE.MathUtils.clamp((rawU - 0.22) / 0.56, 0.0, 1.0);
        const hopArc = Math.sin(leapWindow * Math.PI) * 0.21;

        const curX = doorWorldX + lateralSway;
        const curY = THREE.MathUtils.lerp(1.38, seatFloorY, burstU);
        const curZ = THREE.MathUtils.lerp(-10.85, aisleZ, burstU);

        actor.group.visible = true;
        actor.group.position.set(curX, curY, curZ);
        actor.group.rotation.y = Math.PI;
        actor.moveDirWorld.set(lateralSway * 2.0, 0, -1).normalize();
        setPersonRunBoardPose(actor, 3.2, elapsed, phaseSeed, hopArc, hopArc > 0.13, true);

        if (!actor.nextFxTime || elapsed >= actor.nextFxTime) {
          actor.nextFxTime = elapsed + 0.095;
          spawnBoardingEffect(
            'puff',
            curX + (Math.random() - 0.5) * 0.16,
            curY + 0.08,
            curZ + 0.18,
            (Math.random() - 0.5) * 0.35,
            0.38 + Math.random() * 0.22,
            0.65,
            actor.charType
          );
          spawnBoardingEffect(
            'streak',
            curX + (Math.random() - 0.5) * 0.28,
            curY + 0.45 + Math.random() * 0.45,
            curZ + 0.32,
            0,
            0,
            1.4,
            actor.charType,
            Math.PI
          );
          if (Math.random() < 0.75) {
            spawnBoardingEffect(
              'signature',
              curX + (Math.random() - 0.5) * 0.32,
              curY + 0.48 + Math.random() * 0.45,
              curZ + 0.15,
              (Math.random() - 0.5) * 0.5,
              0.55 + Math.random() * 0.35,
              0.4,
              actor.charType
            );
          }
        }
      } else if (tCycle < 14.30) {
        const rawU = THREE.MathUtils.clamp((tCycle - 13.25) / 1.05, 0.0, 1.0);
        const runU = 1.0 - Math.pow(1.0 - rawU, 1.65);
        const targetSeatWorldX = trainX + seatRelX;
        const dirSign = Math.sign(targetSeatWorldX - doorWorldX) || 1;
        const seatHopWindow = THREE.MathUtils.clamp((rawU - 0.65) / 0.35, 0.0, 1.0);
        const hopArc = Math.sin(seatHopWindow * Math.PI) * 0.16;

        const curX = THREE.MathUtils.lerp(doorWorldX, targetSeatWorldX, runU);
        const curZ = THREE.MathUtils.lerp(aisleZ, seatTargetZ, smoothstep(0.55, 1.0, rawU));

        actor.group.visible = true;
        actor.group.position.set(curX, seatFloorY, curZ);
        actor.group.rotation.y = dirSign > 0 ? Math.PI / 2 : -Math.PI / 2;
        actor.moveDirWorld.set(dirSign, 0, 0);
        setPersonRunBoardPose(actor, 2.8, elapsed, phaseSeed, hopArc, seatHopWindow > 0.15, true);

        if (!actor.nextFxTime || elapsed >= actor.nextFxTime) {
          actor.nextFxTime = elapsed + 0.11;
          spawnBoardingEffect(
            'puff',
            curX - dirSign * 0.18,
            seatFloorY + 0.08,
            curZ,
            -dirSign * 0.55,
            0.32,
            (Math.random() - 0.5) * 0.25,
            actor.charType
          );
          spawnBoardingEffect(
            'streak',
            curX - dirSign * 0.28,
            seatFloorY + 0.48 + Math.random() * 0.35,
            curZ + 0.08,
            -dirSign * 1.2,
            0,
            0,
            actor.charType,
            dirSign > 0 ? Math.PI / 2 : -Math.PI / 2
          );
          spawnBoardingEffect(
            'signature',
            curX - dirSign * 0.15,
            seatFloorY + 0.55 + Math.random() * 0.35,
            curZ + 0.08,
            -dirSign * 0.45,
            0.48,
            0,
            actor.charType
          );
        }
      } else if (tCycle < 26.2) {
        const seatWorldX = trainX + seatRelX;
        if (actor.fxStage !== 2) {
          actor.fxStage = 2;
          spawnBoardingEffect('ring', seatWorldX, seatFloorY + 0.12, seatTargetZ, 0, 0, 0, actor.charType);
        }
        actor.group.visible = trainOpacity > 0.04 && Math.abs(seatWorldX) < HALF_BASE - 0.4;
        actor.group.position.set(seatWorldX, seatFloorY, seatTargetZ);
        actor.group.rotation.y = 0;
        setPersonSeatedPose(actor, elapsed, phaseSeed, true);
      } else {
        actor.group.visible = false;
      }
    }

    // 1) Miku: Waits on platform at Lead Car Middle Door (x = +3.65), boards & sits at Lead Car East bench
    updateBoardingPassenger(passengerBoardA, 3.65, 4.85 + 1.55, 8.0, 0.5, (t) => {
      const u = Math.min(1.0, t / 7.5);
      passengerBoardA.group.position.set(3.65, 1.38, THREE.MathUtils.lerp(-8.5, -10.85, u));
      passengerBoardA.group.rotation.y = Math.PI;
      setPersonWalkPose(passengerBoardA, u < 1.0 ? 1.05 : 0.0, elapsed, 0.5);
    });

    // 2) Mikoto 御坂美琴: Buys a drink at the forecourt vending machine (x = 4.30, z = -1.56),
    //    charges up surrounded by crackling lightning (4.55s -> 5.05s), then leaps Northeastward
    //    to the FAR RIGHT (East) open-air end of the platform (x = 8.85, z = -9.65, y = 1.38) —
    //    completely bypassing both the station building and the platform canopy!
    //    After landing at the far right of the platform, she sprints Westward along the platform
    //    (x: 8.85 -> -2.95) to catch the train!
    updateBoardingPassenger(passengerBoardB, -2.95, -4.85 + 1.55, 11.2, 1.7, (t) => {
      let px = -1.65;
      let pz = 3.2;
      let py = 0.38;
      let walkSpeed = 0.0;
      let facing = Math.PI;
      let jumpMode = false;
      let sprintOnPlatform = false;

      if (t < 2.1) {
        const u = smoothstep(0.0, 1.0, t / 2.1);
        px = THREE.MathUtils.lerp(-1.65, 4.30, u);
        pz = THREE.MathUtils.lerp(3.2, -1.56, u);
        walkSpeed = 2.45;
        facing = -Math.PI * 0.72;
      } else if (t < 4.55) {
        px = 4.30;
        pz = -1.56;
        facing = Math.PI;
        walkSpeed = 0.0;
      } else if (t < 5.05) {
        // Electromagnetic crouch charge surrounded by crackling 3D lightning cage
        const chargeU = (t - 4.55) / 0.50;
        px = 4.30;
        pz = -1.56;
        py = 0.38 - Math.sin(chargeU * Math.PI) * 0.11;
        facing = Math.PI * 0.82;
        jumpMode = true;
      } else if (t < 6.45) {
        // Ballistic electromagnetic leap to the far-right open end of the platform (x = 8.85, z = -9.45)
        // Completely clear of the station building (x <= 3.6) and platform canopy (x <= 6.6)!
        const u = smoothstep(0.0, 1.0, (t - 5.05) / 1.40);
        px = THREE.MathUtils.lerp(4.30, 8.85, u);
        pz = THREE.MathUtils.lerp(-1.56, -9.85, u);
        const baseGroundY = THREE.MathUtils.lerp(0.38, 1.38, u);
        py = baseGroundY + Math.sin(u * Math.PI) * 3.85;
        jumpMode = true;
        facing = Math.PI * 0.82;
      } else if (t < 10.85) {
        // Energetic sprint Westward from the far-right platform end (x = 8.85) to the train door (x = -2.95).
        // She keeps to z ≈ -9.85, midway between the waiting bench (z = -9.19) and Miku (z = -10.85),
        // who waits at z = -10.85 right in front of the lead car door until 11.55 s.
        const u = smoothstep(0.0, 1.0, (t - 6.45) / 4.40);
        px = THREE.MathUtils.lerp(8.85, -2.95, u);
        pz = THREE.MathUtils.lerp(-9.85, -10.85, smoothstep(0.78, 1.0, u));
        py = 1.38;

      }
      tripodFlash.visible = flashA > 0.02;
      tripodFlash.material.opacity = flashA * 0.78;
      tripodFlash.scale.setScalar(0.34 + 0.34 * flashA);
    }

    updateFootprintAndSplash(delta);

    // Ticket Gate Barrier Flaps
    const activePedestrians = [passengerBoardB];
    gateFlapPairs.forEach((fp) => {
      let someoneNear = false;
      for (let pIdx = 0; pIdx < activePedestrians.length; pIdx++) {
        const ped = activePedestrians[pIdx].group;
        if (
          ped.visible &&
          ped.position.y < 1.2 &&
          Math.abs(ped.position.x - fp.worldX) < 0.45 &&
          Math.abs(ped.position.z - (-5.3)) < 1.35
        ) {
          someoneNear = true;
          break;
        }
      }
      const targetAngle = someoneNear ? Math.PI * 0.46 : 0.0;
      fp.leftPivot.rotation.y += (targetAngle - fp.leftPivot.rotation.y) * Math.min(1.0, delta * 10.0);
      fp.rightPivot.rotation.y += (-targetAngle - fp.rightPivot.rotation.y) * Math.min(1.0, delta * 10.0);
    });

    // 5. Animate Fountain Water Droplets
    const gravity = 5.8;
    for (let i = 0; i < fountainDropCount; i++) {
      const d = fountainDropsData[i];
      const u = ((elapsed / d.period) + d.phase) % 1.0;
      const t = u * d.period;
      const r = d.r0 + d.vr * t;
      const y = Math.max(0.58, d.y0 + d.vy0 * t - 0.5 * gravity * t * t);
      const x = Math.cos(d.angle) * r;
      const z = Math.sin(d.angle) * r;

      dummy.position.set(x, y, z);
      dummy.rotation.set(0, -d.angle, 0);
      dummy.scale.set(0.85, 1.45, 0.85);
      dummy.updateMatrix();
      fountainDropsMesh.setMatrixAt(i, dummy.matrix);
    }
    fountainDropsMesh.instanceMatrix.needsUpdate = true;

    // 6. Animate Falling Sakura Petals & Train Slipstream Vortex
    puddleUniforms.uRippleAge.value += delta;
    for (let i = 0; i < fallingPetalCount; i++) {
      const p = petalData[i];
      const swayX = Math.sin(elapsed * 2.1 + p.phase) * 0.45;
      const swayZ = Math.cos(elapsed * 1.7 + p.phase) * 0.35;

      p.x += (p.vx + swayX) * delta;
      p.y += p.vy * delta;
      p.z += (p.vz + swayZ) * delta;

      const dxTrain = p.x - trainX;
      const dzTrain = p.z - trackCenterZ;
      if (Math.abs(dxTrain) < 6.5 && Math.abs(dzTrain) < 3.6 && trainSpeed > 1.0) {
        p.x += trainSpeed * 0.42 * delta;
        p.y += 1.65 * delta;
        p.z += Math.sign(dzTrain || 1) * 1.15 * delta;
      }

      p.rx += 2.2 * delta;
      p.ry += 1.8 * delta;

      const petalDistance = Math.hypot(p.x - p.tree.x, p.z - p.tree.z);
      if (p.y < p.tree.groundY + 0.04 || petalDistance > 5.2) {
        if (Math.abs(p.x + 7.8) < 1.1 && Math.abs(p.z + 8.8) < 1.1 && puddleUniforms.uRippleAge.value > 1.2) {
          puddleUniforms.uRippleCenter.value.set(p.x, p.z);
          puddleUniforms.uRippleAge.value = 0.0;
        }
        placePetalNearTree(p, p.tree, 2.8, 3.2);
      }

      dummy.position.set(p.x, p.y, p.z);
      dummy.rotation.set(p.rx, p.ry, p.rz);
      dummy.scale.setScalar(p.scale);
      dummy.updateMatrix();
      fallingPetalsMesh.setMatrixAt(i, dummy.matrix);
    }
    fallingPetalsMesh.instanceMatrix.needsUpdate = true;

    // 7. Animate Catenary & Overhead Wire Vibration
    const pantographWorldX = trainX - 2.2;
    for (let w = 0; w < dynamicWires.length; w++) {
      const wire = dynamicWires[w];
      const posAttr = wire.geo.attributes.position;
      const spanClose = wire.isCatenary && pantographWorldX >= wire.x1 - 1.5 && pantographWorldX <= wire.x2 + 1.5;
      for (let i = 0; i <= wire.segs; i++) {
        const u = i / wire.segs;
        const env = Math.sin(u * Math.PI);
        const breezeZ = Math.sin(elapsed * 2.0 + u * 3.14) * 0.025 * env;
        const vibY = spanClose ? Math.sin(elapsed * 38.0 + u * 12.0) * 0.032 * vibration * env : 0;
        posAttr.setY(i, wire.yBase - env * wire.sag + vibY);
        posAttr.setZ(i, wire.zBase + breezeZ);
      }
      posAttr.needsUpdate = true;
    }

    // 8. Animate Level Crossing Barriers, Warning Lights, Railway Signal, Clock & Ticket Gates
    barrierPivots.forEach((b) => {
      b.pivot.rotation.z = b.dir * (1.0 - crossingClosed) * (Math.PI * 0.44);
    });
    if (crossingClosed > 0.05) {
      const flash = Math.floor(elapsed * 4.5) % 2 === 0;
      warningLightMats[0].color.setHex(flash ? 0xff1744 : 0x241014);
      warningLightMats[1].color.setHex(flash ? 0x241014 : 0xff1744);
      warningGlowMats[0].opacity = flash ? 0.95 : 0.0;
      warningGlowMats[1].opacity = flash ? 0.0 : 0.95;
    } else {
      warningLightMats[0].color.setHex(0x241014);
      warningLightMats[1].color.setHex(0x241014);
      warningGlowMats[0].opacity = 0.0;
      warningGlowMats[1].opacity = 0.0;
    }

    sigGreenMat.emissiveIntensity = tCycle > 26.0 || tCycle < 2.0 ? 1.1 : 0.08;
    sigYellowMat.emissiveIntensity = tCycle >= 2.0 && tCycle < 11.8 ? 1.1 : 0.08;
    sigRedMat.emissiveIntensity = tCycle >= 11.8 && tCycle <= 26.0 ? 1.1 : 0.08;

    const fastBlink = (Math.floor(elapsed * 8.0) % 2 === 0) ? 1.0 : 0.08;
    const yellowPulse = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(elapsed * 14.0));

    let ewR = 0, ewY = 0, ewG = 0, ewPedR = 0, ewPedG = 0;
    if (tCycle < 18.5) {
      ewR = 1.0;
      ewPedR = 1.0;
    } else if (tCycle < 25.0) {
      ewG = 1.0;
      ewPedG = 1.0;
    } else if (tCycle < 28.0) {
      ewG = fastBlink;
      ewPedG = fastBlink;
    } else {
      ewY = yellowPulse;
      ewPedR = 1.0;
    }
    setSignalState(ewLightMats, ewR, ewY, ewG, ewPedR, ewPedG);

    let nsR = 0, nsY = 0, nsG = 0, nsPedR = 0, nsPedG = 0;
    if (tCycle < 12.5) {
      nsG = 1.0;
      nsPedG = 1.0;
    } else if (tCycle < 16.5) {
      nsG = fastBlink;
      nsPedG = fastBlink;
    } else if (tCycle < 18.5) {
      nsY = yellowPulse;
      nsPedR = 1.0;
    } else if (tCycle < 24.5) {
      nsR = 1.0;
      nsPedR = 1.0;
    } else {
      nsG = 1.0;
      nsPedG = 1.0;
    }
    setSignalState(nsLightMats, nsR, nsY, nsG, nsPedR, nsPedG);

    secondHandPivot.rotation.z = -Math.floor(elapsed) * (Math.PI * 2 / 60);

    gateIndicators.forEach((gi) => {
      gi.mat.emissiveIntensity = 0.45 + 0.55 * Math.sin(elapsed * 4.2 + gi.phase);
    });

    // 9. Animate Little Bird
    const bCycle = elapsed % 18.0;
    if (bCycle < 3.5) {
      const u = bCycle / 3.5;
      birdGroup.position.set(
        THREE.MathUtils.lerp(-15.0, -3.2, u),
        THREE.MathUtils.lerp(11.5, 7.12, smoothstep(0.0, 1.0, u)),
        THREE.MathUtils.lerp(-22.0, -15.1, u)
      );
      birdWingL.rotation.x = Math.sin(elapsed * 26.0) * 0.65;
      birdWingR.rotation.x = -Math.sin(elapsed * 26.0) * 0.65;
    } else if (bCycle < 14.5) {
      birdGroup.position.set(-3.2, 7.12 + Math.abs(Math.sin(elapsed * 5.0)) * 0.03, -15.1);
      birdGroup.rotation.y = Math.sin(elapsed * 2.2) * 0.35;
      birdWingL.rotation.x = 0;
      birdWingR.rotation.x = 0;
    } else {
      const u = (bCycle - 14.5) / 3.5;
      birdGroup.position.set(
        THREE.MathUtils.lerp(-3.2, 14.0, u),
        THREE.MathUtils.lerp(7.12, 12.5, u),
        THREE.MathUtils.lerp(-15.1, -21.0, u)
      );
      birdWingL.rotation.x = Math.sin(elapsed * 26.0) * 0.65;
      birdWingR.rotation.x = -Math.sin(elapsed * 26.0) * 0.65;
    }

    // 10. Update all codexpet.top HD-2D sprite billboards & animation frames
    updateAllCodexPetBillboards(elapsed);
    updateBoardingEffects(delta);

    renderer.shadowMap.needsUpdate = (renderedFrameIndex++ % 2) === 0;

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  window.onload = function () {
    animate();
  };
</script>
</body>
